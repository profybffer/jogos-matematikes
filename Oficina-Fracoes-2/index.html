      /* =======================================================================
         9. RENDERIZAÇÃO — ABA 4: DIVISÃO & DESAFIO RELÂMPAGO
         ======================================================================= */
      function buildDivSVG(preset, fitted) {
        const valA = preset.aN / preset.aD;
        const valB = preset.bN / preset.bD;
        const totalWholes = Math.max(1, Math.ceil(valA));
        const W = 620, H = 224, padX = 24;
        const fullW = W - padX * 2;
        const unitW = fullW / totalWholes;
        const yTop = 30, barH = 52;
        const targetW = valA * unitW;

        let svg = `<text x="${padX}" y="20" font-size="12.5" font-weight="900" fill="#2563eb">Alvo: ${preset.aD === 1 ? preset.aN + ' inteiros' : preset.aN + '/' + preset.aD}</text>`;
        for (let w = 0; w < totalWholes; w++) {
          svg += `<rect x="${(padX + w * unitW).toFixed(2)}" y="${yTop}" width="${unitW.toFixed(2)}" height="${barH}" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />`;
        }
        svg += `<rect x="${padX}" y="${yTop}" width="${targetW.toFixed(2)}" height="${barH}" rx="6" fill="#2563eb" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="2.5" />`;
        for (let w = 1; w < totalWholes; w++) {
          const xw = padX + w * unitW;
          svg += `<line x1="${xw.toFixed(2)}" y1="${yTop}" x2="${xw.toFixed(2)}" y2="${yTop + barH}" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="5,3" />`;
        }
        for (let w = 0; w <= totalWholes; w++) {
          svg += `<text x="${(padX + w * unitW).toFixed(2)}" y="${yTop + barH + 15}" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">${w}</text>`;
        }

        svg += `<line x1="${(padX + targetW).toFixed(2)}" y1="${yTop - 4}" x2="${(padX + targetW).toFixed(2)}" y2="192" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />`;

        const yBot = 122;
        svg += `<text x="${padX}" y="${yBot - 8}" font-size="12.5" font-weight="900" fill="#f97316">Encaixando blocos de ${preset.bN}/${preset.bD} (${fitted} de ${preset.q})</text>`;
        svg += `<rect x="${padX}" y="${yBot}" width="${targetW.toFixed(2)}" height="${barH}" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" />`;

        const pieceW = valB * unitW;
        for (let i = 0; i < fitted; i++) {
          const px = padX + i * pieceW;
          const isLast = i === fitted - 1;
          const isComplete = fitted === preset.q;
          svg += `
            <rect x="${(px + 1.5).toFixed(2)}" y="${yBot + 2}" width="${(pieceW - 3).toFixed(2)}" height="${barH - 4}" rx="6"
              fill="${isComplete ? '#10b981' : '#f97316'}" stroke="#0f172a" stroke-width="2"
              class="${isLast ? 'pulse-pop' : ''}" />
            <text x="${(px + pieceW / 2).toFixed(2)}" y="${yBot + 22}" text-anchor="middle" font-size="14.5" font-weight="900" fill="#ffffff">${i + 1}</text>
            <text x="${(px + pieceW / 2).toFixed(2)}" y="${yBot + 40}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">${preset.bN}/${preset.bD}</text>`;
        }

        if (fitted === preset.q) {
          svg += `<text x="${padX + targetW / 2}" y="208" text-anchor="middle" font-size="14" font-weight="900" fill="#047857">🎉 Couberam exatamente ${preset.q} blocos de ${preset.bN}/${preset.bD}!</text>`;
        }
        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
      }

      function buildQuizMiniSVG(kind) {
        if (kind === 'same-add') {
          let s = '';
          for (let i = 0; i < 5; i++) {
            const fill = i < 2 ? '#2563eb' : (i < 3 ? '#f97316' : '#fff');
            s += `<rect x="${20 + i * 72}" y="26" width="72" height="52" fill="${fill}" stroke="#0f172a" stroke-width="2.2" />`;
            s += `<text x="${56 + i * 72}" y="57" text-anchor="middle" font-size="14" font-weight="900" fill="${i < 3 ? '#fff' : '#94a3b8'}">1/5</text>`;
          }
          return `<svg viewBox="0 0 400 106" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'diff-eq') {
          let s = `<rect x="20" y="14" width="180" height="36" fill="#2563eb" stroke="#0f172a" stroke-width="2.2" />`;
          s += `<rect x="200" y="14" width="180" height="36" fill="#fff" stroke="#0f172a" stroke-width="2.2" />`;
          s += `<text x="110" y="37" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">1/2</text>`;
          s += `<rect x="20" y="64" width="120" height="36" fill="#f97316" stroke="#0f172a" stroke-width="2.2" />`;
          s += `<rect x="140" y="64" width="120" height="36" fill="#fff" stroke="#0f172a" stroke-width="2.2" />`;
          s += `<rect x="260" y="64" width="120" height="36" fill="#fff" stroke="#0f172a" stroke-width="2.2" />`;
          s += `<text x="80" y="87" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">1/3</text>`;
          for (let k = 1; k < 6; k++) {
            s += `<line x1="${20 + k * 60}" y1="12" x2="${20 + k * 60}" y2="104" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" />`;
          }
          return `<svg viewBox="0 0 400 112" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'same-sub') {
          let s = '';
          for (let i = 0; i < 8; i++) {
            const x = 16 + i * 46;
            const fill = i < 3 ? '#10b981' : (i < 5 ? '#fee2e2' : '#fff');
            s += `<rect x="${x}" y="26" width="46" height="52" fill="${fill}" stroke="#0f172a" stroke-width="2" />`;
            if (i >= 3 && i < 5) {
              s += `<line x1="${x + 6}" y1="32" x2="${x + 40}" y2="72" stroke="#dc2626" stroke-width="3" />`;
              s += `<line x1="${x + 40}" y1="32" x2="${x + 6}" y2="72" stroke="#dc2626" stroke-width="3" />`;
            }
          }
          return `<svg viewBox="0 0 400 106" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'nat-mul') {
          let s = '';
          for (let g = 0; g < 3; g++) {
            const ox = 16 + g * 126;
            s += `<rect x="${ox}" y="12" width="114" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />`;
            s += `<text x="${ox + 57}" y="32" text-anchor="middle" font-size="12" font-weight="900" fill="#2563eb">Grupo ${g + 1}</text>`;
            for (let i = 0; i < 5; i++) {
              s += `<rect x="${ox + 7 + i * 20}" y="44" width="20" height="34" fill="${i < 2 ? '#2563eb' : '#fff'}" stroke="#0f172a" stroke-width="1.4" />`;
            }
          }
          return `<svg viewBox="0 0 400 106" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'grid-mul') return buildAreaGridSVG(1, 2, 2, 3);

        // div-fit
        let s = `<rect x="20" y="16" width="180" height="36" fill="#2563eb" stroke="#0f172a" stroke-width="2.2" />`;
        s += `<rect x="200" y="16" width="180" height="36" fill="#fff" stroke="#cbd5e1" stroke-width="2" />`;
        s += `<text x="110" y="39" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">1/2</text>`;
        for (let i = 0; i < 3; i++) {
          s += `<rect x="${20 + i * 60}" y="64" width="60" height="36" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="4,3" />`;
          s += `<text x="${50 + i * 60}" y="87" text-anchor="middle" font-size="12" font-weight="900" fill="#f97316">1/6</text>`;
        }
        return `<svg viewBox="0 0 400 112" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
      }

      function renderTab4() {
        const t4 = state.t4;
        if (t4.submode === 'div') {
          const p = DIV_PRESETS[t4.presetIdx];
          const M = lcm(p.aD, p.bD);
          const eqA = p.aN * (M / p.aD);
          const eqB = p.bN * (M / p.bD);
          const done = t4.fitted === p.q;

          return `
            <div class="sub-shell">
              <div class="sub-toolbar">
                <div class="segmented">
                  <button class="active" data-t4-sub="div">📦 Quantas Cabem?</button>
                  <button data-t4-sub="quiz">⚡ Desafio Relâmpago</button>
                </div>
                <span class="badge badge-res">${p.label} ${done ? '= ' + p.q : '= ?'}</span>
              </div>

              <div class="two-col">
                <div class="card">
                  <div class="card-title">
                    <span>${p.text}</span>
                    <span class="badge badge-b">Blocos: ${t4.fitted} / ${p.q}</span>
                  </div>
                  <div class="svg-box">${buildDivSVG(p, t4.fitted)}</div>
                  <div class="stage-footer" style="justify-content:center;">
                    <button class="btn btn-b" id="divFitOne" ${done ? 'disabled' : ''}>▶ Encaixar +1 (${p.bN}/${p.bD})</button>
                    <button class="btn btn-res" id="divFitAll" ${done ? 'disabled' : ''}>Preencher tudo ▶</button>
                    <button class="btn" id="divReset" ${t4.fitted === 0 ? 'disabled' : ''}>↺ Reiniciar</button>
                  </div>
                </div>

                <div class="col-stack">
                  <div class="card" style="gap:8px;">
                    <div>
                      <div class="card-title" style="margin-bottom:4px;"><span>Inteiro ÷ Fração</span></div>
                      <div class="preset-grid">
                        ${DIV_PRESETS.filter(x => x.group === 'int').map(pr => {
                          const idx = DIV_PRESETS.indexOf(pr);
                          return `<button class="btn btn-sm ${t4.presetIdx === idx ? 'btn-a' : ''}" data-div-preset="${idx}">${pr.label}</button>`;
                        }).join('')}
                      </div>
                    </div>

                    <div>
                      <div class="card-title" style="margin-bottom:4px;"><span>Fração ÷ Fração</span></div>
                      <div class="preset-grid">
                        ${DIV_PRESETS.filter(x => x.group === 'fra').map(pr => {
                          const idx = DIV_PRESETS.indexOf(pr);
                          return `<button class="btn btn-sm ${t4.presetIdx === idx ? 'btn-a' : ''}" data-div-preset="${idx}">${pr.label}</button>`;
                        }).join('')}
                      </div>
                    </div>

                    <div class="eq-box" style="background:var(--unit-soft); border-color:var(--unit-border);">
                      <div class="card-title" style="margin-bottom:2px; color:var(--unit-color);"><span>🔍 Olhar da Mesma Unidade (1/${M})</span></div>
                      <div class="eq-line" style="font-size:15px;">
                        ${p.aD === 1 ? `<strong style="color:var(--a-color);">${p.aN}</strong>` : fracHTML(p.aN, p.aD, 'frac-sm', 'var(--a-color)')}
                        <span>÷</span>
                        ${fracHTML(p.bN, p.bD, 'frac-sm', 'var(--b-color)')}
                        <span>=</span>
                        ${fracHTML(eqA, M, 'frac-sm', 'var(--a-color)')}
                        <span>÷</span>
                        ${fracHTML(eqB, M, 'frac-sm', 'var(--b-color)')}
                        <span>=</span>
                        <span>${eqA} ÷ ${eqB}</span>
                        <span>=</span>
                        <strong style="color:var(--res-dark); font-size:19px;">${done ? p.q : '?'}</strong>
                      </div>
                      <div class="eq-reading">Com a mesma unidade 1/${M}, é só contar quantas peças cabem!</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
        } else {
          if (t4.quizDone) {
            const stars = '⭐'.repeat(t4.quizScore) + '☆'.repeat(QUIZ_POOL.length - t4.quizScore);
            return `
              <div class="sub-shell">
                <div class="sub-toolbar">
                  <div class="segmented">
                    <button data-t4-sub="div">📦 Quantas Cabem?</button>
                    <button class="active" data-t4-sub="quiz">⚡ Desafio Relâmpago</button>
                  </div>
                </div>
                <div class="card pulse-pop" style="flex:1; align-items:center; justify-content:center; gap:12px; text-align:center;">
                  <div style="font-size:36px;">${stars}</div>
                  <h2 style="font-size:21px; font-weight:900; color:var(--res-dark);">Desafio Concluído!</h2>
                  <p style="font-size:14.5px; color:var(--text-muted); max-width:440px;">
                    Você conquistou <strong>${t4.quizScore} de ${QUIZ_POOL.length}</strong> estrelas dominando todas as operações com frações!
                  </p>
                  <button class="btn btn-a" id="quizRestart">🔀 Jogar de Novo (Embaralhar)</button>
                </div>
              </div>`;
          }

          const q = QUIZ_POOL[t4.quizOrder[t4.quizIdx]];
          const pct = ((t4.quizIdx + (t4.quizSolved ? 1 : 0)) / QUIZ_POOL.length) * 100;

          return `
            <div class="sub-shell">
              <div class="sub-toolbar">
                <div class="segmented">
                  <button data-t4-sub="div">📦 Quantas Cabem?</button>
                  <button class="active" data-t4-sub="quiz">⚡ Desafio Relâmpago</button>
                </div>
                <div style="display:flex; align-items:center; gap:7px;">
                  <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
                  <span class="badge badge-gold">⭐ ${t4.quizScore}/${QUIZ_POOL.length}</span>
                  ${t4.quizStreak >= 2 ? `<span class="badge badge-unit pulse-pop">🔥 ${t4.quizStreak}</span>` : ''}
                </div>
              </div>

              <div class="two-col">
                <div class="card">
                  <div class="card-title">
                    <span>Pergunta ${t4.quizIdx + 1} de ${QUIZ_POOL.length}</span>
                    <span class="badge badge-a">${q.tag}</span>
                  </div>
                  <div style="font-size:15.5px; font-weight:900; color:var(--text-main); margin-bottom:6px;">${q.prompt}</div>
                  <div class="svg-box">${buildQuizMiniSVG(q.visual)}</div>
                </div>

                <div class="card card-scroll" style="justify-content:space-between; gap:8px;">
                  <div class="card-title"><span>Escolha a resposta certa</span></div>
                  <div class="quiz-opts">
                    ${q.opts.map((o, idx) => {
                      const isWrong = t4.quizWrongIdxs.includes(idx);
                      const cls = (t4.quizSolved && o.ok) ? 'is-correct pulse-pop' : (isWrong ? 'is-wrong' : '');
                      return `
                        <button class="quiz-opt-btn ${cls}" data-quiz-opt="${idx}" ${t4.quizSolved || isWrong ? 'disabled' : ''}>
                          ${o.html}
                          ${t4.quizSolved && o.ok ? '<span>✓</span>' : (isWrong ? '<span>✗</span>' : '')}
                        </button>`;
                    }).join('')}
                  </div>

                  ${t4.quizFeedback
                    ? `<div class="feedback-box ${t4.quizFeedback.ok ? 'ok pulse-pop' : 'err'}">${t4.quizFeedback.msg}</div>`
                    : `<div style="font-size:12px; color:var(--text-light); text-align:center;">Observe o desenho ao lado e toque na alternativa correta!</div>`}

                  <button class="btn ${t4.quizSolved ? 'btn-res pulse-pop' : ''}" id="quizNext" style="width:100%;">
                    ${t4.quizSolved
                      ? (t4.quizIdx + 1 < QUIZ_POOL.length ? 'Próxima Pergunta ▶' : 'Ver Resultado Final 🏆')
                      : 'Pular Pergunta ▶'}
                  </button>
                </div>
              </div>
            </div>`;
        }
      }

      /* =======================================================================
         10. ORQUESTRAÇÃO DA UI E EVENTOS
         ======================================================================= */
      const tabStage = document.getElementById('tabStage');
      const guideText = document.getElementById('guideText');
      const stepCounter = document.getElementById('stepCounter');
      const stepTitle = document.getElementById('stepTitle');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const soundToggle = document.getElementById('soundToggle');

      function render() {
        TimerBag.clearAll();
        const t = state.activeTab;
        const stepsArr = TAB_STEPS[t];
        const sIdx = state.steps[t];
        const curStep = stepsArr[sIdx];

        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
          const on = idx === t;
          btn.classList.toggle('active', on);
          btn.setAttribute('aria-selected', String(on));
        });

        guideText.innerHTML = curStep.guide;
        stepCounter.textContent = `${sIdx + 1} / ${stepsArr.length}`;
        stepTitle.textContent = curStep.title;
        btnPrev.disabled = sIdx === 0;
        btnNext.disabled = sIdx === stepsArr.length - 1;

        if (t === 0) tabStage.innerHTML = renderTab1();
        else if (t === 1) tabStage.innerHTML = renderTab2();
        else if (t === 2) tabStage.innerHTML = renderTab3();
        else if (t === 3) tabStage.innerHTML = renderTab4();

        bindEvents();
      }

      function triggerStageAnim(cfg, onDoneState) {
        // Primeiro garante o estado visual pré-animação, depois dispara a transição física
        runPhysicalAnimation(cfg, () => {
          onDoneState();
          render();
        });
      }

      function bindEvents() {
        const t = state.activeTab;

        // --- Eventos Aba 1 ---
        if (t === 0) {
          tabStage.querySelectorAll('[data-t1-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              const pr = T1_PRESETS[Number(btn.dataset.t1Preset)];
              state.t1 = { op: pr.op, den: pr.den, a: pr.a, b: pr.b, animated: false };
              SoundFX.click();
              render();
            });
          });
          tabStage.querySelectorAll('[data-t1-op]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.t1.op = btn.dataset.t1Op;
              state.t1.animated = false;
              SoundFX.click();
              render();
            });
          });
          document.getElementById('t1SwapAB')?.addEventListener('click', () => {
            const tmp = state.t1.a;
            state.t1.a = state.t1.b;
            state.t1.b = tmp;
            state.t1.animated = false;
            SoundFX.click();
            render();
          });
          document.getElementById('t1RunAnim')?.addEventListener('click', () => {
            const { op, den, a, b } = state.t1;
            if (op === '-' && b > a) return;
            if (state.t1.animated) {
              state.t1.animated = false;
              render();
            }
            triggerStageAnim({ stageId: 't1Stage', op, aN: a, aD: den, bN: b, bD: den }, () => {
              state.t1.animated = true;
            });
          });
          document.getElementById('t1DenInc')?.addEventListener('click', () => {
            if (state.t1.den < 10) { state.t1.den++; state.t1.animated = false; SoundFX.click(); render(); }
          });
          document.getElementById('t1DenDec')?.addEventListener('click', () => {
            if (state.t1.den > 2) {
              state.t1.den--;
              state.t1.a = Math.min(state.t1.a, state.t1.den);
              state.t1.b = Math.min(state.t1.b, state.t1.den);
              state.t1.animated = false;
              SoundFX.click();
              render();
            }
          });
          document.getElementById('t1AInc')?.addEventListener('click', () => {
            if (state.t1.a < state.t1.den) { state.t1.a++; state.t1.animated = false; SoundFX.click(); render(); }
          });
          document.getElementById('t1ADec')?.addEventListener('click', () => {
            if (state.t1.a > 1) { state.t1.a--; state.t1.animated = false; SoundFX.click(); render(); }
          });
          document.getElementById('t1BInc')?.addEventListener('click', () => {
            if (state.t1.b < state.t1.den) { state.t1.b++; state.t1.animated = false; SoundFX.click(); render(); }
          });
          document.getElementById('t1BDec')?.addEventListener('click', () => {
            if (state.t1.b > 1) { state.t1.b--; state.t1.animated = false; SoundFX.click(); render(); }
          });
        }

        // --- Eventos Aba 2 ---
        if (t === 1) {
          tabStage.querySelectorAll('[data-t2-mode]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.t2.mode = btn.dataset.t2Mode;
              state.t2.animated = false;
              SoundFX.tab();
              render();
            });
          });

          if (state.t2.mode === 'hand') {
            tabStage.querySelectorAll('[data-t2h-lvl]').forEach(btn => {
              btn.addEventListener('click', () => {
                const raw = btn.dataset.t2hLvl;
                if (raw === 'free') {
                  state.t2.level = 'free';
                  state.t2.mA = 1; state.t2.mB = 1; state.t2.animated = false;
                } else {
                  loadHandChallenge(Number(raw), 0);
                }
                SoundFX.tab();
                render();
              });
            });

            document.getElementById('t2hNextCh')?.addEventListener('click', () => {
              loadHandChallenge(state.t2.level, state.t2.idx + 1);
              SoundFX.step();
              render();
            });

            tabStage.querySelectorAll('[data-t2h-m]').forEach(btn => {
              btn.addEventListener('click', () => {
                const [side, kStr] = btn.dataset.t2hM.split(':');
                const k = Number(kStr);
                if (side === 'a') state.t2.mA = k;
                else state.t2.mB = k;
                state.t2.animated = false;

                if (state.t2.aD * state.t2.mA === state.t2.bD * state.t2.mB) SoundFX.match();
                else SoundFX.click();
                render();
              });
            });

            tabStage.querySelectorAll('[data-t2h-op]').forEach(btn => {
              btn.addEventListener('click', () => {
                state.t2.op = btn.dataset.t2hOp;
                state.t2.animated = false;
                SoundFX.click();
                render();
              });
            });

            tabStage.querySelectorAll('[data-t2h-free]').forEach(btn => {
              btn.addEventListener('click', () => {
                const [field, dStr] = btn.dataset.t2hFree.split(':');
                state.t2[field] += Number(dStr);
                state.t2.aD = Math.max(2, Math.min(8, state.t2.aD));
                state.t2.bD = Math.max(2, Math.min(8, state.t2.bD));
                state.t2.aN = Math.max(1, Math.min(state.t2.aD, state.t2.aN));
                state.t2.bN = Math.max(1, Math.min(state.t2.bD, state.t2.bN));
                state.t2.mA = 1; state.t2.mB = 1; state.t2.animated = false;
                SoundFX.click();
                render();
              });
            });

            document.getElementById('t2hSwapAB')?.addEventListener('click', () => {
              const { aN, aD, bN, bD, mA, mB } = state.t2;
              state.t2.aN = bN; state.t2.aD = bD; state.t2.mA = mB;
              state.t2.bN = aN; state.t2.bD = aD; state.t2.mB = mA;
              state.t2.animated = false;
              SoundFX.click();
              render();
            });

            document.getElementById('t2hRunAnim')?.addEventListener('click', () => {
              const eqAN = state.t2.aN * state.t2.mA;
              const eqAD = state.t2.aD * state.t2.mA;
              const eqBN = state.t2.bN * state.t2.mB;
              const eqBD = state.t2.bD * state.t2.mB;
              if (eqAD !== eqBD) return;
              if (state.t2.op === '-' && eqBN > eqAN) return;

              if (state.t2.animated) {
                state.t2.animated = false;
                render();
              }
              triggerStageAnim({
                stageId: 't2HandStage', op: state.t2.op,
                aN: eqAN, aD: eqAD, bN: eqBN, bD: eqBD
              }, () => {
                state.t2.animated = true;
              });
            });
          } else {
            // Máquina 3 Passos
            const playMachineStep2 = () => {
              const M = lcm(state.t2.mAD, state.t2.mBD);
              const eqA = state.t2.mAN * (M / state.t2.mAD);
              const eqB = state.t2.mBN * (M / state.t2.mBD);
              if (state.t2.mOp === '-' && eqB > eqA) {
                state.t2.mStep = 2;
                render();
                return;
              }
              state.t2.mStep = 1;
              render();
              triggerStageAnim({
                stageId: 't2MachStage', op: state.t2.mOp,
                aN: eqA, aD: M, bN: eqB, bD: M
              }, () => {
                state.t2.mStep = 2;
              });
            };

            tabStage.querySelectorAll('[data-t2m-step]').forEach(btn => {
              btn.addEventListener('click', () => {
                const s = Number(btn.dataset.t2mStep);
                if (s === 2) { playMachineStep2(); return; }
                state.t2.mStep = s;
                if (s === 1) SoundFX.match();
                else SoundFX.click();
                render();
              });
            });

            document.getElementById('t2mAdvance')?.addEventListener('click', () => {
              if (state.t2.mStep === 0) {
                state.t2.mStep = 1;
                SoundFX.match();
                render();
              } else {
                playMachineStep2();
              }
            });

            tabStage.querySelectorAll('[data-t2m-op]').forEach(btn => {
              btn.addEventListener('click', () => {
                state.t2.mOp = btn.dataset.t2mOp;
                state.t2.mStep = 0;
                SoundFX.click();
                render();
              });
            });

            document.getElementById('t2mSwapAB')?.addEventListener('click', () => {
              const { mAN, mAD, mBN, mBD } = state.t2;
              state.t2.mAN = mBN; state.t2.mAD = mBD;
              state.t2.mBN = mAN; state.t2.mBD = mAD;
              state.t2.mStep = 0;
              SoundFX.click();
              render();
            });

            tabStage.querySelectorAll('[data-t2m-preset]').forEach(btn => {
              btn.addEventListener('click', () => {
                const pr = MACHINE_PRESETS[Number(btn.dataset.t2mPreset)];
                state.t2.mOp = pr.op;
                state.t2.mAN = pr.aN; state.t2.mAD = pr.aD;
                state.t2.mBN = pr.bN; state.t2.mBD = pr.bD;
                state.t2.mStep = 0;
                SoundFX.click();
                render();
              });
            });

            tabStage.querySelectorAll('[data-t2m-adj]').forEach(btn => {
              btn.addEventListener('click', () => {
                const [field, dStr] = btn.dataset.t2mAdj.split(':');
                state.t2[field] += Number(dStr);
                state.t2.mAD = Math.max(2, Math.min(8, state.t2.mAD));
                state.t2.mBD = Math.max(2, Math.min(8, state.t2.mBD));
                state.t2.mAN = Math.max(1, Math.min(state.t2.mAD, state.t2.mAN));
                state.t2.mBN = Math.max(1, Math.min(state.t2.mBD, state.t2.mBN));
                state.t2.mStep = 0;
                SoundFX.click();
                render();
              });
            });
          }
        }

        // --- Eventos Aba 3 ---
        if (t === 2) {
          tabStage.querySelectorAll('[data-t3-sub]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.t3.submode = btn.dataset.t3Sub;
              SoundFX.tab();
              render();
            });
          });

          tabStage.querySelectorAll('[data-t3-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              const pr = MUL_PRESETS[Number(btn.dataset.t3Preset)];
              state.t3.gA = pr.a; state.t3.gB = pr.b;
              state.t3.gC = pr.c; state.t3.gD = pr.d;
              state.t3.gStep = 0; state.t3.gShownCells = 0;
              SoundFX.click();
              render();
            });
          });

          tabStage.querySelectorAll('[data-t3-gstep]').forEach(btn => {
            btn.addEventListener('click', () => {
              const s = Number(btn.dataset.t3Gstep);
              state.t3.gStep = s;
              state.t3.gShownCells = s === 4 ? state.t3.gA * state.t3.gC : 0;
              if (s === 1 || s === 3) SoundFX.cut();
              else if (s === 4) SoundFX.success();
              else SoundFX.click();
              render();
            });
          });

          document.getElementById('t3AnimMov')?.addEventListener('click', () => {
            const totalCells = state.t3.gA * state.t3.gC;
            state.t3.gStep = 0;
            state.t3.gShownCells = 0;
            render();

            // Passo 1: Cortes verticais
            TimerBag.set(() => {
              state.t3.gStep = 1;
              SoundFX.cut();
              render();
            }, 420);

            // Passo 2: Pintar 'a' colunas
            TimerBag.set(() => {
              state.t3.gStep = 2;
              SoundFX.snap(2);
              render();
            }, 1150);

            // Passo 3: Cortes horizontais em todas as peças
            TimerBag.set(() => {
              state.t3.gStep = 3;
              SoundFX.cut();
              render();
            }, 1950);

            // Passo 4: Pintar 'c/d' e numerar células verdes uma a uma
            TimerBag.set(() => {
              state.t3.gStep = 4;
              state.t3.gShownCells = 0;
              render();

              for (let k = 1; k <= totalCells; k++) {
                TimerBag.set(() => {
                  state.t3.gShownCells = k;
                  if (k === totalCells) SoundFX.success();
                  else SoundFX.snap(k - 1);
                  const box = document.getElementById('t3GridSvgBox');
                  if (box) {
                    box.innerHTML = buildAreaGridSVG(
                      state.t3.gA, state.t3.gB, state.t3.gC, state.t3.gD, 4, k
                    );
                  }
                }, 260 + (k - 1) * 200);
              }
            }, 2750);
          });

          document.getElementById('t3AnimCount')?.addEventListener('click', () => {
            const total = state.t3.n * state.t3.a;
            state.t3.natShown = 0;
            render();
            for (let k = 1; k <= total; k++) {
              TimerBag.set(() => {
                state.t3.natShown = k;
                if (k === total) SoundFX.success();
                else SoundFX.snap(k - 1);
                // Atualiza apenas o SVG para não perder foco
                const box = tabStage.querySelector('.svg-box');
                if (box) box.innerHTML = buildNatMulSVG(state.t3.n, state.t3.a, state.t3.b, state.t3.natShown);
              }, k * 140);
            }
          });

          tabStage.querySelectorAll('[data-t3-nat]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [field, dStr] = btn.dataset.t3Nat.split(':');
              state.t3[field] += Number(dStr);
              state.t3.n = Math.max(1, Math.min(6, state.t3.n));
              state.t3.b = Math.max(2, Math.min(8, state.t3.b));
              state.t3.a = Math.max(1, Math.min(state.t3.b, state.t3.a));
              state.t3.natShown = state.t3.n * state.t3.a;
              SoundFX.snap(state.t3.natShown);
              render();
            });
          });

          tabStage.querySelectorAll('[data-t3-grid]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [field, dStr] = btn.dataset.t3Grid.split(':');
              state.t3[field] += Number(dStr);
              state.t3.gB = Math.max(2, Math.min(6, state.t3.gB));
              state.t3.gD = Math.max(2, Math.min(6, state.t3.gD));
              state.t3.gA = Math.max(1, Math.min(state.t3.gB, state.t3.gA));
              state.t3.gC = Math.max(1, Math.min(state.t3.gD, state.t3.gC));
              state.t3.gStep = 4;
              state.t3.gShownCells = state.t3.gA * state.t3.gC;
              SoundFX.click();
              render();
            });
          });
        }

        // --- Eventos Aba 4 ---
        if (t === 3) {
          tabStage.querySelectorAll('[data-t4-sub]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.t4.submode = btn.dataset.t4Sub;
              SoundFX.tab();
              render();
            });
          });

          tabStage.querySelectorAll('[data-div-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.t4.presetIdx = Number(btn.dataset.divPreset);
              state.t4.fitted = 0;
              SoundFX.click();
              render();
            });
          });

          document.getElementById('divFitOne')?.addEventListener('click', () => {
            const p = DIV_PRESETS[state.t4.presetIdx];
            if (state.t4.fitted < p.q) {
              state.t4.fitted++;
              if (state.t4.fitted === p.q) SoundFX.success();
              else SoundFX.snap(state.t4.fitted - 1);
              render();
            }
          });

          document.getElementById('divFitAll')?.addEventListener('click', () => {
            const p = DIV_PRESETS[state.t4.presetIdx];
            const start = state.t4.fitted;
            for (let k = start + 1; k <= p.q; k++) {
              TimerBag.set(() => {
                state.t4.fitted = k;
                if (k === p.q) SoundFX.success();
                else SoundFX.snap(k - 1);
                render();
              }, (k - start) * 140);
            }
          });

          document.getElementById('divReset')?.addEventListener('click', () => {
            state.t4.fitted = 0;
            SoundFX.click();
            render();
          });

          tabStage.querySelectorAll('[data-quiz-opt]').forEach(btn => {
            btn.addEventListener('click', () => {
              if (state.t4.quizSolved) return;
              const idx = Number(btn.dataset.quizOpt);
              const q = QUIZ_POOL[state.t4.quizOrder[state.t4.quizIdx]];
              const opt = q.opts[idx];

              if (opt.ok) {
                state.t4.quizSolved = true;
                state.t4.quizStreak = state.t4.quizWrongIdxs.length === 0 ? state.t4.quizStreak + 1 : 1;
                state.t4.quizScore++;
                state.t4.quizFeedback = { ok: true, msg: `🎉 ${opt.why}` };
                SoundFX.success();
              } else {
                state.t4.quizStreak = 0;
                state.t4.quizWrongIdxs.push(idx);
                state.t4.quizFeedback = { ok: false, msg: `💡 ${opt.why} Tente outra opção!` };
                SoundFX.softErr();
              }
              render();
            });
          });

          document.getElementById('quizNext')?.addEventListener('click', () => {
            if (state.t4.quizIdx + 1 < QUIZ_POOL.length) {
              state.t4.quizIdx++;
              state.t4.quizSolved = false;
              state.t4.quizWrongIdxs = [];
              state.t4.quizFeedback = null;
              SoundFX.step();
            } else {
              state.t4.quizDone = true;
              SoundFX.success();
            }
            render();
          });

          document.getElementById('quizRestart')?.addEventListener('click', () => {
            resetQuiz(true);
            SoundFX.tab();
            render();
          });
        }
      }

      /* =======================================================================
         11. CONTROLES GLOBAIS (ABAS, RODAPÉ ◀ 1/4 ▶, SOM, TECLADO)
         ======================================================================= */
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.tab);
          if (idx === state.activeTab) return;
          state.activeTab = idx;
          TAB_STEPS[idx][state.steps[idx]].apply();
          SoundFX.tab();
          render();
        });
      });

      btnPrev.addEventListener('click', () => {
        const t = state.activeTab;
        if (state.steps[t] > 0) {
          state.steps[t]--;
          TAB_STEPS[t][state.steps[t]].apply();
          SoundFX.step();
          render();
        }
      });

      btnNext.addEventListener('click', () => {
        const t = state.activeTab;
        if (state.steps[t] < TAB_STEPS[t].length - 1) {
          state.steps[t]++;
          TAB_STEPS[t][state.steps[t]].apply();
          SoundFX.step();
          render();
        }
      });

      soundToggle.addEventListener('click', () => {
        const on = SoundFX.toggle();
        soundToggle.textContent = on ? '🔊' : '🔇';
        soundToggle.classList.toggle('muted', !on);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && !btnNext.disabled) btnNext.click();
        if (e.key === 'ArrowLeft' && !btnPrev.disabled) btnPrev.click();
      });

      // Inicialização limpa na Aba 1, Etapa 1
      TAB_STEPS[0][0].apply();
      render();
    });
  </script>
