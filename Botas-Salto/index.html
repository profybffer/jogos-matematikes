<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Botas de Salto — Matematikês v1.0</title>
  <style>
    /* =========================================================
       TOKENS VISUAIS — LABORATÓRIO PEDAGÓGICO (ALTO CONTRASTE)
       ========================================================= */
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-slate: #cbd5e1;
      --border-light: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --blue-main: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-soft: #eff6ff;

      --green-main: #10b981;
      --green-dark: #047857;
      --green-soft: #ecfdf5;

      --amber-main: #f59e0b;
      --amber-dark: #b45309;
      --amber-soft: #fffbeb;

      --purple-main: #7c3aed;
      --purple-soft: #f5f3ff;

      --rose-main: #e11d48;
      --rose-soft: #fff1f2;

      --teal-main: #0d9488;
      --teal-soft: #f0fdfa;

      /* Cor ativa da bota (atualizada via JS) */
      --boot-color: #2563eb;
      --boot-soft: #eff6ff;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* =========================================================
       BARRA SUPERIOR COMPACTA
       ========================================================= */
    .topbar {
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--border-light);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background-color: var(--blue-main);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-tabs {
      display: flex;
      gap: 4px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }

    .mode-tab:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.75);
    }

    .mode-tab.active {
      background-color: var(--blue-main);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .top-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 36px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-slate);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .top-btn:hover {
      border-color: var(--blue-main);
      color: var(--blue-main);
      background-color: var(--blue-soft);
    }

    .top-btn:active {
      transform: scale(0.96);
    }

    .top-btn.btn-panel-open {
      background-color: var(--blue-main);
      border-color: var(--blue-main);
      color: #ffffff;
    }

    .top-btn.audio-muted {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      border-color: var(--border-light);
    }

    /* =========================================================
       ÁREA CENTRAL FLUIDA (flex: 1; min-height: 0)
       ========================================================= */
    .stage-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 14px;
      gap: 8px;
      overflow: hidden;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .quick-strip {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .quick-strip:empty {
      display: none;
    }

    .strip-divider {
      width: 1.5px;
      height: 22px;
      background-color: var(--border-slate);
      margin: 0 2px;
    }

    .boot-pill {
      border: 2px solid var(--border-slate);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.84rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .boot-pill:hover {
      border-color: var(--boot-color);
    }

    .boot-pill.active {
      background-color: var(--boot-color);
      border-color: var(--boot-color);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .mode-pill {
      border: 1.5px solid var(--border-slate);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s;
      white-space: nowrap;
    }

    .mode-pill.active {
      background-color: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .stage-box {
      flex: 1;
      min-height: 0;
      width: 100%;
      background-color: var(--bg-card);
      border: 2px solid var(--border-slate);
      border-radius: var(--radius-lg);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.25s, background-color 0.25s;
    }

    .stage-box.stage-done {
      border-color: var(--green-main);
      background-color: #f0fdf4;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      touch-action: manipulation;
    }

    /* =========================================================
       MODO 1: TRILHA 0 A 20 (RETA CONTÍNUA DESLIZANTE)
       ========================================================= */
    .track-viewport {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border-slate) transparent;
    }

    .track-viewport::-webkit-scrollbar {
      height: 7px;
    }

    .track-viewport::-webkit-scrollbar-track {
      background: transparent;
    }

    .track-viewport::-webkit-scrollbar-thumb {
      background-color: var(--border-slate);
      border-radius: 999px;
    }

    .track-svg {
      flex-shrink: 0;
      display: block;
      touch-action: pan-x;
    }

    .track-rail {
      stroke: var(--border-slate);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .track-tile {
      cursor: pointer;
    }

    .track-tile-rect {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 2.5;
      transition: fill 0.18s, stroke 0.18s;
    }

    .track-tile:hover .track-tile-rect {
      stroke: var(--boot-color);
      fill: var(--boot-soft);
    }

    .track-tile.visited .track-tile-rect {
      fill: var(--boot-soft);
      stroke: var(--boot-color);
      stroke-width: 3;
    }

    .track-tile.current .track-tile-rect {
      fill: var(--boot-color);
      stroke: #0f172a;
      stroke-width: 3.5;
    }

    .track-tile.hint-target .track-tile-rect {
      stroke: var(--amber-main);
      stroke-width: 4.5;
      animation: tilePulse 0.85s ease-in-out infinite;
    }

    .track-tile.wrong-tile .track-tile-rect {
      fill: #fef2f2;
      stroke: #ef4444;
      stroke-width: 4;
    }

    .track-tile.target-goal .track-tile-rect {
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-dasharray: 6 4;
      fill: #fffbeb;
    }

    .track-tile.target-goal.current .track-tile-rect {
      fill: #10b981;
      stroke: #047857;
      stroke-dasharray: none;
    }

    .track-tile.target-goal .track-tile-num {
      fill: #b45309;
    }

    .track-tile.target-goal.current .track-tile-num {
      fill: #ffffff;
    }

    .meeting-beam {
      fill: rgba(16, 185, 129, 0.16);
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-dasharray: 6 4;
      pointer-events: none;
    }

    .meeting-badge-bg {
      fill: #047857;
      pointer-events: none;
    }

    .meeting-badge-txt {
      font-size: 12px;
      font-weight: 900;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .boot-action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .boot-action-btn {
      border: 2px solid var(--btn-color, #2563eb);
      background-color: var(--btn-soft, #eff6ff);
      color: var(--btn-color, #2563eb);
      font-size: 0.88rem;
      font-weight: 900;
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: transform 0.12s, background-color 0.15s, color 0.15s, opacity 0.15s;
    }

    .boot-action-btn:hover:not(:disabled) {
      background-color: var(--btn-color, #2563eb);
      color: #ffffff;
    }

    .boot-action-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .boot-action-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .meeting-summary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: #ecfdf5;
      border: 1.5px solid #10b981;
      color: #047857;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .track-tile-num {
      font-size: 22px;
      font-weight: 900;
      fill: #334155;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .track-tile.visited .track-tile-num {
      fill: var(--boot-color);
    }

    .track-tile.current .track-tile-num {
      fill: #ffffff;
    }

    .jump-arc {
      fill: none;
      stroke: var(--boot-color);
      stroke-width: 4;
      stroke-linecap: round;
      pointer-events: none;
    }

    .jump-arc.dashed {
      stroke-dasharray: 7 6;
      opacity: 0.72;
    }

    .jump-label-bg {
      fill: var(--boot-color);
      pointer-events: none;
    }

    .jump-label-txt {
      font-size: 12px;
      font-weight: 900;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    @keyframes tilePulse {
      0%, 100% { fill: #fffbeb; }
      50% { fill: #fde68a; }
    }

    /* =========================================================
       MODO 2: QUADRO DECIMAL 1 A 100 (GRADE 10x10 SEM SCROLL)
       ========================================================= */
    .grid100-wrap {
      width: 100%;
      height: 100%;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .grid100 {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 4px;
    }

    .g-cell {
      border: 1.5px solid var(--border-light);
      border-radius: 7px;
      background-color: #ffffff;
      color: var(--text-primary);
      font-size: clamp(0.72rem, 1.85vmin, 1.15rem);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      padding: 0;
      transition: transform 0.1s, background-color 0.16s, border-color 0.16s;
      font-variant-numeric: tabular-nums;
    }

    .g-cell:hover {
      border-color: var(--boot-color);
      background-color: var(--boot-soft);
    }

    .g-cell.col-guide {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .g-cell.visited {
      background-color: var(--boot-soft);
      border-color: var(--boot-color);
      color: var(--boot-color);
      font-weight: 900;
    }

    .g-cell.start-cell {
      box-shadow: inset 0 0 0 2px #0f172a;
    }

    .g-cell.current {
      background-color: var(--boot-color);
      border-color: #0f172a;
      color: #ffffff;
      font-weight: 900;
      transform: scale(1.04);
      z-index: 2;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
    }

    .g-cell.hint-target {
      border-color: var(--amber-main);
      background-color: #fef3c7;
      animation: cellBlink 0.8s ease-in-out infinite;
    }

    .g-cell.wrong-cell {
      background-color: #fef2f2;
      border-color: #ef4444;
      color: #dc2626;
      animation: gentleShake 0.32s ease;
    }

    .g-cell .cell-badge {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: clamp(0.48rem, 0.9vmin, 0.65rem);
      font-weight: 900;
      opacity: 0.75;
      line-height: 1;
    }

    @keyframes cellBlink {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.35); }
    }

    /* =========================================================
       MODO 3: DESAFIO DAS BOTAS (QUIZ VISUAL)
       ========================================================= */
    .quiz-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      overflow: hidden;
    }

    .quiz-top {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .quiz-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .quiz-star {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border-slate);
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 0.92rem;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    .quiz-star.current {
      border-color: var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
      transform: scale(1.1);
    }

    .quiz-star.earned {
      border-color: var(--amber-main);
      background-color: var(--amber-soft);
      color: #d97706;
    }

    .quiz-prompt-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .quiz-prompt {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.2;
    }

    .quiz-listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
      font-size: 0.9rem;
      font-weight: 800;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .quiz-listen-btn:hover {
      background-color: var(--blue-main);
      color: #ffffff;
    }

    .quiz-arena {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .quiz-stimulus {
      flex: 1;
      min-height: 0;
      width: 100%;
      background-color: var(--bg-page);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .quiz-options {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .quiz-card {
      height: 66px;
      border: 2.5px solid var(--border-slate);
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text-primary);
      transition: transform 0.14s, border-color 0.2s, background-color 0.2s, opacity 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .quiz-card:hover:not(.dimmed):not(.correct) {
      border-color: var(--blue-main);
      background-color: var(--blue-soft);
      transform: translateY(-2px);
    }

    .quiz-card.correct {
      border-color: var(--green-dark);
      background-color: var(--green-soft);
      color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
    }

    .quiz-card.dimmed {
      opacity: 0.4;
      background-color: var(--bg-subtle);
      border-color: var(--border-light);
      cursor: default;
    }

    .quiz-card.wrong-shake {
      border-color: var(--amber-main);
      background-color: var(--amber-soft);
      animation: gentleShake 0.34s ease;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      65% { transform: translateX(5px); }
    }

    /* Mini recorte do Quadro 100 dentro do Quiz */
    .mini-dec-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(44px, 68px));
      gap: 6px;
    }

    .mini-dec-cell {
      height: 48px;
      border-radius: 8px;
      border: 2px solid var(--border-slate);
      background-color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .mini-dec-cell.is-col {
      border-color: #93c5fd;
      background-color: #eff6ff;
      color: var(--blue-main);
    }

    .mini-dec-cell.is-start {
      background-color: var(--blue-main);
      border-color: #0f172a;
      color: #ffffff;
      font-weight: 900;
    }

    .mini-dec-cell.is-target {
      border: 2.5px dashed var(--amber-main);
      background-color: var(--amber-soft);
      color: var(--amber-dark);
      font-weight: 900;
    }

    .mini-dec-cell.is-target.revealed {
      border-style: solid;
      border-color: var(--green-dark);
      background-color: var(--green-soft);
      color: var(--green-dark);
    }

    .quiz-celebration {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 14px;
      background: radial-gradient(circle at center, #ecfdf5 0%, #ffffff 72%);
    }

    .celebration-stars {
      font-size: 2.2rem;
      letter-spacing: 6px;
      color: #f59e0b;
    }

    .celebration-title {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--green-dark);
    }

    .celebration-sub {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-secondary);
      max-width: 460px;
    }

    .big-action-btn {
      border: none;
      border-radius: var(--radius-md);
      background-color: var(--blue-main);
      color: #ffffff;
      font-size: 1.02rem;
      font-weight: 800;
      padding: 13px 26px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    /* =========================================================
       RODAPÉ COMPACTO (CONTADOR, SEQUÊNCIA E AÇÃO PRINCIPAL)
       ========================================================= */
    .footer-dock {
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-top: 2px solid var(--border-light);
      padding: 8px 14px 10px;
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.04);
    }

    .footer-inner {

  <script>
    /* =========================================================
       CONVERSOR DE NÚMEROS 0 A 100 PARA PORTUGUÊS FALADO
       ========================================================= */
    function numberToPtBr(n) {
      const units = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
      const teens = ['dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
      const tens = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];

      if (n < 0 || n > 100) return String(n);
      if (n < 10) return units[n];
      if (n < 20) return teens[n - 10];
      if (n === 100) return 'cem';

      const t = Math.floor(n / 10);
      const u = n % 10;
      return u === 0 ? tens[t] : `${tens[t]} e ${units[u]}`;
    }

    /* =========================================================
       MOTOR DE ÁUDIO: VOZ FALADA (pt-BR) + WEB AUDIO API
       ========================================================= */
    const AudioSystem = (() => {
      let mode = 'voice'; // 'voice' | 'sfx' | 'mute'
      let audioCtx = null;
      let ptBrVoice = null;

      const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

      function pickVoice() {
        try {
          if (!('speechSynthesis' in window)) return;
          const voices = window.speechSynthesis.getVoices();
          if (!voices || !voices.length) return;
          ptBrVoice =
            voices.find(v => v.lang && v.lang.toLowerCase() === 'pt-br') ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt')) ||
            null;
        } catch (e) {
          ptBrVoice = null;
        }
      }

      if ('speechSynthesis' in window) {
        pickVoice();
        window.speechSynthesis.onvoiceschanged = pickVoice;
      }

      function ensureCtx() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
      }

      function playTone(freq, duration = 0.14, type = 'triangle', volume = 0.15, delay = 0) {
        if (mode === 'mute') return;
        ensureCtx();
        if (!audioCtx) return;
        try {
          const now = audioCtx.currentTime + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      }

      function speakText(text) {
        if (mode !== 'voice') return;
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'pt-BR';
          utter.rate = 1.04;
          utter.pitch = 1.04;
          if (ptBrVoice) utter.voice = ptBrVoice;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }

      return {
        getMode: () => mode,
        cycleMode: () => {
          mode = mode === 'voice' ? 'sfx' : mode === 'sfx' ? 'mute' : 'voice';
          if (mode !== 'voice' && 'speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
          return mode;
        },
        stopSpeech: () => {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
        },
        speakText,
        playJump: (stepCount, landingNum) => {
          const idx = Math.max(0, Math.min(stepCount % SCALE.length, SCALE.length - 1));
          // Pequeno efeito de "salto" (duas notas rápidas subindo)
          playTone(SCALE[Math.max(0, idx - 1)] * 0.88, 0.07, 'sine', 0.11, 0);
          playTone(SCALE[idx], 0.15, 'triangle', 0.16, 0.05);
          speakText(numberToPtBr(landingNum));
        },
        playSuccess: () => {
          playTone(523.25, 0.15, 'sine', 0.14, 0.00);
          playTone(659.25, 0.15, 'sine', 0.14, 0.08);
          playTone(783.99, 0.24, 'sine', 0.16, 0.16);
        },
        playCelebration: () => {
          playTone(523.25, 0.13, 'triangle', 0.15, 0.00);
          playTone(659.25, 0.13, 'triangle', 0.15, 0.09);
          playTone(783.99, 0.13, 'triangle', 0.15, 0.18);
          playTone(1046.50, 0.34, 'triangle', 0.18, 0.27);
        },
        playHint: () => {
          playTone(329.63, 0.12, 'sine', 0.11, 0.00);
          playTone(293.66, 0.16, 'sine', 0.10, 0.09);
        }
      };
    })();

    /* =========================================================
       CONFIGURAÇÃO DAS BOTAS (CORES E IDENTIDADE)
       ========================================================= */
    const BOOT_THEMES = {
      2:  { color: '#2563eb', soft: '#eff6ff', name: 'Bota +2' },
      3:  { color: '#7c3aed', soft: '#f5f3ff', name: 'Bota +3' },
      4:  { color: '#0d9488', soft: '#f0fdfa', name: 'Bota +4' },
      5:  { color: '#d97706', soft: '#fffbeb', name: 'Bota +5' },
      6:  { color: '#0891b2', soft: '#ecfeff', name: 'Bota +6' },
      10: { color: '#e11d48', soft: '#fff1f2', name: 'Bota +10' }
    };

    /* =========================================================
       ESTADO GLOBAL
       ========================================================= */
    const state = {
      mode: 1, // 1 = Trilha 0–20, 2 = Quadro 100, 3 = Desafio, 4 = Chegada (Alvo), 5 = Pré-MMC
      drawerOpen: false,
      isPortrait: false,
      lastCounterVal: null,
      autoTimer: null,

      // Modo 1: Trilha Curta (0 a 20)
      m1: {
        step: 2,              // 2, 3, 4, 5
        playStyle: 'explore', // 'explore' | 'discover'
        startAt: 0,           // 0..5
        path: [0],
        wrongTile: null,
        showHint: false,
        lastScrollLeft: 0
      },

      // Modo 2: Quadro Decimal (1 a 100)
      m2: {
        step: 10,             // 10, 5, 2, 3
        playStyle: 'explore', // 'explore' | 'discover'
        pickStartMode: false, // Permite clicar em qualquer casa 1..20 como ponto de partida
        startAt: 0,           // 0 significa que o 1º salto cai em `step` (ex: 10, 20, 30...)
        path: [],             // Casas visitadas no quadro 1..100
        wrongCell: null,
        showHint: false,
        highlightColumn: true
      },

      // Modo 3: Desafio das Botas
      m3: {
        roundSize: 6,
        topic: 'mixed',       // 'mixed' | 'track' | 'decimal' | 'identify'
        questions: [],
        currentIndex: 0,
        completed: [],
        answeredCorrectly: false,
        wrongOptionIds: [],
        shakingOptionId: null,
        hintActive: false,
        hintMessage: '',
        finished: false,
        firstTryCount: 0
      },

      // Modo 4: Chegada (Alvos com bota única ou combinação de botas)
      m4: {
        target: 10,           // Ex.: 10, 12, 15, 17, 19, 23
        boots: [2, 3, 4, 5],  // Botas disponíveis para combinar
        jumps: [],            // [{ from, to, step }]
        feedbackMsg: '',
        lastScrollLeft: 0
      },

      // Modo 5: Pré-MMC (2 ou 3 pistas paralelas alinhadas)
      m5: {
        laneCount: 2,         // 2 ou 3 pistas
        maxVal: 30,           // Reta de 0 a 30
        lanes: [
          { step: 2, path: [0] },
          { step: 3, path: [0] },
          { step: 4, path: [0] }
        ],
        celebratedMeetings: [],
        lastScrollLeft: 0
      }
    };

    /* =========================================================
       REFERÊNCIAS DO DOM
       ========================================================= */
    const quickStripEl = document.getElementById('quickStrip');
    const stageBoxEl = document.getElementById('stageBox');
    const counterPillEl = document.getElementById('counterPill');
    const counterCaptionEl = document.getElementById('counterCaption');
    const counterNumberEl = document.getElementById('counterNumber');
    const statusInstructionEl = document.getElementById('statusInstruction');
    const footerActionsEl = document.getElementById('footerActions');
    const footerBottomEl = document.getElementById('footerBottom');
    const resetBtn = document.getElementById('resetBtn');
    const audioBtn = document.getElementById('audioBtn');
    const audioIconEl = document.getElementById('audioIcon');
    const audioLabelEl = document.getElementById('audioLabel');
    const panelToggleBtn = document.getElementById('panelToggleBtn');
    const teacherDrawerEl = document.getElementById('teacherDrawer');
    const drawerBackdropEl = document.getElementById('drawerBackdrop');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const drawerBodyEl = document.getElementById('drawerBody');
    const drawerRandomBtn = document.getElementById('drawerRandomBtn');

    /* =========================================================
       UTILITÁRIOS GERAIS
       ========================================================= */
    function stopAutoJump() {
      if (state.autoTimer) {
        clearInterval(state.autoTimer);
        state.autoTimer = null;
      }
    }

    function applyBootTheme(step) {
      const theme = BOOT_THEMES[step] || BOOT_THEMES[2];
      document.documentElement.style.setProperty('--boot-color', theme.color);
      document.documentElement.style.setProperty('--boot-soft', theme.soft);
    }

    function animateCounter(displayValue) {
      counterNumberEl.textContent = displayValue;
      if (state.lastCounterVal !== displayValue) {
        state.lastCounterVal = displayValue;
        counterNumberEl.classList.remove('counter-pop');
        void counterNumberEl.offsetWidth;
        counterNumberEl.classList.add('counter-pop');
      }
    }

    function updateOrientation() {
      const w = stageBoxEl.clientWidth || window.innerWidth;
      const h = stageBoxEl.clientHeight || window.innerHeight;
      const nextPortrait = w < h * 0.92;
      if (nextPortrait !== state.isPortrait) {
        state.isPortrait = nextPortrait;
        render();
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* =========================================================
       MODO 1: TRILHA CURTA (0 A 20)
       ========================================================= */
    function initMode1(step = state.m1.step, startAt = state.m1.startAt) {
      stopAutoJump();
      state.m1.step = step;
      state.m1.startAt = startAt;
      state.m1.path = [startAt];
      state.m1.wrongTile = null;
      state.m1.showHint = false;
      render();
    }

    function getMode1NextTarget() {
      const cur = state.m1.path[state.m1.path.length - 1];
      const next = cur + state.m1.step;
      return next <= 20 ? next : null;
    }

    function doMode1Jump() {
      const next = getMode1NextTarget();
      if (next === null) {
        stopAutoJump();
        return;
      }
      state.m1.path.push(next);
      state.m1.wrongTile = null;
      state.m1.showHint = false;
      AudioSystem.playJump(state.m1.path.length - 1, next);

      if (getMode1NextTarget() === null) {
        stopAutoJump();
        setTimeout(() => AudioSystem.playSuccess(), 260);
      }
      render();
    }

    function onMode1TileTap(num) {
      const next = getMode1NextTarget();
      if (next === null) return;

      if (num === next) {
        doMode1Jump();
      } else if (state.m1.playStyle === 'discover') {
        state.m1.wrongTile = num;
        state.m1.showHint = true;
        AudioSystem.playHint();
        const cur = state.m1.path[state.m1.path.length - 1];
        AudioSystem.speakText(`Conte ${numberToPtBr(state.m1.step)} casas depois do ${numberToPtBr(cur)}.`);
        render();
        setTimeout(() => { state.m1.wrongTile = null; render(); }, 420);
      }
    }

    function toggleMode1Auto() {
      if (state.autoTimer) {
        stopAutoJump();
        render();
        return;
      }
      if (getMode1NextTarget() === null) {
        state.m1.path = [state.m1.startAt];
      }
      doMode1Jump();
      state.autoTimer = setInterval(() => {
        if (getMode1NextTarget() === null) {
          stopAutoJump();
          render();
        } else {
          doMode1Jump();
        }
      }, 880);
      render();
    }

    function renderMode1() {
      const { step, playStyle, path, wrongTile, showHint } = state.m1;
      applyBootTheme(step);

      const cur = path[path.length - 1];
      const next = getMode1NextTarget();
      const finished = next === null;
      const jumpCount = path.length - 1;

      // Faixa superior: seleção de botas + alternador Explorar/Descobrir
      quickStripEl.innerHTML = `
        ${[2, 3, 4, 5].map(s => `
          <button class="boot-pill ${step === s ? 'active' : ''}" data-m1-boot="${s}" type="button">
            👟 +${s}
          </button>
        `).join('')}
        <span class="strip-divider" aria-hidden="true"></span>
        <button class="mode-pill ${playStyle === 'explore' ? 'active' : ''}" data-m1-style="explore" type="button">Explorar</button>
        <button class="mode-pill ${playStyle === 'discover' ? 'active' : ''}" data-m1-style="discover" type="button">Descobrir (Tocar)</button>
      `;

      quickStripEl.querySelectorAll('[data-m1-boot]').forEach(btn => {
        btn.addEventListener('click', () => initMode1(Number(btn.dataset.m1Boot), state.m1.startAt));
      });
      quickStripEl.querySelectorAll('[data-m1-style]').forEach(btn => {
        btn.addEventListener('click', () => {
          stopAutoJump();
          state.m1.playStyle = btn.dataset.m1Style;
          state.m1.showHint = false;
          render();
        });
      });

      // Construção do SVG em linha reta contínua (0 a 20) com distância uniforme
      const tileW = 64;
      const tileH = 60;
      const gapX = 18;
      const unitStep = tileW + gapX; // 82px por unidade na reta
      const padX = 56;
      const vw = padX * 2 + 20 * unitStep;
      const vh = 250;
      const cy = 152;

      const pos = {};
      for (let n = 0; n <= 20; n++) {
        pos[n] = { x: padX + n * unitStep, y: cy };
      }

      // Linha de base da reta numérica conectando todas as casas
      const railSvg = `<line class="track-rail" x1="${pos[0].x}" y1="${cy}" x2="${pos[20].x}" y2="${cy}" />`;

      // Arcos de salto contínuos (todos com exatamente a mesma distância e altura)
      let arcsSvg = '';
      const arcLift = 48 + step * 11;
      for (let i = 0; i < path.length - 1; i++) {
        const a = pos[path[i]];
        const b = pos[path[i + 1]];
        const yTop = cy - tileH / 2 - 4;
        const midX = (a.x + b.x) / 2;
        const ctrlY = yTop - arcLift;
        const labelY = yTop - arcLift * 0.56;

        arcsSvg += `
          <path class="jump-arc" d="M ${a.x} ${yTop} Q ${midX} ${ctrlY} ${b.x} ${yTop}" />
          <rect class="jump-label-bg" x="${midX - 16}" y="${labelY - 10}" width="32" height="20" rx="10" />
          <text class="jump-label-txt" x="${midX}" y="${labelY}">+${step}</text>
        `;
      }

      // Desenha as casas 0..20
      let tilesSvg = '';
      for (let n = 0; n <= 20; n++) {
        const p = pos[n];
        const isCurrent = n === cur;
        const isVisited = path.includes(n);
        const isHint = showHint && n === next;
        const isWrong = wrongTile === n;

        const cls = [
          'track-tile',
          isVisited ? 'visited' : '',
          isCurrent ? 'current' : '',
          isHint ? 'hint-target' : '',
          isWrong ? 'wrong-tile' : ''
        ].filter(Boolean).join(' ');

        tilesSvg += `
          <g class="${cls}" data-t1="${n}" role="button" tabindex="0" aria-label="Casa ${n}">
            <rect class="track-tile-rect" x="${p.x - tileW / 2}" y="${p.y - tileH / 2}" width="${tileW}" height="${tileH}" rx="12" />
            <text class="track-tile-num" x="${p.x}" y="${p.y}">${n}</text>
          </g>
        `;
      }

      // Marcador da bota sobre a casa atual
      const curP = pos[cur];
      const bootBadgeSvg = `
        <g transform="translate(${curP.x}, ${curP.y + tileH / 2 + 16})" aria-hidden="true">
          <circle cx="0" cy="0" r="12" fill="#0f172a" />
          <text x="0" y="1" font-size="13" text-anchor="middle" dominant-baseline="central">👟</text>
        </g>
      `;

      // Escala proporcional à altura do palco para manter casas legíveis no PC e no celular
      const stageH = stageBoxEl.clientHeight || 280;
      const scale = Math.max(0.76, Math.min(1.12, (stageH - 18) / vh));
      const dispW = Math.round(vw * scale);
      const dispH = Math.round(vh * scale);

      stageBoxEl.classList.toggle('stage-done', finished);
      stageBoxEl.innerHTML = `
        <div id="trackViewport" class="track-viewport" aria-label="Trilha numérica contínua de 0 a 20">
          <svg class="track-svg" width="${dispW}" height="${dispH}" viewBox="0 0 ${vw} ${vh}">
            ${railSvg}
            ${arcsSvg}
            ${tilesSvg}
            ${bootBadgeSvg}
          </svg>
        </div>
      `;

      const viewport = document.getElementById('trackViewport');
      if (viewport) {
        // Restaura a posição anterior antes de deslizar suavemente para a casa atual
        viewport.scrollLeft = state.m1.lastScrollLeft || 0;

        const maxScroll = Math.max(0, dispW - viewport.clientWidth);
        const curPx = curP.x * scale;
        // Mantém a casa atual perto do primeiro quarto esquerdo para exibir os próximos 6+ números à frente
        const targetScroll = Math.max(0, Math.min(maxScroll, Math.round(curPx - viewport.clientWidth * 0.25)));

        requestAnimationFrame(() => {
          viewport.scrollTo({ left: targetScroll, behavior: 'smooth' });
        });

        viewport.addEventListener('scroll', () => {
          state.m1.lastScrollLeft = viewport.scrollLeft;
        }, { passive: true });

        // Permite rolar a reta horizontalmente com a rodinha do mouse no PC
        viewport.addEventListener('wheel', (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            viewport.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      }

      stageBoxEl.querySelectorAll('[data-t1]').forEach(el => {
        el.addEventListener('click', () => onMode1TileTap(Number(el.dataset.t1)));
      });

      // Rodapé
      counterCaptionEl.textContent = 'Casa';
      animateCounter(String(cur));
      counterPillEl.classList.toggle('done', finished);

      if (finished) {
        statusInstructionEl.textContent = `Fim da trilha! ${jumpCount} ${jumpCount === 1 ? 'salto' : 'saltos'} de +${step}.`;
        statusInstructionEl.className = 'status-instruction success';
      } else if (playStyle === 'discover') {
        statusInstructionEl.textContent = `Você está no ${cur}. Toque onde a bota +${step} vai cair!`;
        statusInstructionEl.className = 'status-instruction';
      } else {
        statusInstructionEl.textContent = `${jumpCount} ${jumpCount === 1 ? 'salto' : 'saltos'} de +${step} • Próximo: ${next}`;
        statusInstructionEl.className = 'status-instruction';
      }

      // Botões de ação no rodapé
      if (playStyle === 'explore') {
        footerActionsEl.innerHTML = `
          <button id="m1AutoBtn" class="secondary-btn ${state.autoTimer ? 'running' : ''}" type="button">
            ${state.autoTimer ? '⏸ Pausar' : '▶ Auto'}
          </button>
          <button id="m1JumpBtn" class="primary-btn ${finished ? 'ready' : ''}" type="button">
            ${finished ? '↺ Recomeçar' : `Saltar +${step} →`}
          </button>
        `;
        document.getElementById('m1AutoBtn').addEventListener('click', toggleMode1Auto);
        document.getElementById('m1JumpBtn').addEventListener('click', () => {
          if (finished) initMode1(step, state.m1.startAt);
          else doMode1Jump();
        });
      } else {
        footerActionsEl.innerHTML = `
          <button id="m1HintBtn" class="secondary-btn" type="button">💡 Dica</button>
          ${finished ? `<button id="m1RestartBtn" class="primary-btn ready" type="button">↺ Novo</button>` : ''}
        `;
        document.getElementById('m1HintBtn').addEventListener('click', () => {
          state.m1.showHint = true;
          AudioSystem.playHint();
          render();
        });
        const rBtn = document.getElementById('m1RestartBtn');
        if (rBtn) rBtn.addEventListener('click', () => initMode1(step, state.m1.startAt));
      }

      // Sequência no rodapé
      footerBottomEl.innerHTML = `
        <div class="seq-strip" aria-label="Sequência de saltos">
          ${path.map((val, idx) => `
            <span class="seq-chip ${idx === path.length - 1 ? 'latest' : ''}">${val}</span>
            ${idx < path.length - 1 ? '<span class="seq-arrow" aria-hidden="true">→</span>' : ''}
          `).join('')}
        </div>
      `;
    }

    /* =========================================================
       MODO 2: QUADRO DECIMAL (1 A 100)
       ========================================================= */
    function initMode2(step = state.m2.step, startAt = state.m2.startAt) {
      stopAutoJump();
      state.m2.step = step;
      state.m2.startAt = startAt;
      state.m2.path = startAt > 0 ? [startAt] : [];
      state.m2.wrongCell = null;
      state.m2.showHint = false;
      state.m2.pickStartMode = false;
      render();
    }

    function getMode2Current() {
      return state.m2.path.length > 0 ? state.m2.path[state.m2.path.length - 1] : state.m2.startAt;
    }

    function getMode2NextTarget() {
      const cur = getMode2Current();
      const next = cur + state.m2.step;
      return next <= 100 ? next : null;
    }

    function doMode2Jump() {
      const next = getMode2NextTarget();
      if (next === null) {
        stopAutoJump();
        return;
      }
      state.m2.path.push(next);
      state.m2.wrongCell = null;
      state.m2.showHint = false;
      AudioSystem.playJump(state.m2.path.length, next);

      if (getMode2NextTarget() === null) {
        stopAutoJump();
        setTimeout(() => AudioSystem.playSuccess(), 260);
      }
      render();
    }

    function onMode2CellTap(num) {
      // Se estiver no modo de escolher ponto de partida
      if (state.m2.pickStartMode) {
        state.m2.pickStartMode = false;
        initMode2(state.m2.step, num);
        AudioSystem.playJump(0, num);
        return;
      }

      const next = getMode2NextTarget();
      if (next === null) return;

      if (num === next) {
        doMode2Jump();
      } else if (state.m2.playStyle === 'discover') {
        state.m2.wrongCell = num;
        state.m2.showHint = true;
        AudioSystem.playHint();
        const cur = getMode2Current();
        const hintSpeech = state.m2.step === 10 && cur > 0
          ? `Com mais dez, desça um andar na mesma coluna do ${numberToPtBr(cur)}!`
          : `Avance ${numberToPtBr(state.m2.step)} casas depois do ${numberToPtBr(cur)}.`;
        AudioSystem.speakText(hintSpeech);
        render();
        setTimeout(() => { state.m2.wrongCell = null; render(); }, 420);
      }
    }

    function toggleMode2Auto() {
      if (state.autoTimer) {
        stopAutoJump();
        render();
        return;
      }
      if (getMode2NextTarget() === null) {
        state.m2.path = state.m2.startAt > 0 ? [state.m2.startAt] : [];
      }
      doMode2Jump();
      const delayMs = state.m2.step >= 10 ? 720 : state.m2.step >= 5 ? 520 : 380;
      state.autoTimer = setInterval(() => {
        if (getMode2NextTarget() === null) {
          stopAutoJump();
          render();
        } else {
          doMode2Jump();
        }
      }, delayMs);
      render();
    }

    function renderMode2() {
      const { step, playStyle, startAt, path, wrongCell, showHint, pickStartMode, highlightColumn } = state.m2;
      applyBootTheme(step);

      const cur = getMode2Current();
      const next = getMode2NextTarget();
      const finished = next === null;
      const activeCol = cur > 0 ? ((cur - 1) % 10) : (step === 10 ? 9 : -1);

      // Faixa superior
      quickStripEl.innerHTML = `
        ${[10, 5, 2, 3].map(s => `
          <button class="boot-pill ${step === s ? 'active' : ''}" data-m2-boot="${s}" type="button">
            👟 +${s}
          </button>
        `).join('')}
        <span class="strip-divider" aria-hidden="true"></span>
        <button class="mode-pill ${playStyle === 'explore' ? 'active' : ''}" data-m2-style="explore" type="button">Explorar</button>
        <button class="mode-pill ${playStyle === 'discover' ? 'active' : ''}" data-m2-style="discover" type="button">Descobrir</button>
        <button class="mode-pill ${pickStartMode ? 'active' : ''}" id="m2PickStartBtn" type="button">
          ${pickStartMode ? 'Toque a casa inicial…' : `Partida: ${startAt}`}
        </button>
      `;

      quickStripEl.querySelectorAll('[data-m2-boot]').forEach(btn => {
        btn.addEventListener('click', () => initMode2(Number(btn.dataset.m2Boot), state.m2.startAt));
      });
      quickStripEl.querySelectorAll('[data-m2-style]').forEach(btn => {
        btn.addEventListener('click', () => {
          stopAutoJump();
          state.m2.playStyle = btn.dataset.m2Style;
          state.m2.showHint = false;
          render();
        });
      });
      document.getElementById('m2PickStartBtn').addEventListener('click', () => {
        stopAutoJump();
        state.m2.pickStartMode = !state.m2.pickStartMode;
        render();
      });

      // Grade 1 a 100
      let cellsHtml = '';
      for (let n = 1; n <= 100; n++) {
        const colIdx = (n - 1) % 10;
        const visitIdx = path.indexOf(n);
        const isVisited = visitIdx !== -1;
        const isCurrent = n === cur;
        const isStart = startAt > 0 && n === startAt;
        const isHint = showHint && n === next;
        const isWrong = wrongCell === n;
        const isColGuide = highlightColumn && step === 10 && colIdx === activeCol && !isVisited;

        const cls = [
          'g-cell',
          isColGuide ? 'col-guide' : '',
          isVisited ? 'visited' : '',
          isStart ? 'start-cell' : '',
          isCurrent ? 'current' : '',
          isHint ? 'hint-target' : '',
          isWrong ? 'wrong-cell' : ''
        ].filter(Boolean).join(' ');

        const jumpOrder = isVisited && !(isStart && startAt > 0)
          ? (startAt > 0 ? visitIdx : visitIdx + 1)
          : null;

        cellsHtml += `
          <button class="${cls}" data-g100="${n}" type="button" aria-label="Número ${n}">
            ${n}
            ${jumpOrder && step >= 5 ? `<span class="cell-badge">${jumpOrder}º</span>` : ''}
          </button>
        `;
      }

      stageBoxEl.classList.toggle('stage-done', finished);
      stageBoxEl.innerHTML = `
        <div class="grid100-wrap">
          <div class="grid100" role="grid" aria-label="Quadro numérico de 1 a 100">
            ${cellsHtml}
          </div>
        </div>
      `;

      stageBoxEl.querySelectorAll('[data-g100]').forEach(btn => {
        btn.addEventListener('click', () => onMode2CellTap(Number(btn.dataset.g100)));
      });

      // Rodapé
      counterCaptionEl.textContent = 'Casa';
      animateCounter(String(cur));
      counterPillEl.classList.toggle('done', finished);

      if (pickStartMode) {
        statusInstructionEl.textContent = 'Toque em qualquer número do quadro para começar por ele!';
        statusInstructionEl.className = 'status-instruction';
      } else if (finished) {
        statusInstructionEl.textContent = `Quadro concluído com a bota +${step}! Veja o padrão formado.`;
        statusInstructionEl.className = 'status-instruction success';
      } else if (playStyle === 'discover') {
        statusInstructionEl.textContent = step === 10 && cur > 0
          ? `Do ${cur} com +10: desça um andar na mesma coluna!`
          : `Você está no ${cur}. Toque onde a bota +${step} vai cair!`;
        statusInstructionEl.className = 'status-instruction';
      } else {
        statusInstructionEl.textContent = step === 10
          ? 'Bota +10: cada salto desce 1 andar mantendo a mesma unidade.'
          : `Saltando de +${step} em +${step} a partir do ${startAt}.`;
        statusInstructionEl.className = 'status-instruction';
      }

      if (playStyle === 'explore') {
        footerActionsEl.innerHTML = `
          <button id="m2AutoBtn" class="secondary-btn ${state.autoTimer ? 'running' : ''}" type="button">
            ${state.autoTimer ? '⏸ Pausar' : '▶ Auto'}
          </button>
          <button id="m2JumpBtn" class="primary-btn ${finished ? 'ready' : ''}" type="button">
            ${finished ? '↺ Recomeçar' : `Saltar +${step} →`}
          </button>
        `;
        document.getElementById('m2AutoBtn').addEventListener('click', toggleMode2Auto);
        document.getElementById('m2JumpBtn').addEventListener('click', () => {
          if (finished) initMode2(step, startAt);
          else doMode2Jump();
        });
      } else {
        footerActionsEl.innerHTML = `
          <button id="m2HintBtn" class="secondary-btn" type="button">💡 Dica</button>
          ${finished ? `<button id="m2RestartBtn" class="primary-btn ready" type="button">↺ Novo</button>` : ''}
        `;
        document.getElementById('m2HintBtn').addEventListener('click', () => {
          state.m2.showHint = true;
          AudioSystem.playHint();
          render();
        });
        const rBtn = document.getElementById('m2RestartBtn');
        if (rBtn) rBtn.addEventListener('click', () => initMode2(step, startAt));
      }

      // Mostra os últimos 8 números saltados na faixa inferior
      const tail = path.slice(-8);
      footerBottomEl.innerHTML = tail.length
        ? `
          <div class="seq-strip">
            ${path.length > 8 ? '<span class="seq-arrow">…</span>' : ''}
            ${tail.map((val, idx) => `
              <span class="seq-chip ${idx === tail.length - 1 ? 'latest' : ''}">${val}</span>
              ${idx < tail.length - 1 ? '<span class="seq-arrow" aria-hidden="true">→</span>' : ''}
            `).join('')}
          </div>
        `
        : '';
    }

    /* =========================================================
       MODO 3: DESAFIO DAS BOTAS (QUIZ VISUAL)
       ========================================================= */
    function pickNumericDistractors(answer, deltas, minVal, maxVal) {
      const set = new Set([answer]);
      for (const d of shuffleArray(deltas)) {
        if (set.size >= 3) break;
        const cand = answer + d;
        if (cand >= minVal && cand <= maxVal) set.add(cand);
      }
      for (let n = minVal; set.size < 3 && n <= maxVal; n++) set.add(n);
      return shuffleArray(Array.from(set));
    }

    function buildBootQuestion(type) {
      // 1. Trilha curta: próximo salto
      if (type === 'track_next') {
        const step = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
        const maxMult = Math.floor(20 / step) - 1;
        const jumpsDone = 1 + Math.floor(Math.random() * Math.max(1, maxMult - 1));
        const current = jumpsDone * step;
        const answer = current + step;
        const seq = [];
        for (let i = 0; i <= jumpsDone; i++) seq.push(i * step);

        const opts = pickNumericDistractors(answer, [-step, -1, 1, 2, step, -2], 1, 20);
        return {
          type,
          step,
          seq,
          current,
          answer,
          prompt: `Com a bota +${step}, saindo do ${current}, onde você cai?`,
          answerSpoken: numberToPtBr(answer),
          hintText: `Some ${numberToPtBr(step)} depois do ${numberToPtBr(current)}!`,
          options: opts.map((v, i) => ({ id: `o-${i}`, value: v, label: String(v) }))
        };
      }

      // 2. Identificar qual bota fez os saltos
      if (type === 'identify_boot') {
        const pool = [2, 3, 4, 5];
        const step = pool[Math.floor(Math.random() * pool.length)];
        const seq = [0, step, step * 2, step * 3];
        const others = shuffleArray(pool.filter(b => b !== step)).slice(0, 2);
        const opts = shuffleArray([step, ...others]);
        return {
          type,
          step,
          seq,
          answer: step,
          prompt: 'Qual bota fez estes saltos na trilha?',
          answerSpoken: `bota mais ${numberToPtBr(step)}`,
          hintText: 'Veja de quanto em quanto os números estão aumentando!',
          options: opts.map((v, i) => ({ id: `o-${i}`, value: v, label: `👟 +${v}` }))
        };
      }

      // 3. Quadro Decimal: saltar +10 (descer um andar)
      const startRow = Math.floor(Math.random() * 8); // 0..7 (linhas 1..80)
      const col = 1 + Math.floor(Math.random() * 9);  // 1..9 (evita borda 0 para recorte simétrico)
      const startNum = startRow * 10 + col;
      const answer = startNum + 10;
      const opts = pickNumericDistractors(answer, [-9, -1, 1, 10, -10, 2], 1, 100);
      return {
        type: 'decimal_plus10',
        step: 10,
        startNum,
        answer,
        prompt: `Saindo do ${startNum} com a bota +10, qual é o próximo andar?`,
        answerSpoken: numberToPtBr(answer),
        hintText: `Na bota mais dez, o último algarismo continua ${numberToPtBr(startNum % 10)}!`,
        options: opts.map((v, i) => ({ id: `o-${i}`, value: v, label: String(v) }))
      };
    }

    function generateBootQuiz(roundSize, topic) {
      let types = [];
      if (topic === 'track') types = ['track_next'];
      else if (topic === 'identify') types = ['identify_boot'];
      else if (topic === 'decimal') types = ['decimal_plus10'];
      else types = ['track_next', 'identify_boot', 'decimal_plus10'];

      const list = [];
      for (let i = 0; i < roundSize; i++) {
        list.push(buildBootQuestion(types[i % types.length]));
      }
      return shuffleArray(list);
    }

    function initMode3(speakFirst = true) {
      stopAutoJump();
      const { roundSize, topic } = state.m3;
      state.m3.questions = generateBootQuiz(roundSize, topic);
      state.m3.currentIndex = 0;
      state.m3.completed = new Array(roundSize).fill(false);
      state.m3.answeredCorrectly = false;
      state.m3.wrongOptionIds = [];
      state.m3.shakingOptionId = null;
      state.m3.hintActive = false;
      state.m3.hintMessage = '';
      state.m3.finished = false;
      state.m3.firstTryCount = 0;
      render();
      if (speakFirst && state.m3.questions[0]) {
        AudioSystem.speakText(state.m3.questions[0].prompt);
      }
    }

    function advanceMode3() {
      if (state.m3.finished) {
        initMode3(true);
        return;
      }
      if (state.m3.currentIndex + 1 >= state.m3.questions.length) {
        state.m3.finished = true;
        AudioSystem.playCelebration();
        render();
        setTimeout(() => {
          AudioSystem.speakText('Parabéns! Você dominou as botas de salto!');
        }, 360);
        return;
      }
      state.m3.currentIndex += 1;
      state.m3.answeredCorrectly = false;
      state.m3.wrongOptionIds = [];
      state.m3.shakingOptionId = null;
      state.m3.hintActive = false;
      state.m3.hintMessage = '';
      render();
      const q = state.m3.questions[state.m3.currentIndex];
      if (q) AudioSystem.speakText(q.prompt);
    }

    function onQuizOptionTap(optId) {
      const q = state.m3.questions[state.m3.currentIndex];
      if (!q || state.m3.answeredCorrectly) return;
      if (state.m3.wrongOptionIds.includes(optId)) return;

      const opt = q.options.find(o => o.id === optId);
      if (!opt) return;

      if (opt.value === q.answer) {
        if (state.m3.wrongOptionIds.length === 0) state.m3.firstTryCount += 1;
        state.m3.answeredCorrectly = true;
        state.m3.completed[state.m3.currentIndex] = true;
        state.m3.hintActive = false;
        state.m3.hintMessage = '';
        AudioSystem.playSuccess();
        setTimeout(() => AudioSystem.speakText(`Muito bem! ${q.answerSpoken}!`), 240);
        render();
      } else {
        state.m3.wrongOptionIds.push(optId);
        state.m3.shakingOptionId = optId;
        state.m3.hintActive = true;
        state.m3.hintMessage = q.hintText;
        AudioSystem.playHint();
        AudioSystem.speakText(q.hintText);
        render();
        setTimeout(() => { state.m3.shakingOptionId = null; render(); }, 380);
      }
    }

    function buildQuizStimulusHtml(q) {
      const { answeredCorrectly, hintActive } = state.m3;

      // Estímulo em recorte do Quadro 100 (3 linhas × 5 colunas centradas no startNum)
      if (q.type === 'decimal_plus10') {
        const baseCol = (q.startNum - 1) % 10; // 0..9
        const startCol = Math.max(0, Math.min(5, baseCol - 2));
        const startRow = Math.floor((q.startNum - 1) / 10);
        const rowsToShow = [startRow, startRow + 1];
        if (startRow + 2 <= 9) rowsToShow.push(startRow + 2);

        let cells = '';
        rowsToShow.forEach(r => {
          for (let c = startCol; c < startCol + 5; c++) {
            const val = r * 10 + c + 1;
            const isStart = val === q.startNum;
            const isTarget = val === q.answer;
            const isCol = c === baseCol;
            const cls = [
              'mini-dec-cell',
              isCol ? 'is-col' : '',
              isStart ? 'is-start' : '',
              isTarget ? 'is-target' : '',
              isTarget && answeredCorrectly ? 'revealed' : ''
            ].filter(Boolean).join(' ');

            const text = isTarget && !answeredCorrectly ? '?' : val;
            cells += `<div class="${cls}">${text}</div>`;
          }
        });

        return `<div class="mini-dec-grid" aria-label="Recorte do quadro decimal">${cells}</div>`;
      }

      // Estímulo em mini trilha SVG (para track_next e identify_boot)
      const nodes = q.type === 'track_next' ? [...q.seq, '?'] : q.seq;
      const count = nodes.length;
      const vw = 620, vh = 190;
      const boxW = 76, boxH = 62;
      const spacing = Math.min(130, (vw - 90) / Math.max(1, count - 1));
      const startX = (vw - spacing * (count - 1)) / 2;
      const cy = 128;

      let arcs = '';
      for (let i = 0; i < count - 1; i++) {
        const x1 = startX + i * spacing;
        const x2 = startX + (i + 1) * spacing;
        const mid = (x1 + x2) / 2;
        const yTop = cy - boxH / 2 - 4;
        const label = q.type === 'identify_boot' && !answeredCorrectly ? '+?' : `+${q.step}`;
        const isLast = i === count - 2 && q.type === 'track_next';
        arcs += `
          <path class="jump-arc ${isLast ? 'dashed' : ''}" d="M ${x1} ${yTop} Q ${mid} ${yTop - 56} ${x2} ${yTop}" />
          <rect class="jump-label-bg" x="${mid - 19}" y="${yTop - 42}" width="38" height="22" rx="11" />
          <text class="jump-label-txt" x="${mid}" y="${yTop - 31}">${label}</text>
        `;
      }

      let boxes = '';
      nodes.forEach((val, i) => {
        const x = startX + i * spacing;
        const isMystery = val === '?';
        const showVal = isMystery && answeredCorrectly ? q.answer : val;
        const fill = isMystery
          ? (answeredCorrectly ? '#ecfdf5' : (hintActive ? '#fef3c7' : '#fffbeb'))
          : (i === nodes.length - 1 && !isMystery ? 'var(--boot-soft)' : '#ffffff');
        const stroke = isMystery
          ? (answeredCorrectly ? '#047857' : '#f59e0b')
          : 'var(--boot-color)';
        const txtColor = isMystery
          ? (answeredCorrectly ? '#047857' : '#b45309')
          : '#0f172a';

        boxes += `
          <rect x="${x - boxW / 2}" y="${cy - boxH / 2}" width="${boxW}" height="${boxH}" rx="12"
                fill="${fill}" stroke="${stroke}" stroke-width="3.5" ${isMystery && !answeredCorrectly ? 'stroke-dasharray="6 4"' : ''} />
          <text x="${x}" y="${cy}" font-size="26" font-weight="900" fill="${txtColor}" text-anchor="middle" dominant-baseline="central">${showVal}</text>
        `;
      });

      return `
        <svg class="stage-svg" viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" aria-label="Sequência de saltos">
          ${arcs}
          ${boxes}
        </svg>
      `;
    }

    function renderMode3() {
      const m3 = state.m3;
      quickStripEl.innerHTML = '';
      footerBottomEl.innerHTML = '';

      const earnedCount = m3.completed.filter(Boolean).length;

      if (m3.finished) {
        applyBootTheme(10);
        stageBoxEl.classList.add('stage-done');
        stageBoxEl.innerHTML = `
          <div class="quiz-celebration">
            <div class="celebration-stars">${'★'.repeat(m3.questions.length)}</div>
            <h2 class="celebration-title">Parabéns! Desafio Concluído!</h2>
            <p class="celebration-sub">
              Você conquistou <strong>${m3.questions.length} estrelas</strong>${m3.firstTryCount > 0 ? ` (${m3.firstTryCount} de primeira!)` : ''} com as Botas de Salto!
            </p>
            <button id="qRestartBtn" class="big-action-btn" type="button">Jogar Novo Desafio</button>
          </div>
        `;
        document.getElementById('qRestartBtn').addEventListener('click', () => initMode3(true));

        counterCaptionEl.textContent = 'Estrelas';
        animateCounter(`${earnedCount}/${m3.questions.length}`);
        counterPillEl.classList.add('done');
        statusInstructionEl.textContent = 'Rodada concluída!';
        statusInstructionEl.className = 'status-instruction success';
        footerActionsEl.innerHTML = `<button id="qNextBtn" class="primary-btn ready" type="button">Novo Desafio →</button>`;
        document.getElementById('qNextBtn').addEventListener('click', () => initMode3(true));
        return;
      }

      const q = m3.questions[m3.currentIndex];
      if (!q) { initMode3(false); return; }

      applyBootTheme(q.step);
      stageBoxEl.classList.toggle('stage-done', m3.answeredCorrectly);

      const starsHtml = m3.questions.map((_, i) => {
        const earned = m3.completed[i];
        const current = i === m3.currentIndex && !earned;
        return `<span class="quiz-star ${earned ? 'earned' : ''} ${current ? 'current' : ''}">${earned ? '★' : i + 1}</span>`;
      }).join('');

      const optionsHtml = q.options.map(opt => {
        const isCorrect = m3.answeredCorrectly && opt.value === q.answer;
        const isDimmed = m3.wrongOptionIds.includes(opt.id);
        const isShaking = m3.shakingOptionId === opt.id;
        return `
          <button class="quiz-card ${isCorrect ? 'correct' : ''} ${isDimmed ? 'dimmed' : ''} ${isShaking ? 'wrong-shake' : ''}"
                  data-q-opt="${opt.id}" type="button">
            ${opt.label}
          </button>
        `;
      }).join('');

      stageBoxEl.innerHTML = `
        <div class="quiz-shell">
          <div class="quiz-top">
            <div class="quiz-stars">${starsHtml}</div>
            <div class="quiz-prompt-row">
              <h2 class="quiz-prompt">${q.prompt}</h2>
              <button id="quizListenBtn" class="quiz-listen-btn" type="button">🔊 Ouvir</button>
            </div>
          </div>
          <div class="quiz-arena">
            <div class="quiz-stimulus">${buildQuizStimulusHtml(q)}</div>
            <div class="quiz-options">${optionsHtml}</div>
          </div>
        </div>
      `;

      document.getElementById('quizListenBtn').addEventListener('click', () => AudioSystem.speakText(q.prompt));
      stageBoxEl.querySelectorAll('[data-q-opt]').forEach(btn => {
        btn.addEventListener('click', () => onQuizOptionTap(btn.dataset.qOpt));
      });

      counterCaptionEl.textContent = 'Estrelas';
      animateCounter(`${earnedCount}/${m3.questions.length}`);
      counterPillEl.classList.toggle('done', m3.answeredCorrectly);

      if (m3.answeredCorrectly) {
        statusInstructionEl.textContent = 'Acertou! Avance para a próxima pergunta.';
        statusInstructionEl.className = 'status-instruction success';
      } else if (m3.hintMessage) {
        statusInstructionEl.textContent = `Dica: ${m3.hintMessage}`;
        statusInstructionEl.className = 'status-instruction';
      } else {
        statusInstructionEl.textContent = 'Escolha a resposta certa abaixo.';
        statusInstructionEl.className = 'status-instruction';
      }

      footerActionsEl.innerHTML = `
        <button id="qNextBtn" class="primary-btn ${m3.answeredCorrectly ? 'ready' : ''}" type="button">
          ${m3.currentIndex + 1 === m3.questions.length ? 'Concluir →' : 'Próxima →'}
        </button>
      `;
      document.getElementById('qNextBtn').addEventListener('click', advanceMode3);
    }

    /* =========================================================
       MODO 4: DESAFIO DE CHEGADA (ALVO / COMBINAÇÃO DE BOTAS)
       ========================================================= */
    const GOAL_PRESETS = [10, 12, 15, 17, 19, 23];

    function initMode4(target = state.m4.target) {
      stopAutoJump();
      state.m4.target = target;
      state.m4.jumps = [];
      state.m4.feedbackMsg = '';
      state.m4.lastScrollLeft = 0;
      render();
    }

    function getMode4Current() {
      const j = state.m4.jumps;
      return j.length > 0 ? j[j.length - 1].to : 0;
    }

    function doMode4Jump(step) {
      const cur = getMode4Current();
      const target = state.m4.target;
      if (cur >= target) return;

      const next = cur + step;
      if (next > target) {
        state.m4.feedbackMsg = `Com +${step} passaria do ${target}! Escolha uma bota menor.`;
        AudioSystem.playHint();
        AudioSystem.speakText(`Passou do ${numberToPtBr(target)}. Tente uma bota menor!`);
        render();
        return;
      }

      state.m4.jumps.push({ from: cur, to: next, step });
      state.m4.feedbackMsg = '';
      AudioSystem.playJump(state.m4.jumps.length, next);

      if (next === target) {
        setTimeout(() => {
          AudioSystem.playSuccess();
          AudioSystem.speakText(`Chegou no ${numberToPtBr(target)}!`);
        }, 280);
      }
      render();
    }

    function undoMode4Jump() {
      if (!state.m4.jumps.length) return;
      state.m4.jumps.pop();
      state.m4.feedbackMsg = '';
      AudioSystem.playHint();
      render();
    }

    function renderMode4() {
      const { target, boots, jumps, feedbackMsg } = state.m4;
      const cur = getMode4Current();
      const remaining = target - cur;
      const reached = cur === target;
      const minBoot = Math.min(...boots);
      const isStuck = !reached && remaining < minBoot;
      const maxTrack = Math.max(20, target + 2);
      const lastStep = jumps.length ? jumps[jumps.length - 1].step : 2;
      applyBootTheme(lastStep);

      // Faixa superior: seleção rápida de alvos (ex.: 10, 12, 15, 17, 19, 23)
      quickStripEl.innerHTML = `
        <span style="font-size:0.78rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Alvo:</span>
        ${GOAL_PRESETS.map(g => `
          <button class="boot-pill ${target === g ? 'active' : ''}" data-m4-goal="${g}" type="button">
            🏁 ${g}
          </button>
        `).join('')}
      `;

      quickStripEl.querySelectorAll('[data-m4-goal]').forEach(btn => {
        btn.addEventListener('click', () => initMode4(Number(btn.dataset.m4Goal)));
      });

      // Reta contínua deslizante com arcos coloridos por bota usada
      const tileW = 64, tileH = 60, gapX = 18;
      const unitStep = tileW + gapX;
      const padX = 56;
      const vw = padX * 2 + maxTrack * unitStep;
      const vh = 250;
      const cy = 152;

      const pos = {};
      for (let n = 0; n <= maxTrack; n++) {
        pos[n] = { x: padX + n * unitStep, y: cy };
      }

      const railSvg = `<line class="track-rail" x1="${pos[0].x}" y1="${cy}" x2="${pos[maxTrack].x}" y2="${cy}" />`;

      // Arcos coloridos conforme a bota de cada salto
      let arcsSvg = '';
      jumps.forEach(j => {
        const theme = BOOT_THEMES[j.step] || BOOT_THEMES[2];
        const a = pos[j.from];
        const b = pos[j.to];
        const yTop = cy - tileH / 2 - 4;
        const midX = (a.x + b.x) / 2;
        const arcLift = 46 + j.step * 11;
        const ctrlY = yTop - arcLift;
        const labelY = yTop - arcLift * 0.56;

        arcsSvg += `
          <path class="jump-arc" style="stroke:${theme.color}" d="M ${a.x} ${yTop} Q ${midX} ${ctrlY} ${b.x} ${yTop}" />
          <rect class="jump-label-bg" style="fill:${theme.color}" x="${midX - 16}" y="${labelY - 10}" width="32" height="20" rx="10" />
          <text class="jump-label-txt" x="${midX}" y="${labelY}">+${j.step}</text>
        `;
      });

      // Casas visitadas + bandeira no alvo
      const visitedSet = new Set([0, ...jumps.map(j => j.to)]);
      let tilesSvg = '';
      for (let n = 0; n <= maxTrack; n++) {
        const p = pos[n];
        const isCurrent = n === cur;
        const isVisited = visitedSet.has(n);
        const isGoal = n === target;

        const cls = [
          'track-tile',
          isVisited ? 'visited' : '',
          isGoal ? 'target-goal' : '',
          isCurrent ? 'current' : ''
        ].filter(Boolean).join(' ');

        const goalFlag = isGoal
          ? `<text x="${p.x}" y="${p.y - tileH / 2 - 14}" font-size="18" text-anchor="middle" pointer-events="none">🏁</text>`
          : '';

        tilesSvg += `
          <g class="${cls}" data-t4="${n}" role="button" tabindex="0" aria-label="Casa ${n}${isGoal ? ' (Alvo)' : ''}">
            ${goalFlag}
            <rect class="track-tile-rect" x="${p.x - tileW / 2}" y="${p.y - tileH / 2}" width="${tileW}" height="${tileH}" rx="12" />
            <text class="track-tile-num" x="${p.x}" y="${p.y}">${n}</text>
          </g>
        `;
      }

      const curP = pos[cur];
      const bootBadgeSvg = `
        <g transform="translate(${curP.x}, ${curP.y + tileH / 2 + 16})" aria-hidden="true">
          <circle cx="0" cy="0" r="12" fill="#0f172a" />
          <text x="0" y="1" font-size="13" text-anchor="middle" dominant-baseline="central">👟</text>
        </g>
      `;

      const stageH = stageBoxEl.clientHeight || 280;
      const scale = Math.max(0.76, Math.min(1.12, (stageH - 18) / vh));
      const dispW = Math.round(vw * scale);
      const dispH = Math.round(vh * scale);

      stageBoxEl.classList.toggle('stage-done', reached);
      stageBoxEl.innerHTML = `
        <div id="trackViewport4" class="track-viewport" aria-label="Trilha do desafio de chegada até ${target}">
          <svg class="track-svg" width="${dispW}" height="${dispH}" viewBox="0 0 ${vw} ${vh}">
            ${railSvg}
            ${arcsSvg}
            ${tilesSvg}
            ${bootBadgeSvg}
          </svg>
        </div>
      `;

      const viewport = document.getElementById('trackViewport4');
      if (viewport) {
        viewport.scrollLeft = state.m4.lastScrollLeft || 0;
        const maxScroll = Math.max(0, dispW - viewport.clientWidth);
        const curPx = curP.x * scale;
        const targetScroll = Math.max(0, Math.min(maxScroll, Math.round(curPx - viewport.clientWidth * 0.25)));
        requestAnimationFrame(() => {
          viewport.scrollTo({ left: targetScroll, behavior: 'smooth' });
        });
        viewport.addEventListener('scroll', () => {
          state.m4.lastScrollLeft = viewport.scrollLeft;
        }, { passive: true });
        viewport.addEventListener('wheel', (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            viewport.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      }

      // Permite clicar diretamente em uma casa à frente se a distância bater com uma bota disponível
      stageBoxEl.querySelectorAll('[data-t4]').forEach(el => {
        el.addEventListener('click', () => {
          const n = Number(el.dataset.t4);
          const diff = n - cur;
          if (boots.includes(diff)) doMode4Jump(diff);
        });
      });

      // Rodapé
      counterCaptionEl.textContent = `Alvo ${target}`;
      animateCounter(String(cur));
      counterPillEl.classList.toggle('done', reached);

      const usedBoots = new Set(jumps.map(j => j.step));
      const sumExpr = jumps.map(j => j.step).join(' + ');

      if (reached) {
        const modeDesc = usedBoots.size === 1 ? 'bota única' : `${usedBoots.size} botas combinadas`;
        statusInstructionEl.textContent = `Chegou no ${target} (${modeDesc})! ${sumExpr} = ${target}`;
        statusInstructionEl.className = 'status-instruction success';
      } else if (isStuck) {
        statusInstructionEl.textContent = `Falta ${remaining} para o ${target}, mas não há bota +${remaining}. Use ↩ Desfazer!`;
        statusInstructionEl.className = 'status-instruction';
      } else if (feedbackMsg) {
        statusInstructionEl.textContent = feedbackMsg;
        statusInstructionEl.className = 'status-instruction';
      } else {
        const canSingle = boots.some(b => target % b === 0);
        statusInstructionEl.textContent = jumps.length === 0
          ? (canSingle
              ? `Chegue no ${target}! Dá para ir com uma só bota ou combinando.`
              : `Chegue no ${target}! Combine botas diferentes para acertar em cheio.`)
          : `Faltam ${remaining} casas para chegar no ${target}.`;
        statusInstructionEl.className = 'status-instruction';
      }

      footerActionsEl.innerHTML = `
        <button id="m4UndoBtn" class="secondary-btn" type="button" ${jumps.length === 0 ? 'disabled' : ''}>↩ Desfazer</button>
        ${reached ? `<button id="m4NextGoalBtn" class="primary-btn ready" type="button">Próximo Alvo →</button>` : ''}
      `;
      document.getElementById('m4UndoBtn').addEventListener('click', undoMode4Jump);
      const nextGoalBtn = document.getElementById('m4NextGoalBtn');
      if (nextGoalBtn) {
        nextGoalBtn.addEventListener('click', () => {
          const idx = GOAL_PRESETS.indexOf(target);
          const nextG = GOAL_PRESETS[(idx + 1) % GOAL_PRESETS.length];
          initMode4(nextG);
        });
      }

      // Botões das botas disponíveis para combinar no rodapé
      footerBottomEl.innerHTML = `
        <div class="boot-action-row" role="group" aria-label="Escolher bota para saltar">
          ${boots.map(b => {
            const theme = BOOT_THEMES[b] || BOOT_THEMES[2];
            const disabled = reached || (cur + b > target);
            return `
              <button class="boot-action-btn" data-m4-jump="${b}" type="button"
                      style="--btn-color:${theme.color};--btn-soft:${theme.soft};"
                      ${disabled ? 'disabled' : ''}>
                👟 +${b}
              </button>
            `;
          }).join('')}
        </div>
      `;
      footerBottomEl.querySelectorAll('[data-m4-jump]').forEach(btn => {
        btn.addEventListener('click', () => doMode4Jump(Number(btn.dataset.m4Jump)));
      });
    }

    /* =========================================================
       MODO 5: PRÉ-MMC (2 OU 3 PISTAS PARALELAS ALINHADAS)
       ========================================================= */
    const MMC_PRESETS_2 = [
      { label: '2 e 3', steps: [2, 3] },
      { label: '2 e 5', steps: [2, 5] },
      { label: '3 e 4', steps: [3, 4] },
      { label: '3 e 5', steps: [3, 5] },
      { label: '4 e 6', steps: [4, 6] }
    ];

    const MMC_PRESETS_3 = [
      { label: '2, 3 e 4', steps: [2, 3, 4] },
      { label: '2, 3 e 5', steps: [2, 3, 5] },
      { label: '2, 4 e 6', steps: [2, 4, 6] }
    ];

    function initMode5(laneCount = state.m5.laneCount, steps = null) {
      stopAutoJump();
      state.m5.laneCount = laneCount;
      if (steps) {
        steps.forEach((s, idx) => {
          if (state.m5.lanes[idx]) state.m5.lanes[idx].step = s;
        });
      }
      state.m5.lanes.forEach(lane => { lane.path = [0]; });
      state.m5.celebratedMeetings = [];
      state.m5.lastScrollLeft = 0;
      render();
    }

    function getActiveM5Lanes() {
      return state.m5.lanes.slice(0, state.m5.laneCount);
    }

    function getMode5Meetings() {
      const active = getActiveM5Lanes();
      const firstSet = active[0].path.filter(n => n > 0);
      return firstSet.filter(n => active.every(lane => lane.path.includes(n)));
    }

    function getMode5BehindLaneIndex() {
      const active = getActiveM5Lanes();
      let bestIdx = -1;
      let minPos = Infinity;
      active.forEach((lane, idx) => {
        const cur = lane.path[lane.path.length - 1];
        if (cur + lane.step <= state.m5.maxVal && cur < minPos) {
          minPos = cur;
          bestIdx = idx;
        }
      });
      return bestIdx;
    }

    function doMode5LaneJump(laneIdx) {
      const lane = state.m5.lanes[laneIdx];
      if (!lane) return;
      const cur = lane.path[lane.path.length - 1];
      const next = cur + lane.step;
      if (next > state.m5.maxVal) return;

      lane.path.push(next);

      const meetings = getMode5Meetings();
      const newMeeting = meetings.find(m => !state.m5.celebratedMeetings.includes(m));
      if (newMeeting !== undefined) {
        state.m5.celebratedMeetings.push(newMeeting);
        AudioSystem.playSuccess();
        setTimeout(() => {
          AudioSystem.speakText(`Encontro no ${numberToPtBr(newMeeting)}!`);
        }, 220);
      } else {
        AudioSystem.playJump(lane.path.length - 1, next);
      }

      if (getMode5BehindLaneIndex() === -1) {
        stopAutoJump();
      }
      render();
    }

    function toggleMode5Auto() {
      if (state.autoTimer) {
        stopAutoJump();
        render();
        return;
      }
      if (getMode5BehindLaneIndex() === -1) {
        initMode5(state.m5.laneCount);
      }
      const stepOnce = () => {
        const idx = getMode5BehindLaneIndex();
        if (idx === -1) {
          stopAutoJump();
          render();
          return;
        }
        const beforeMeetings = state.m5.celebratedMeetings.length;
        doMode5LaneJump(idx);
