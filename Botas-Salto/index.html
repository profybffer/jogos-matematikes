        // Pausa automaticamente no primeiro encontro para o professor conversar com a turma
        if (state.m5.celebratedMeetings.length > beforeMeetings && beforeMeetings === 0) {
          stopAutoJump();
          render();
        }
      };
      stepOnce();
      if (getMode5BehindLaneIndex() !== -1 && state.m5.celebratedMeetings.length === 0) {
        state.autoTimer = setInterval(stepOnce, 720);
      }
      render();
    }

    function renderMode5() {
      const { laneCount, maxVal } = state.m5;
      const activeLanes = getActiveM5Lanes();
      const meetings = getMode5Meetings();
      const behindIdx = getMode5BehindLaneIndex();
      const allDone = behindIdx === -1;

      applyBootTheme(activeLanes[0].step);

      // Faixa superior: 2 ou 3 pistas + presets
      const presets = laneCount === 2 ? MMC_PRESETS_2 : MMC_PRESETS_3;
      const activeKey = activeLanes.map(l => l.step).join('-');
      quickStripEl.innerHTML = `
        <button class="mode-pill ${laneCount === 2 ? 'active' : ''}" data-m5-cnt="2" type="button">2 Pistas</button>
        <button class="mode-pill ${laneCount === 3 ? 'active' : ''}" data-m5-cnt="3" type="button">3 Pistas</button>
        <span class="strip-divider" aria-hidden="true"></span>
        ${presets.map(p => `
          <button class="boot-pill ${activeKey === p.steps.join('-') ? 'active' : ''}" data-m5-pre="${p.steps.join('-')}" type="button">
            ${p.label}
          </button>
        `).join('')}
      `;

      quickStripEl.querySelectorAll('[data-m5-cnt]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cnt = Number(btn.dataset.m5Cnt);
          const defSteps = cnt === 2 ? [2, 3] : [2, 3, 4];
          initMode5(cnt, defSteps);
        });
      });
      quickStripEl.querySelectorAll('[data-m5-pre]').forEach(btn => {
        btn.addEventListener('click', () => {
          const steps = btn.dataset.m5Pre.split('-').map(Number);
          initMode5(steps.length, steps);
        });
      });

      // SVG com 2 ou 3 pistas paralelas perfeitamente alinhadas verticalmente (0..30)
      const tileW = 46;
      const tileH = 38;
      const gapX = 12;
      const unitStep = tileW + gapX; // 58px por unidade
      const padLeft = 64;
      const padRight = 46;
      const vw = padLeft + maxVal * unitStep + padRight;
      const laneH = laneCount === 2 ? 128 : 102;
      const topPad = 34;
      const vh = topPad + laneCount * laneH + 16;

      const xOf = (n) => padLeft + n * unitStep;
      const yOfLane = (idx) => topPad + idx * laneH + laneH * 0.66;

      // Colunas verticais de encontro (Múltiplos Comuns)
      let beamsSvg = '';
      meetings.forEach(m => {
        const mx = xOf(m);
        beamsSvg += `
          <rect class="meeting-beam" x="${mx - tileW / 2 - 5}" y="22" width="${tileW + 10}" height="${vh - 30}" rx="12" />
          <rect class="meeting-badge-bg" x="${mx - 22}" y="4" width="44" height="22" rx="11" />
          <text class="meeting-badge-txt" x="${mx}" y="15">★ ${m}</text>
        `;
      });

      let lanesSvg = '';
      activeLanes.forEach((lane, lIdx) => {
        const theme = BOOT_THEMES[lane.step] || BOOT_THEMES[2];
        const cy = yOfLane(lIdx);
        const cur = lane.path[lane.path.length - 1];
        const next = cur + lane.step <= maxVal ? cur + lane.step : null;

        // Etiqueta da pista à esquerda
        lanesSvg += `
          <rect x="6" y="${cy - 16}" width="40" height="32" rx="8" fill="${theme.color}" />
          <text x="26" y="${cy}" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">+${lane.step}</text>
          <line class="track-rail" style="stroke-width:3.5" x1="${xOf(0)}" y1="${cy}" x2="${xOf(maxVal)}" y2="${cy}" />
        `;

        // Arcos da pista
        const arcLift = laneCount === 2 ? (34 + lane.step * 6) : (26 + lane.step * 4.5);
        for (let i = 0; i < lane.path.length - 1; i++) {
          const x1 = xOf(lane.path[i]);
          const x2 = xOf(lane.path[i + 1]);
          const yTop = cy - tileH / 2 - 2;
          const mid = (x1 + x2) / 2;
          lanesSvg += `
            <path class="jump-arc" style="stroke:${theme.color};stroke-width:3.2" d="M ${x1} ${yTop} Q ${mid} ${yTop - arcLift} ${x2} ${yTop}" />
          `;
        }

        // Casas 0..30 da pista
        for (let n = 0; n <= maxVal; n++) {
          const px = xOf(n);
          const isCur = n === cur;
          const isVis = lane.path.includes(n);
          const isMeet = meetings.includes(n);
          const isNext = n === next;

          let fill = '#ffffff';
          let stroke = '#cbd5e1';
          let txt = '#475569';
          let sw = 2;

          if (isVis) {
            fill = theme.soft;
            stroke = theme.color;
            txt = theme.color;
            sw = 2.5;
          }
          if (isCur) {
            fill = theme.color;
            stroke = '#0f172a';
            txt = '#ffffff';
            sw = 3;
          }
          if (isMeet) {
            stroke = '#047857';
            sw = 3.2;
          }

          lanesSvg += `
            <g class="track-tile" data-m5-lane="${lIdx}" data-m5-n="${n}" role="button" tabindex="0" aria-label="Pista ${lIdx + 1}, casa ${n}">
              <rect x="${px - tileW / 2}" y="${cy - tileH / 2}" width="${tileW}" height="${tileH}" rx="9"
                    fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${isNext && !isVis ? 'stroke-dasharray="4 3"' : ''} />
              <text x="${px}" y="${cy}" font-size="16" font-weight="900" fill="${txt}" text-anchor="middle" dominant-baseline="central" pointer-events="none">${n}</text>
            </g>
          `;
        }
      });

      const stageH = stageBoxEl.clientHeight || 290;
      const scale = Math.max(0.74, Math.min(1.12, (stageH - 14) / vh));
      const dispW = Math.round(vw * scale);
      const dispH = Math.round(vh * scale);

      stageBoxEl.classList.toggle('stage-done', meetings.length > 0);
      stageBoxEl.innerHTML = `
        <div id="trackViewport5" class="track-viewport" aria-label="Pistas paralelas de Pré-MMC">
          <svg class="track-svg" width="${dispW}" height="${dispH}" viewBox="0 0 ${vw} ${vh}">
            ${beamsSvg}
            ${lanesSvg}
          </svg>
        </div>
      `;

      // Câmera acompanha suavemente a posição mais avançada entre as pistas
      const maxCur = Math.max(...activeLanes.map(l => l.path[l.path.length - 1]));
      const viewport = document.getElementById('trackViewport5');
      if (viewport) {
        viewport.scrollLeft = state.m5.lastScrollLeft || 0;
        const maxScroll = Math.max(0, dispW - viewport.clientWidth);
        const focusPx = xOf(maxCur) * scale;
        const targetScroll = Math.max(0, Math.min(maxScroll, Math.round(focusPx - viewport.clientWidth * 0.55)));
        requestAnimationFrame(() => {
          viewport.scrollTo({ left: targetScroll, behavior: 'smooth' });
        });
        viewport.addEventListener('scroll', () => {
          state.m5.lastScrollLeft = viewport.scrollLeft;
        }, { passive: true });
        viewport.addEventListener('wheel', (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            viewport.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      }

      // Clicar em qualquer casa de uma pista faz aquela pista dar o próximo salto
      stageBoxEl.querySelectorAll('[data-m5-lane]').forEach(el => {
        el.addEventListener('click', () => doMode5LaneJump(Number(el.dataset.m5Lane)));
      });

      // Rodapé
      counterCaptionEl.textContent = '1º Encontro';
      animateCounter(meetings.length > 0 ? String(meetings[0]) : '—');
      counterPillEl.classList.toggle('done', meetings.length > 0);

      if (meetings.length > 0) {
        statusInstructionEl.textContent = `Encontros encontrados: ${meetings.join(', ')}! O menor encontro é o ${meetings[0]}.`;
        statusInstructionEl.className = 'status-instruction success';
      } else {
        statusInstructionEl.textContent = 'Faça as botas saltarem até todas pisarem no mesmo número!';
        statusInstructionEl.className = 'status-instruction';
      }

      footerActionsEl.innerHTML = `
        <button id="m5AutoBtn" class="secondary-btn ${state.autoTimer ? 'running' : ''}" type="button">
          ${state.autoTimer ? '⏸ Pausar' : '▶ Auto'}
        </button>
        <button id="m5BehindBtn" class="primary-btn ${allDone ? 'ready' : ''}" type="button">
          ${allDone ? '↺ Recomeçar' : 'Avançar atrás →'}
        </button>
      `;
      document.getElementById('m5AutoBtn').addEventListener('click', toggleMode5Auto);
      document.getElementById('m5BehindBtn').addEventListener('click', () => {
        if (allDone) initMode5(laneCount);
        else doMode5LaneJump(behindIdx);
      });

      // Botões individuais de salto para cada pista + resumo dos encontros
      footerBottomEl.innerHTML = `
        <div class="boot-action-row">
          ${activeLanes.map((lane, idx) => {
            const theme = BOOT_THEMES[lane.step] || BOOT_THEMES[2];
            const cur = lane.path[lane.path.length - 1];
            const canJump = cur + lane.step <= maxVal;
            return `
              <button class="boot-action-btn" data-m5-btn="${idx}" type="button"
                      style="--btn-color:${theme.color};--btn-soft:${theme.soft};"
                      ${!canJump ? 'disabled' : ''}>
                Pista ${idx + 1}: +${lane.step} (${cur})
              </button>
            `;
          }).join('')}
          ${meetings.length > 0 ? `<span class="meeting-summary">★ ${meetings.join(' · ')}</span>` : ''}
        </div>
      `;
      footerBottomEl.querySelectorAll('[data-m5-btn]').forEach(btn => {
        btn.addEventListener('click', () => doMode5LaneJump(Number(btn.dataset.m5Btn)));
      });
    }

    /* =========================================================
       PAINEL DO PROFESSOR (GAVETA RECOLHÍVEL)
       ========================================================= */
    function setDrawerOpen(open) {
      state.drawerOpen = open;
      teacherDrawerEl.classList.toggle('open', open);
      drawerBackdropEl.classList.toggle('open', open);
      teacherDrawerEl.setAttribute('aria-hidden', String(!open));
      panelToggleBtn.setAttribute('aria-expanded', String(open));
      panelToggleBtn.classList.toggle('btn-panel-open', open);
      if (open) renderDrawer();
    }

    function renderDrawer() {
      if (state.mode === 1) {
        drawerBodyEl.innerHTML = `
          <div class="drawer-section">
            <span class="drawer-label">Tamanho do Salto (Bota)</span>
            <div class="drawer-grid">
              ${[2, 3, 4, 5].map(s => `<button class="d-btn ${state.m1.step === s ? 'active' : ''}" data-dm1-s="${s}" type="button">👟 +${s}</button>`).join('')}
            </div>
          </div>
          <div class="drawer-section">
            <span class="drawer-label">Casa Inicial (0 a 5)</span>
            <div class="drawer-grid">
              ${[0, 1, 2, 3, 4, 5].map(n => `<button class="d-btn ${state.m1.startAt === n ? 'active' : ''}" data-dm1-st="${n}" type="button">${n}</button>`).join('')}
            </div>
          </div>
          <p class="drawer-note">
            <strong>Dica pedagógica:</strong> Começar no <strong>0</strong> mostra os múltiplos exatos (ex: 0, 3, 6, 9…). Começar no <strong>1</strong> com a bota +2 mostra os números ímpares (1, 3, 5, 7…).
          </p>
        `;
        drawerBodyEl.querySelectorAll('[data-dm1-s]').forEach(btn => {
          btn.addEventListener('click', () => { initMode1(Number(btn.dataset.dm1S), state.m1.startAt); renderDrawer(); });
        });
        drawerBodyEl.querySelectorAll('[data-dm1-st]').forEach(btn => {
          btn.addEventListener('click', () => { initMode1(state.m1.step, Number(btn.dataset.dm1St)); renderDrawer(); });
        });
        drawerRandomBtn.textContent = '🎲 Sortear Bota';
      } else if (state.mode === 2) {
        drawerBodyEl.innerHTML = `
          <div class="drawer-section">
            <span class="drawer-label">Tamanho do Salto (Bota)</span>
            <div class="drawer-grid">
              ${[10, 5, 2, 3].map(s => `<button class="d-btn ${state.m2.step === s ? 'active' : ''}" data-dm2-s="${s}" type="button">👟 +${s}</button>`).join('')}
            </div>
          </div>
          <div class="drawer-section">
            <span class="drawer-label">Atalhos de Ponto de Partida</span>
            <div class="drawer-grid">
              ${[0, 1, 3, 4, 7].map(n => `<button class="d-btn ${state.m2.startAt === n ? 'active' : ''}" data-dm2-st="${n}" type="button">Partir do ${n}</button>`).join('')}
            </div>
          </div>
          <div class="drawer-section">
            <span class="drawer-label">Guia Visual (Sistema Decimal)</span>
            <label class="d-toggle">
              <input id="dm2ColCheck" type="checkbox" ${state.m2.highlightColumn ? 'checked' : ''} />
              Destacar coluna das unidades (+10)
            </label>
          </div>
          <p class="drawer-note">
            <strong>Dica pedagógica:</strong> Escolha <em>Partir do 4</em> com a bota <strong>+10</strong> para a turma ver que 4 → 14 → 24 → 34 mantém o 4 na casa das unidades!
          </p>
        `;
        drawerBodyEl.querySelectorAll('[data-dm2-s]').forEach(btn => {
          btn.addEventListener('click', () => { initMode2(Number(btn.dataset.dm2S), state.m2.startAt); renderDrawer(); });
        });
        drawerBodyEl.querySelectorAll('[data-dm2-st]').forEach(btn => {
          btn.addEventListener('click', () => { initMode2(state.m2.step, Number(btn.dataset.dm2St)); renderDrawer(); });
        });
        document.getElementById('dm2ColCheck').addEventListener('change', (e) => {
          state.m2.highlightColumn = e.target.checked;
          render();
        });
        drawerRandomBtn.textContent = '🎲 Sortear Partida (+10)';
      } else if (state.mode === 4) {
        const allGoals = [8, 10, 11, 12, 13, 14, 15, 17, 18, 19, 21, 23];
        drawerBodyEl.innerHTML = `
          <div class="drawer-section">
            <span class="drawer-label">Escolher Ponto de Chegada (Alvo)</span>
            <div class="drawer-grid">
              ${allGoals.map(g => `<button class="d-btn ${state.m4.target === g ? 'active' : ''}" data-dm4-g="${g}" type="button">🏁 ${g}</button>`).join('')}
            </div>
          </div>
          <p class="drawer-note">
            <strong>Dica pedagógica:</strong> Alvos como <strong>10</strong> e <strong>12</strong> permitem usar uma única bota (múltiplos). Já números primos como <strong>11, 13, 17, 19 e 23</strong> exigem combinar botas diferentes (decomposição numérica)!
          </p>
        `;
        drawerBodyEl.querySelectorAll('[data-dm4-g]').forEach(btn => {
          btn.addEventListener('click', () => { initMode4(Number(btn.dataset.dm4G)); renderDrawer(); });
        });
        drawerRandomBtn.textContent = '🎲 Sortear Novo Alvo';
      } else if (state.mode === 5) {
        const activeLanes = getActiveM5Lanes();
        drawerBodyEl.innerHTML = `
          <div class="drawer-section">
            <span class="drawer-label">Quantidade de Pistas</span>
            <div class="drawer-grid">
              <button class="d-btn ${state.m5.laneCount === 2 ? 'active' : ''}" data-dm5-c="2" type="button">2 Pistas</button>
              <button class="d-btn ${state.m5.laneCount === 3 ? 'active' : ''}" data-dm5-c="3" type="button">3 Pistas</button>
            </div>
          </div>
          ${activeLanes.map((lane, idx) => `
            <div class="drawer-section">
              <span class="drawer-label">Bota da Pista ${idx + 1}</span>
              <div class="drawer-grid">
                ${[2, 3, 4, 5, 6].map(s => `<button class="d-btn ${lane.step === s ? 'active' : ''}" data-dm5-l="${idx}" data-dm5-s="${s}" type="button">+${s}</button>`).join('')}
              </div>
            </div>
          `).join('')}
          <p class="drawer-note">
            <strong>Dica pedagógica:</strong> Use <em>Avançar atrás</em> para a turma enxergar que o primeiro número onde todas as pistas se encontram é o <strong>Mínimo Múltiplo Comum (MMC)</strong>!
          </p>
        `;
        drawerBodyEl.querySelectorAll('[data-dm5-c]').forEach(btn => {
          btn.addEventListener('click', () => {
            const cnt = Number(btn.dataset.dm5C);
            initMode5(cnt, cnt === 2 ? [2, 3] : [2, 3, 4]);
            renderDrawer();
          });
        });
        drawerBodyEl.querySelectorAll('[data-dm5-l]').forEach(btn => {
          btn.addEventListener('click', () => {
            const lIdx = Number(btn.dataset.dm5L);
            const step = Number(btn.dataset.dm5S);
            state.m5.lanes[lIdx].step = step;
            initMode5(state.m5.laneCount);
            renderDrawer();
          });
        });
        drawerRandomBtn.textContent = '🎲 Sortear Combinação';
      } else {
        const topics = [
          { id: 'mixed', label: 'Misto (Todos)' },
          { id: 'track', label: 'Trilha 0–20' },
          { id: 'identify', label: 'Qual é a Bota?' },
          { id: 'decimal', label: 'Andares (+10)' }
        ];
        drawerBodyEl.innerHTML = `
          <div class="drawer-section">
            <span class="drawer-label">Tamanho da Rodada</span>
            <div class="drawer-grid">
              ${[5, 6, 8].map(sz => `<button class="d-btn ${state.m3.roundSize === sz ? 'active' : ''}" data-dm3-sz="${sz}" type="button">${sz} perguntas</button>`).join('')}
            </div>
          </div>
          <div class="drawer-section">
            <span class="drawer-label">Filtro de Tema</span>
            <div class="drawer-grid">
              ${topics.map(t => `<button class="d-btn ${state.m3.topic === t.id ? 'active' : ''}" data-dm3-tp="${t.id}" type="button">${t.label}</button>`).join('')}
            </div>
          </div>
        `;
        drawerBodyEl.querySelectorAll('[data-dm3-sz]').forEach(btn => {
          btn.addEventListener('click', () => { state.m3.roundSize = Number(btn.dataset.dm3Sz); initMode3(false); renderDrawer(); });
        });
        drawerBodyEl.querySelectorAll('[data-dm3-tp]').forEach(btn => {
          btn.addEventListener('click', () => { state.m3.topic = btn.dataset.dm3Tp; initMode3(false); renderDrawer(); });
        });
        drawerRandomBtn.textContent = '🔄 Iniciar Novo Desafio';
      }
    }

    function randomizeCurrentMode() {
      if (state.mode === 1) {
        const pool = [2, 3, 4, 5];
        const next = pool[(pool.indexOf(state.m1.step) + 1) % pool.length];
        initMode1(next, 0);
      } else if (state.mode === 2) {
        const randStart = 1 + Math.floor(Math.random() * 9);
        initMode2(10, randStart);
      } else if (state.mode === 4) {
        const pool = [10, 12, 13, 15, 17, 19, 21, 23];
        let next = pool[Math.floor(Math.random() * pool.length)];
        if (next === state.m4.target) next = pool[(pool.indexOf(next) + 1) % pool.length];
        initMode4(next);
      } else if (state.mode === 5) {
        const list = state.m5.laneCount === 2 ? MMC_PRESETS_2 : MMC_PRESETS_3;
        const pick = list[Math.floor(Math.random() * list.length)];
        initMode5(state.m5.laneCount, pick.steps);
      } else {
        initMode3(true);
      }
      if (state.drawerOpen) renderDrawer();
    }

    /* =========================================================
       RENDER PRINCIPAL E EVENTOS GLOBAIS
       ========================================================= */
    function render() {
      document.querySelectorAll('.mode-tab').forEach(tab => {
        const active = Number(tab.dataset.mode) === state.mode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', String(active));
      });

      if (state.mode === 1) renderMode1();
      else if (state.mode === 2) renderMode2();
      else if (state.mode === 4) renderMode4();
      else if (state.mode === 5) renderMode5();
      else renderMode3();
    }

    function updateAudioButtonUI() {
      const m = AudioSystem.getMode();
      audioBtn.classList.toggle('audio-muted', m === 'mute');
      if (m === 'voice') {
        audioIconEl.textContent = '🔊';
        audioLabelEl.textContent = 'Voz + Som';
      } else if (m === 'sfx') {
        audioIconEl.textContent = '🎵';
        audioLabelEl.textContent = 'Só Som';
      } else {
        audioIconEl.textContent = '🔇';
        audioLabelEl.textContent = 'Mudo';
      }
    }

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        stopAutoJump();
        AudioSystem.stopSpeech();
        state.mode = Number(tab.dataset.mode);
        if (state.drawerOpen) renderDrawer();
        if (state.mode === 3) {
          if (!state.m3.questions.length || state.m3.finished) initMode3(true);
          else {
            render();
            const q = state.m3.questions[state.m3.currentIndex];
            if (q) AudioSystem.speakText(q.prompt);
          }
        } else {
          render();
        }
      });
    });

    audioBtn.addEventListener('click', () => {
      AudioSystem.cycleMode();
      updateAudioButtonUI();
    });

    resetBtn.addEventListener('click', () => {
      if (state.mode === 1) initMode1(state.m1.step, state.m1.startAt);
      else if (state.mode === 2) initMode2(state.m2.step, state.m2.startAt);
      else if (state.mode === 4) initMode4(state.m4.target);
      else if (state.mode === 5) initMode5(state.m5.laneCount);
      else initMode3(true);
    });

    panelToggleBtn.addEventListener('click', () => setDrawerOpen(!state.drawerOpen));
    drawerCloseBtn.addEventListener('click', () => setDrawerOpen(false));
    drawerBackdropEl.addEventListener('click', () => setDrawerOpen(false));
    drawerRandomBtn.addEventListener('click', () => {
      randomizeCurrentMode();
      setDrawerOpen(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.drawerOpen) setDrawerOpen(false);
    });

    window.addEventListener('resize', updateOrientation);

    window.onload = function () {
      updateAudioButtonUI();
      const w = stageBoxEl.clientWidth || window.innerWidth;
      const h = stageBoxEl.clientHeight || window.innerHeight;
      state.isPortrait = w < h * 0.92;
      initMode1(2, 0);
    };
  </script>
</body>
</html>
