      }, labelText));

      g.appendChild(shieldG);
      return g;
    }

    /* =========================================================================
       CONTROLE DE CÂMERA (PAN, ZOOM, AUTO-FOLLOW E SCRUBBER)
       ========================================================================= */
    function clampCamera(x) {
      const visibleWorldW = state.viewW / state.zoom;
      const maxCam = Math.max(0, getWorldW() - visibleWorldW);
      return Math.max(0, Math.min(maxCam, x));
    }

    function applyCameraTransform() {
      const visibleWorldW = state.viewW / state.zoom;
      dom.svg.setAttribute('viewBox', `${state.cameraX.toFixed(1)} 0 ${visibleWorldW.toFixed(1)} ${state.viewH.toFixed(1)}`);
      dom.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
      updateScrubberUI();
    }

    function setZoom(newZoom, anchorRatio = 0.5) {
      const clamped = Math.max(0.45, Math.min(2.0, newZoom));
      const oldVisibleW = state.viewW / state.zoom;
      const anchorWorldX = state.cameraX + oldVisibleW * anchorRatio;
      state.zoom = clamped;
      const newVisibleW = state.viewW / state.zoom;
      state.cameraX = clampCamera(anchorWorldX - newVisibleW * anchorRatio);
      state.targetCameraX = state.cameraX;
      applyCameraTransform();
    }

    function fitCameraToContext() {
      state.autoFollow = true;
      const target = getCurrentTarget();
      let maxFocusNum = 16;

      if (target !== null) {
        maxFocusNum = Math.min(state.maxNum, target + 3);
      } else if (isMultiRunnerMMCPhase() && state.mmcValue) {
        maxFocusNum = Math.min(state.maxNum, state.mmcValue + 3);
      } else {
        const furthest = state.runners.reduce((m, r) => Math.max(m, r.pos), 0);
        maxFocusNum = Math.max(14, Math.min(state.maxNum, furthest + 5));
      }

      const neededWorldW = numToX(maxFocusNum) + 50;
      const idealZoom = Math.max(0.45, Math.min(1.15, state.viewW / neededWorldW));
      state.zoom = idealZoom;
      state.cameraX = 0;
      state.targetCameraX = 0;
      applyCameraTransform();
    }

    function focusCameraOnNumber(num, immediate = false) {
      const worldX = numToX(num);
      const visibleW = state.viewW / state.zoom;
      const desired = clampCamera(worldX - visibleW * 0.62);
      state.targetCameraX = desired;
      if (immediate) {
        state.cameraX = desired;
        applyCameraTransform();
      }
    }

    function updateScrubberUI() {
      const worldW = getWorldW();
      const visibleW = state.viewW / state.zoom;
      const pctLeft = (state.cameraX / worldW) * 100;
      const pctWidth = Math.min(100, (visibleW / worldW) * 100);
      dom.scrubberThumb.style.left = `${Math.max(0, Math.min(100 - pctWidth, pctLeft))}%`;
      dom.scrubberThumb.style.width = `${pctWidth}%`;
      dom.scrubberMaxLabel.textContent = String(state.maxNum);

      // Marcadores dos saltadores e alvo no scrubber
      let html = '';
      const target = getCurrentTarget();
      if (target !== null) {
        const tx = (numToX(target) / worldW) * 100;
        html += `<div class="scrubber-marker" style="left:${tx}%;background:#f59e0b;width:4px;"></div>`;
      }
      state.runners.forEach((r) => {
        const rx = (numToX(r.pos) / worldW) * 100;
        const pal = getStepPalette(r.step);
        html += `<div class="scrubber-marker" style="left:${rx}%;background:${pal.main};"></div>`;
      });
      dom.scrubberMarkers.innerHTML = html;
    }

    /* =========================================================================
       INICIALIZAÇÃO DAS FASES E CRIAÇÃO DOS SALTADORES
       ========================================================================= */
    function makeRunner(id, step) {
      return {
        id,
        step,
        pos: 0,
        jumpCount: 0,
        landings: [0],
        arcs: [],
        anim: null,
        status: 'idle'
      };
    }

    function stopAnimationLoop() {
      state.running = false;
      state.p4AutoTesting = false;
      if (state.rafId) {
        cancelAnimationFrame(state.rafId);
        state.rafId = null;
      }
      syncPlayButton();
    }

    function resetRunnersForCurrentPhase() {
      stopAnimationLoop();
      hideBanner();
      state.commonMultiples = [];
      state.mmcValue = null;
      state.popups = [];
      state.challengeCompleted = false;
      state.maxNum = computeDynamicMaxNum();

      if (state.phase === '1') {
        state.runners = [makeRunner('r0', state.p1Step)];
      } else if (state.phase === '2') {
        const activeSteps = state.p2Steps.slice(0, state.p2Count);
        state.runners = activeSteps.map((s, i) => makeRunner(`r${i}`, s));
      } else if (state.phase === '3') {
        state.runners = [makeRunner('r0', state.p3SelectedStep)];
      } else if (state.phase === '4') {
        state.runners = [makeRunner('r0', state.p4SelectedStep)];
      } else if (state.phase === '5') {
        const activeSteps = state.p5Steps.slice(0, state.p5Count);
        state.runners = activeSteps.map((s, i) => makeRunner(`r${i}`, s));
      }

      state.autoFollow = true;
      state.cameraX = 0;
      state.targetCameraX = 0;
      if (state.phase === '3' || state.phase === '4' || (state.phase === '5' && state.p5UseTarget)) {
        const t = getCurrentTarget();
        if (t !== null && t <= 22) {
          state.zoom = Math.min(1.05, Math.max(0.7, state.viewW / (numToX(t + 3) + 40)));
        } else {
          state.zoom = 0.92;
        }
      } else {
        state.zoom = 1.0;
      }

      buildStaticTrackAndRuler();
      renderDynamicSVG(performance.now());
      applyCameraTransform();
      renderContextBar();
      renderPanel();
      syncBottomButtons();
    }

    /* =========================================================================
       RENDERIZAÇÃO ESTÁTICA DAS PISTAS E RÉGUA (0 A state.maxNum)
       ========================================================================= */
    function buildStaticTrackAndRuler() {
      dom.layerLanes.innerHTML = '';
      dom.layerRuler.innerHTML = '';

      const { lanes, rulerY, h } = getLaneLayout();
      const worldW = getWorldW();

      // Pistas empilhadas
      lanes.forEach((lane, i) => {
        const bg = i % 2 === 0 ? '#ffffff' : '#f8fbff';
        dom.layerLanes.appendChild(svgEl('rect', {
          x: 0, y: lane.topY, width: worldW, height: lane.laneH,
          fill: bg, opacity: '0.84'
        }));

        // Linha divisória entre pistas
        dom.layerLanes.appendChild(svgEl('line', {
          x1: 0, y1: lane.topY, x2: worldW, y2: lane.topY,
          stroke: '#d5e1ee', 'stroke-width': 1.2
        }));

        // Chão da pista (trilha)
        dom.layerLanes.appendChild(svgEl('line', {
          x1: LEFT_PAD - 20, y1: lane.groundY,
          x2: worldW - 24, y2: lane.groundY,
          stroke: '#94a3b8', 'stroke-width': 2.5, 'stroke-linecap': 'round'
        }));
      });

      // Linhas verticais suaves de alinhamento e régua numérica de 0 a state.maxNum
      dom.layerRuler.appendChild(svgEl('rect', {
        x: 0, y: rulerY, width: worldW, height: h - rulerY,
        fill: '#ffffff', stroke: '#cbd5e1', 'stroke-width': 1.2
      }));

      for (let n = 0; n <= state.maxNum; n++) {
        const x = numToX(n);
        const isTen = n % 10 === 0;
        const isFive = n % 5 === 0;

        // Grade vertical sutil conectando todas as pistas
        dom.layerLanes.appendChild(svgEl('line', {
          x1: x, y1: 30, x2: x, y2: rulerY,
          stroke: isTen ? '#cbd5e1' : '#e2e8f0',
          'stroke-width': isTen ? 1.3 : 0.8,
          'stroke-dasharray': isTen ? '' : '3 4'
        }));

        // Marca na régua
        dom.layerRuler.appendChild(svgEl('line', {
          x1: x, y1: rulerY, x2: x, y2: rulerY + (isFive ? 10 : 6),
          stroke: isTen ? '#1e293b' : '#64748b',
          'stroke-width': isTen ? 2 : 1.2
        }));

        // Número
        dom.layerRuler.appendChild(svgEl('text', {
          x, y: rulerY + 25,
          'text-anchor': 'middle',
          fill: isTen ? '#0f172a' : '#475569',
          'font-size': isTen ? '13.5' : '11.5',
          'font-weight': isTen ? '900' : '800'
        }, String(n)));
      }
    }

    /* =========================================================================
       RENDERIZAÇÃO DINÂMICA DO PALCO SVG (FEIXES, ARCOS, PEGADAS, BANDEIRA, BONECOS)
       ========================================================================= */
    function renderDynamicSVG(now) {
      dom.layerBeams.innerHTML = '';
      dom.layerArcs.innerHTML = '';
      dom.layerFootprints.innerHTML = '';
      dom.layerFlag.innerHTML = '';
      dom.layerRunners.innerHTML = '';
      dom.layerPopups.innerHTML = '';

      const { lanes, rulerY } = getLaneLayout();
      const runnerScale = lanes.length >= 4 ? 0.62 : lanes.length === 3 ? 0.76 : lanes.length === 2 ? 0.9 : 1.05;
      const arcMaxH = Math.min(62, lanes[0].laneH * 0.48);

      // 1. Feixes verticais de Múltiplos Comuns (MC) e MMC (Fase 2 e Fase 5 com 2+ saltadores)
      if (isMultiRunnerMMCPhase() && state.commonMultiples.length > 0) {
        state.commonMultiples.forEach((mc) => {
          const x = numToX(mc);
          const isMMC = mc === state.mmcValue;
          const beamW = isMMC ? 36 : 26;

          dom.layerBeams.appendChild(svgEl('rect', {
            x: x - beamW / 2, y: 26, width: beamW, height: rulerY - 26,
            rx: 8,
            fill: isMMC ? 'url(#mmcBeamGrad)' : 'url(#goldBeamGrad)',
            stroke: isMMC ? '#d97706' : '#f59e0b',
            'stroke-width': isMMC ? 2 : 1.2,
            filter: isMMC ? 'url(#goldGlow)' : ''
          }));

          // Selo no topo do feixe
          const badgeW = isMMC ? 84 : 42;
          dom.layerBeams.appendChild(svgEl('rect', {
            x: x - badgeW / 2, y: 5, width: badgeW, height: 22, rx: 11,
            fill: isMMC ? '#d97706' : '#f59e0b',
            stroke: '#fff', 'stroke-width': 1.6,
            filter: 'url(#softGlow)'
          }));
          dom.layerBeams.appendChild(svgEl('text', {
            x, y: 19.5, 'text-anchor': 'middle', fill: '#fff',
            'font-size': isMMC ? '11' : '10.5', 'font-weight': '900'
          }, isMMC ? `★ MMC = ${mc}` : `MC ${mc}`));
        });
      }

      // 2. Bandeira de Chegada (Fases 3 e 4)
      const target = getCurrentTarget();
      if (target !== null) {
        const fx = numToX(target);
        // Faixa vertical destacada do alvo
        dom.layerFlag.appendChild(svgEl('rect', {
          x: fx - 14, y: 28, width: 28, height: rulerY - 28,
          fill: 'rgba(245, 158, 11, 0.14)',
          stroke: '#f59e0b', 'stroke-width': 1.6, 'stroke-dasharray': '5 4'
        }));

        // Mastro e bandeira quadriculada no topo
        dom.layerFlag.appendChild(svgEl('line', {
          x1: fx, y1: 6, x2: fx, y2: rulerY,
          stroke: '#b45309', 'stroke-width': 2.5
        }));
        const flagG = svgEl('g', { transform: `translate(${fx}, 6)` });
        flagG.appendChild(svgEl('rect', { x: 0, y: 0, width: 32, height: 20, rx: 3, fill: '#fff', stroke: '#1e293b', 'stroke-width': 1.4 }));
        // Quadriculado
        for (let r = 0; r < 2; r++) {
          for (let c = 0; c < 4; c++) {
            if ((r + c) % 2 === 0) {
              flagG.appendChild(svgEl('rect', { x: c * 8, y: r * 10, width: 8, height: 10, fill: '#1e293b' }));
            }
          }
        }
        dom.layerFlag.appendChild(flagG);

        // Etiqueta do alvo na régua
        dom.layerFlag.appendChild(svgEl('rect', {
          x: fx - 17, y: rulerY + 6, width: 34, height: 24, rx: 7,
          fill: '#f59e0b', stroke: '#fff', 'stroke-width': 1.5
        }));
        dom.layerFlag.appendChild(svgEl('text', {
          x: fx, y: rulerY + 22, 'text-anchor': 'middle', fill: '#fff',
          'font-size': '13', 'font-weight': '900'
        }, String(target)));
      }

      // 3. Arcos, pegadas e bonecos de cada pista
      state.runners.forEach((r, i) => {
        const lane = lanes[i];
        if (!lane) return;
        const pal = getStepPalette(r.step);

        // Etiqueta fixa do saltador no início da pista (x = 18)
        dom.layerFootprints.appendChild(svgEl('rect', {
          x: 8, y: lane.groundY - 26, width: 38, height: 22, rx: 7,
          fill: pal.main, stroke: '#fff', 'stroke-width': 1.5
        }));
        dom.layerFootprints.appendChild(svgEl('text', {
          x: 27, y: lane.groundY - 11.5, 'text-anchor': 'middle', fill: '#fff',
          'font-size': '11.5', 'font-weight': '900'
        }, `${r.step}x`));

        // Arcos concluídos
        r.arcs.forEach((arc) => {
          const x1 = numToX(arc.from);
          const x2 = numToX(arc.to);
          const mx = (x1 + x2) / 2;
          const cy = lane.groundY - arcMaxH;
          dom.layerArcs.appendChild(svgEl('path', {
            d: `M ${x1} ${lane.groundY} Q ${mx} ${cy} ${x2} ${lane.groundY}`,
            fill: 'none',
            stroke: arc.miss ? '#e11d48' : pal.main,
            'stroke-width': arc.miss ? 3 : 2.6,
            'stroke-dasharray': arc.miss ? '6 5' : '5 4',
            opacity: arc.miss ? '0.9' : '0.78'
          }));
        });

        // Arco em andamento durante o pulo
        let drawX = numToX(r.pos);
        let drawY = lane.groundY;
        let jumping = false;
        let progress = 0;

        if (r.anim) {
          jumping = true;
          progress = Math.min(1, (now - r.anim.startTime) / r.anim.duration);
          const x1 = numToX(r.anim.from);
          const x2 = numToX(r.anim.to);
          drawX = x1 + (x2 - x1) * progress;
          const jumpHeight = Math.sin(progress * Math.PI) * (arcMaxH * 0.82);
          drawY = lane.groundY - jumpHeight;

          // Rastro parcial do arco
          const mx = (x1 + drawX) / 2;
          dom.layerArcs.appendChild(svgEl('path', {
            d: `M ${x1} ${lane.groundY} Q ${mx} ${lane.groundY - jumpHeight * 1.15} ${drawX} ${drawY}`,
            fill: 'none', stroke: pal.main, 'stroke-width': 3, opacity: '0.9'
          }));
        }

        // Pegadas brilhantes onde o saltador aterrissou
        r.landings.forEach((posNum) => {
          if (posNum === 0) return;
          const px = numToX(posNum);
          const isMC = isMultiRunnerMMCPhase() && state.commonMultiples.includes(posNum);
          const isExactTarget = target !== null && posNum === target;

          dom.layerFootprints.appendChild(svgEl('circle', {
            cx: px, cy: lane.groundY,
            r: isMC || isExactTarget ? 7.5 : 5.5,
            fill: isMC || isExactTarget ? '#f59e0b' : pal.main,
            stroke: '#fff', 'stroke-width': 2,
            filter: isMC || isExactTarget ? 'url(#goldGlow)' : ''
          }));
        });

        // Boneco com escudo
        const runnerEl = createRunnerSVG(r, drawX, drawY, runnerScale, progress, jumping);
        dom.layerRunners.appendChild(runnerEl);
      });

      // 4. Popups flutuantes (ex: "3 × 4 = 12", "Passou direto!")
      state.popups = state.popups.filter((p) => now - p.bornAt < p.duration);
      state.popups.forEach((p) => {
        const t = (now - p.bornAt) / p.duration;
        const yOff = -t * 22;
        const op = t < 0.7 ? 1 : (1 - t) / 0.3;
        const g = svgEl('g', { transform: `translate(${p.x}, ${p.y + yOff})`, opacity: op.toFixed(2) });
        const w = Math.max(54, p.text.length * 7.2 + 14);
        g.appendChild(svgEl('rect', {
          x: -w / 2, y: -13, width: w, height: 22, rx: 11,
          fill: p.color, stroke: '#fff', 'stroke-width': 1.5, filter: 'url(#softGlow)'
        }));
        g.appendChild(svgEl('text', {
          x: 0, y: 2, 'text-anchor': 'middle', fill: '#fff',
          'font-size': '11', 'font-weight': '900'
        }, p.text));
        dom.layerPopups.appendChild(g);
      });
    }

    function spawnPopup(worldX, worldY, text, color) {
      state.popups.push({
        x: worldX, y: worldY, text, color,
        bornAt: performance.now(),
        duration: state.speed === 'fast' ? 900 : 1450
      });
    }

    /* =========================================================================
       LÓGICA DE SALTOS CONTÍNUOS E AVALIAÇÃO POR FASE
       ========================================================================= */
    function canRunnerJumpMore(r) {
      if (r.status === 'hit' || r.status === 'miss') return false;
      const target = getCurrentTarget();
      if (target !== null && state.phase !== '5') {
        return r.pos < target && r.pos + r.step <= state.maxNum + r.step;
      }
      if (state.phase === '5' && target !== null && state.runners.length === 1) {
        return r.pos < target && r.pos + r.step <= state.maxNum + r.step;
      }
      return r.pos + r.step <= state.maxNum;
    }

    function triggerNextJumpWave(now) {
      const { jumpMs } = getSpeedDuration();
      const eligible = state.runners.filter((r) => !r.anim && canRunnerJumpMore(r));
      if (eligible.length === 0) {
        stopAnimationLoop();
        if (state.phase === '4' && state.p4AutoTesting) {
          finalizePrimeAutoTest();
        }
        return false;
      }

      // Nas fases de MMC (Fase 2 e Fase 5 com 2+ saltadores), avança o(s) saltador(es) mais atrás para sincronizar os encontros!
      let toJump = eligible;
      if (isMultiRunnerMMCPhase()) {
        const minPos = Math.min(...eligible.map((r) => r.pos));
        toJump = eligible.filter((r) => r.pos === minPos);
      }

      toJump.forEach((r) => {
        const nextPos = r.pos + r.step;
        r.anim = {
          from: r.pos,
          to: nextPos,
          startTime: now,
          duration: jumpMs
        };
      });

      // Dispara UM único som limpo por onda de salto (latência zero)
      if (toJump.length > 0) {
        SoundFX.playJump(toJump[0].step);
      }

      return true;
    }

    // Retorna o tipo de evento sonoro para coalescência no tick()
    function onRunnerLanded(r, laneIdx, now) {
      const from = r.anim.from;
      const to = r.anim.to;
      r.anim = null;
      r.pos = to;
      r.jumpCount += 1;

      const { lanes } = getLaneLayout();
      const lane = lanes[laneIdx] || lanes[0];
      const pal = getStepPalette(r.step);
      const target = getCurrentTarget();

      const checkTargetStop = target !== null && (state.phase === '3' || state.phase === '4' || (state.phase === '5' && state.runners.length === 1));
      const overshot = checkTargetStop && to > target;
      r.arcs.push({ from, to: Math.min(to, state.maxNum), miss: overshot });
      if (to <= state.maxNum) {
        r.landings.push(to);
      }

      let soundEvent = { type: 'land', step: r.step };

      if (state.phase === '1') {
        spawnPopup(numToX(to), lane.groundY - 56, `${r.jumpCount} × ${r.step} = ${to}`, pal.main);
        dom.ctxFeedback.textContent = `Salto ${r.jumpCount}: ${r.jumpCount} × ${r.step} = ${to} (Múltiplo de ${r.step})`;
        if (r.jumpCount >= 5 && !state.challengeCompleted) {
          markChallengeCompleted();
        }
        markPanelUpdated();
      } else if (state.phase === '2') {
        soundEvent = checkCommonMultiples(to) || soundEvent;
      } else if (state.phase === '3') {
        soundEvent = evaluatePhase3Landing(r, lane, to, target, overshot) || soundEvent;
      } else if (state.phase === '4') {
        soundEvent = evaluatePhase4Landing(r, lane, to, target, overshot) || soundEvent;
      } else if (state.phase === '5') {
        if (state.runners.length >= 2) {
          const mcEv = checkCommonMultiples(to);
          if (mcEv) soundEvent = mcEv;
        } else {
          spawnPopup(numToX(to), lane.groundY - 56, `${r.jumpCount} × ${r.step} = ${to}`, pal.main);
        }
        if (target !== null) {
          if (to === target) {
            spawnPopup(numToX(to), lane.groundY - 62, `🎯 ${r.jumpCount} × ${r.step} = ${target}!`, '#059669');
            setContextTone('is-comp');
            dom.ctxFeedback.textContent = `🎯 Saltador ${r.step}x acertou exatamente a bandeira ${target} (${r.jumpCount} saltos)!`;
            if (state.runners.length === 1) {
              r.status = 'hit';
              stopAnimationLoop();
              showBanner('🎯', `<strong>Chegada Exata!</strong> O saltador <strong>${r.step}x</strong> acertou a bandeira <strong>${target}</strong> em ${r.jumpCount} saltos!`, 'is-comp', false);
            }
            soundEvent = { type: 'mmc', step: r.step };
          } else if (overshot) {
            r.status = 'miss';
            stopAnimationLoop();
            setContextTone('is-miss');
            spawnPopup(numToX(target), lane.groundY - 60, `Passou direto! (caiu em ${to})`, '#e11d48');
            dom.ctxFeedback.textContent = `❌ ${r.step}x pulou por cima do ${target} e caiu no ${to}.`;
            soundEvent = { type: 'miss', step: r.step };
          }
        }
        markPanelUpdated();
      }

      renderPanel();
      return soundEvent;
    }

    function markChallengeCompleted() {
      state.challengeCompleted = true;
      syncChallengeNavUI();
    }

    function checkCommonMultiples(pos) {
      if (pos <= 0 || state.commonMultiples.includes(pos)) return null;
      const allLandedHere = state.runners.every((r) => r.landings.includes(pos));
      if (!allLandedHere) return null;

      state.commonMultiples.push(pos);
      state.commonMultiples.sort((a, b) => a - b);
      markPanelUpdated();

      if (state.mmcValue === null) {
        state.mmcValue = pos;
        const stepsTxt = state.runners.map((r) => `${r.step}x`).join(', ');
        setContextTone('is-gold');
        dom.ctxFeedback.textContent = `★ MMC encontrado! Primeiro encontro de ${stepsTxt} = ${pos}!`;
        if (state.phase === '2') markChallengeCompleted();
        showBanner('⭐', `<strong>MMC(${state.runners.map((r) => r.step).join(', ')}) = ${pos}!</strong> Todos os saltadores se encontraram na casa ${pos}!`, '', state.phase === '2');
        return { type: 'mmc', step: pos };
      } else {
        dom.ctxFeedback.textContent = `Novo Múltiplo Comum: ${pos}! (Encontrados: ${state.commonMultiples.join(', ')})`;
        return { type: 'mc', step: pos };
      }
    }

    function evaluatePhase3Landing(r, lane, to, target, overshot) {
      const mission = state.p3CustomTarget === null ? MISSIONS[state.p3MissionIdx] : null;
      if (to === target) {
        r.status = 'hit';
        stopAnimationLoop();
        spawnPopup(numToX(to), lane.groundY - 62, `🎯 ${r.jumpCount} × ${r.step} = ${target}!`, '#059669');

        if (!state.p3FoundDivisors[target]) state.p3FoundDivisors[target] = new Set();
        state.p3FoundDivisors[target].add(r.step);
        markPanelUpdated();

        if (mission && mission.mode === '3B') {
          const expected = getProperDivisors(target, 12);
          const foundCount = expected.filter((d) => state.p3FoundDivisors[target].has(d)).length;
          setContextTone('is-comp');
          if (foundCount >= expected.length) {
            state.p3CompletedMissions.add(mission.id);
            markChallengeCompleted();
            dom.ctxFeedback.textContent = `🏆 Missão completa! Todos os ${expected.length} saltadores de ${target} descobertos!`;
            showBanner('🏆', `<strong>Missão Completa!</strong> Você encontrou todos os saltadores (divisores) de ${target}: <strong>${expected.map((d) => d + 'x').join(', ')}</strong>!`, 'is-comp', true);
          } else {
            dom.ctxFeedback.textContent = `🎯 Acertou! ${r.step}x cai exato em ${target} (${foundCount}/${expected.length} descobertos).`;
            showBanner('🎯', `<strong>Acertou!</strong> ${r.step}x chegou em ${target} com ${r.jumpCount} saltos! Faltam <strong>${expected.length - foundCount}</strong> saltador(es).`, 'is-comp', false);
          }
        } else {
          if (mission) state.p3CompletedMissions.add(mission.id);
          markChallengeCompleted();
          setContextTone('is-comp');
          dom.ctxFeedback.textContent = `🎯 Chegada exata! ${r.step}x fez ${r.jumpCount} saltos e cravou no ${target}!`;
          showBanner('🎯', `<strong>Chegada Exata!</strong> O saltador <strong>${r.step}x</strong> deu ${r.jumpCount} saltos e aterrissou na bandeira <strong>${target}</strong>!`, 'is-comp', true);
        }
        return { type: 'mmc', step: r.step };
      } else if (overshot) {
        r.status = 'miss';
        stopAnimationLoop();
        setContextTone('is-miss');
        spawnPopup(numToX(target), lane.groundY - 60, `Passou direto! (caiu em ${to})`, '#e11d48');
        dom.ctxFeedback.textContent = `❌ ${r.step}x pulou por cima do ${target} e caiu no ${to}. Tente outro saltador!`;
        showBanner('💨', `<strong>Pulou por cima!</strong> O saltador ${r.step}x foi para ${to} sem pisar em ${target}. Escolha outro escudo!`, 'is-miss', false);
        return { type: 'miss', step: r.step };
      } else {
        spawnPopup(numToX(to), lane.groundY - 54, `${r.jumpCount} × ${r.step} = ${to}`, getStepPalette(r.step).main);
        return { type: 'land', step: r.step };
      }
    }

    function evaluatePhase4Landing(r, lane, to, target, overshot) {
      if (to === target) {
        r.status = 'hit';
        state.p4TestedSteps.add(r.step);
        state.p4HitSteps.add(r.step);
        spawnPopup(numToX(to), lane.groundY - 56, `✓ ${r.jumpCount}×${r.step}=${target}`, '#059669');

        if (r.step > 1 && r.step < target) {
          state.p4Verdict = 'composite';
          state.discovered100[target] = 'composite';
          stopAnimationLoop();
          markChallengeCompleted();
          setContextTone('is-comp');
          dom.ctxFeedback.textContent = `🧩 ${target} é COMPOSTO! O saltador ${r.step}x acertou com ${r.jumpCount} saltos!`;
          showBanner('🧩', `<strong>${target} é COMPOSTO!</strong> Um único saltador <strong>${r.step}x</strong> chegou exato em ${target} (${r.jumpCount} saltos)!`, 'is-comp', true);
          markPanelUpdated();
          return { type: 'mmc', step: r.step };
        }
        return { type: 'mc', step: r.step };
      } else if (overshot) {
        r.status = 'miss';
        state.p4TestedSteps.add(r.step);
        state.p4MissSteps.add(r.step);
        spawnPopup(numToX(target), lane.groundY - 54, `Pulou ${target}!`, '#e11d48');

        if (!state.p4AutoTesting) {
          stopAnimationLoop();
          const provedPrime = checkIfPrimeProven(target);
          return { type: provedPrime ? 'prime' : 'miss', step: r.step };
        } else {
          const anyActive = state.runners.some((rr) => rr.status === 'idle');
          if (!anyActive) {
            stopAnimationLoop();
            finalizePrimeAutoTest();
            return { type: state.p4Verdict === 'prime' ? 'prime' : 'mmc', step: r.step };
          }
          return { type: 'miss', step: r.step };
        }
      }
      return { type: 'land', step: r.step };
    }

    function checkIfPrimeProven(target) {
      const needed = getPrimeTestCandidates(target);
      const allMissed = needed.every((p) => state.p4MissSteps.has(p));
      if (allMissed && state.p4HitSteps.size === 0 && isPrimeNumber(target)) {
        state.p4Verdict = 'prime';
        state.discovered100[target] = 'prime';
        markChallengeCompleted();
        setContextTone('is-prime');
        dom.ctxFeedback.textContent = `💎 ${target} é PRIMO! Nenhum saltador de 2x a ${target - 1}x cai em ${target}!`;
        showBanner('💎', `<strong>${target} é PRIMO!</strong> Todos os saltadores menores pularam por cima — só o <strong>1x</strong> (${target} saltos) ou combinando saltadores chega lá!`, 'is-prime', true);
        markPanelUpdated();
        return true;
      } else {
        setContextTone('is-miss');
        dom.ctxFeedback.textContent = `💨 ${state.p4SelectedStep}x pulou por cima de ${target}. Teste outro saltador ou clique em "Testar Saltadores"!`;
        return false;
      }
    }

    function finalizePrimeAutoTest() {
      const target = state.p4Target;
      markChallengeCompleted();
      if (state.p4HitSteps.size > 0) {
        const hitStep = Array.from(state.p4HitSteps)[0];
        state.p4Verdict = 'composite';
        state.discovered100[target] = 'composite';
        setContextTone('is-comp');
        dom.ctxFeedback.textContent = `🧩 ${target} é COMPOSTO! ${hitStep}x acertou em cheio (${target / hitStep} saltos)!`;
        showBanner('🧩', `<strong>${target} é COMPOSTO!</strong> O saltador <strong>${hitStep}x</strong> deu ${target / hitStep} saltos e cravou na bandeira ${target}!`, 'is-comp', true);
      } else {
        state.p4Verdict = 'prime';
        state.discovered100[target] = 'prime';
        setContextTone('is-prime');
        dom.ctxFeedback.textContent = `💎 ${target} é PRIMO! Todos os saltadores candidatos pularam por cima!`;
        showBanner('💎', `<strong>${target} é PRIMO!</strong> Nenhum saltador único de 2x até ${target - 1}x acerta ${target} — apenas <strong>1x</strong> (${target} saltos) ou mais de 1 saltador!`, 'is-prime', true);
      }
      markPanelUpdated();
      renderPanel();
    }

    /* =========================================================================
       LOOP PRINCIPAL DE ANIMAÇÃO COM COALESCÊNCIA DE ÁUDIO POR FRAME
       ========================================================================= */
    function startAnimationLoop() {
      if (state.rafId) return;
      state.lastFrameTime = performance.now();
      state.rafId = requestAnimationFrame(tick);
    }

    function playCoalescedLandingAudio(events) {
      if (!events || events.length === 0) return;
      // Prioridade única por janela de frame: mmc > prime > mc > miss > land
      if (events.some((e) => e.type === 'mmc')) {
        SoundFX.playMMC();
      } else if (events.some((e) => e.type === 'prime')) {
        SoundFX.playPrime();
      } else if (events.some((e) => e.type === 'mc')) {
        SoundFX.playMC();
      } else if (events.some((e) => e.type === 'miss')) {
        SoundFX.playOvershoot();
      } else {
        SoundFX.playLand(events[0].step);
      }
    }

    function tick(now) {
      const { pauseMs } = getSpeedDuration();
      let anyAnimating = false;
      const landingAudioEvents = [];

      // Atualiza saltos em curso e coleta eventos sonoros para coalescer
      state.runners.forEach((r, i) => {
        if (!r.anim) return;
        const elapsed = now - r.anim.startTime;
        if (elapsed >= r.anim.duration) {
          const ev = onRunnerLanded(r, i, now);
          if (ev) landingAudioEvents.push(ev);
        } else {
          anyAnimating = true;
        }
      });

      if (landingAudioEvents.length > 0) {
        playCoalescedLandingAudio(landingAudioEvents);
      }

      // Se estiver no modo contínuo e ninguém estiver no ar, dispara próxima onda
      if (state.running && !anyAnimating && now >= state.nextAutoJumpAt) {
        const launched = triggerNextJumpWave(now);
        if (launched) {
          anyAnimating = true;
          state.nextAutoJumpAt = now + getSpeedDuration().jumpMs + pauseMs;
        }
      }

      // Auto-follow suave da câmera
      if (state.autoFollow && !state.isDragging) {
        const activeRunners = state.runners.filter((r) => r.status === 'idle' || r.anim);
        const list = activeRunners.length ? activeRunners : state.runners;
        if (list.length > 0) {
          let leadX = 0;
          list.forEach((r) => {
            let rx = numToX(r.pos);
            if (r.anim) {
              const p = Math.min(1, (now - r.anim.startTime) / r.anim.duration);
              rx = numToX(r.anim.from + (r.anim.to - r.anim.from) * p);
            }
            if (rx > leadX) leadX = rx;
          });
          const visibleW = state.viewW / state.zoom;
          const desired = clampCamera(leadX - visibleW * 0.65);
          state.targetCameraX = desired;
        }
      }

      // Interpolação suave da câmera
      const diff = state.targetCameraX - state.cameraX;
      if (Math.abs(diff) > 0.4) {
        state.cameraX += diff * 0.14;
        applyCameraTransform();
      }

      renderDynamicSVG(now);

      const hasPopups = state.popups.length > 0;
      const camMoving = Math.abs(state.targetCameraX - state.cameraX) > 0.4;
      if (state.running || anyAnimating || hasPopups || camMoving) {
        state.rafId = requestAnimationFrame(tick);
      } else {
        state.rafId = null;
      }
    }

    /* =========================================================================
       AÇÕES DOS BOTÕES INFERIORES
       ========================================================================= */
    function handlePlayPause() {
      if (state.running) {
        state.running = false;
        syncPlayButton();
        return;
      }
      // Se todos já terminaram, reinicia automaticamente antes de correr
      const canAny = state.runners.some((r) => canRunnerJumpMore(r));
      if (!canAny) {
        resetRunnersForCurrentPhase();
      }
      state.running = true;
      state.autoFollow = true;
      state.nextAutoJumpAt = performance.now();
      syncPlayButton();
      startAnimationLoop();
    }

    function handleStepOnce() {
      state.running = false;
      syncPlayButton();
      const anyInAir = state.runners.some((r) => r.anim !== null);
      if (anyInAir) return;
      const canAny = state.runners.some((r) => canRunnerJumpMore(r));
      if (!canAny) return;
      state.autoFollow = true;
      triggerNextJumpWave(performance.now());
      startAnimationLoop();
    }

    function handlePrimeAutoTest() {
      if (state.phase !== '4') return;
      stopAnimationLoop();
      hideBanner();
      const target = state.p4Target;
      const candidates = getPrimeTestCandidates(target);

      state.p4TestedSteps = new Set();
      state.p4HitSteps = new Set();
      state.p4MissSteps = new Set();
      state.p4Verdict = null;

      if (candidates.length === 0) {
        // Casos 2 e 3: não há primos <= sqrt(N)
        state.runners = [makeRunner('r0', 2)];
        buildStaticTrackAndRuler();
        finalizePrimeAutoTest();
        SoundFX.playPrime();
        renderDynamicSVG(performance.now());
        return;
      }

      state.runners = candidates.map((s, i) => makeRunner(`p${i}`, s));
      state.p4AutoTesting = true;
      state.running = true;
      state.autoFollow = true;
      state.cameraX = 0;
      state.targetCameraX = 0;
      if (target <= 30) {
        state.zoom = Math.max(0.55, Math.min(1.0, state.viewW / (numToX(target + 3) + 40)));
      } else {
        state.zoom = 0.85;
      }
      buildStaticTrackAndRuler();
      applyCameraTransform();
      syncPlayButton();
      dom.ctxFeedback.textContent = `⚡ Testando saltadores ${candidates.map((c) => c + 'x').join(', ')} até a bandeira ${target}...`;
      state.nextAutoJumpAt = performance.now();
      startAnimationLoop();
    }

    function handlePrimeGuess(guess) {
      if (state.phase !== '4') return;
      const target = state.p4Target;
      const actuallyPrime = isPrimeNumber(target);
      const correct = (guess === 'prime' && actuallyPrime) || (guess === 'composite' && !actuallyPrime);
      state.p4Guess = guess;
      state.discovered100[target] = actuallyPrime ? 'prime' : 'composite';
      markPanelUpdated();
      renderPanel();

      if (correct) {
        SoundFX.playPrime();
        markChallengeCompleted();
        setContextTone(actuallyPrime ? 'is-prime' : 'is-comp');
        const extra = actuallyPrime
          ? `Nenhum saltador de 2x até ${target - 1}x cai exato em ${target}!`
          : `Por exemplo, o saltador ${getProperDivisors(target, target - 1)[0]}x acerta ${target} exato!`;
        dom.ctxFeedback.textContent = `🎉 Acertou o palpite! ${target} é ${actuallyPrime ? 'PRIMO' : 'COMPOSTO'}!`;
        showBanner('🎉', `<strong>Mandou bem!</strong> ${target} é mesmo <strong>${actuallyPrime ? 'PRIMO' : 'COMPOSTO'}</strong>! ${extra}`, actuallyPrime ? 'is-prime' : 'is-comp', true);
      } else {
        SoundFX.playOvershoot();
        setContextTone('is-miss');
        dom.ctxFeedback.textContent = `Quase! Clique em "Testar Saltadores" para ver o que acontece na casa ${target}!`;
        showBanner('🤔', `<strong>Ops, quase!</strong> Clique em <strong>⚡ Testar Saltadores</strong> para comprovar na pista se ${target} é Primo ou Composto!`, 'is-miss', false);
      }
    }

    /* =========================================================================
       NAVEGAÇÃO ENTRE DESAFIOS (ANTERIOR / PRÓXIMO)
       ========================================================================= */
    function getChallengeProgress() {
      if (state.phase === '1') return { idx: state.p1ChallengeIdx, total: PHASE1_STEPS.length };
      if (state.phase === '2') return { idx: state.p2ChallengeIdx, total: PHASE2_PRESETS.length };
      if (state.phase === '3') return { idx: state.p3MissionIdx, total: MISSIONS.length };
      if (state.phase === '4') return { idx: state.p4ChallengeIdx, total: PRIME_PRESETS.length };
      return null;
    }

    function syncChallengeNavUI() {
      const prog = getChallengeProgress();
      if (!prog) {
        dom.challengeNav.style.display = 'none';
        return;
      }
      dom.challengeNav.style.display = 'inline-flex';
      dom.challengeCounter.textContent = `${prog.idx + 1}/${prog.total}`;
      dom.btnPrevChallenge.disabled = prog.idx <= 0;
      dom.btnNextChallenge.classList.toggle('is-highlight', state.challengeCompleted);
    }

    function goChallengeByDelta(delta) {
      if (state.phase === '1') {
        const next = (state.p1ChallengeIdx + delta + PHASE1_STEPS.length) % PHASE1_STEPS.length;
        state.p1ChallengeIdx = next;
        state.p1Step = PHASE1_STEPS[next];
        resetRunnersForCurrentPhase();
      } else if (state.phase === '2') {
        const next = (state.p2ChallengeIdx + delta + PHASE2_PRESETS.length) % PHASE2_PRESETS.length;
        state.p2ChallengeIdx = next;
        const p = PHASE2_PRESETS[next];
        state.p2Count = p.steps.length;
        p.steps.forEach((v, i) => { state.p2Steps[i] = v; });
        resetRunnersForCurrentPhase();
      } else if (state.phase === '3') {
        const next = (state.p3MissionIdx + delta + MISSIONS.length) % MISSIONS.length;
        state.p3CustomTarget = null;
        state.p3MissionIdx = next;
        resetRunnersForCurrentPhase();
      } else if (state.phase === '4') {
        const next = (state.p4ChallengeIdx + delta + PRIME_PRESETS.length) % PRIME_PRESETS.length;
        state.p4ChallengeIdx = next;
        selectPhase4Target(PRIME_PRESETS[next]);
      }
    }

    /* =========================================================================
       UI DA FAIXA DE CONTEXTO, BOTÕES E PAINEL LATERAL
       ========================================================================= */
    function setContextTone(cls = '') {
      dom.contextStrip.className = `context-strip ${cls}`.trim();
    }

    function showBanner(icon, html, toneClass = '', showNextBtn = false) {
      dom.stageBannerIcon.textContent = icon;
      dom.stageBannerText.innerHTML = html;
      dom.bannerNextBtn.style.display = (showNextBtn && state.phase !== '5') ? 'inline-flex' : 'none';
      dom.stageBanner.className = `stage-banner is-visible ${toneClass}`.trim();
    }

    function hideBanner() {
      dom.stageBanner.classList.remove('is-visible');
    }

    function syncPlayButton() {
      if (state.running) {
        dom.btnPlay.className = 'act-btn btn-pause';
        dom.playIcon.textContent = '⏸';
        dom.playLabel.textContent = 'Pausar';
      } else {
        dom.btnPlay.className = 'act-btn btn-play';
        dom.playIcon.textContent = '▶';
        dom.playLabel.textContent = 'Correr';
      }
    }

    function syncBottomButtons() {
      const isP4 = state.phase === '4';
      dom.btnTestAll.style.display = isP4 ? 'inline-flex' : 'none';
      dom.btnGuessPrime.style.display = isP4 ? 'inline-flex' : 'none';
      dom.btnGuessComp.style.display = isP4 ? 'inline-flex' : 'none';
      syncPlayButton();
      syncChallengeNavUI();
    }

    function renderContextBar() {
      setContextTone('');
      dom.ctxControls.innerHTML = '';

          btn.addEventListener('click', () => {
            state.p1Step = s;
            const foundIdx = PHASE1_STEPS.indexOf(s);

          });

        const btn3 = document.createElement('button');
        btn3.type = 'button';
        btn3.className = `mini-chip${state.p2Count === 3 ? ' active' : ''}`;
        btn3.textContent = '3 Saltadores';
        btn3.addEventListener('click', () => { state.p2Count = 3; resetRunnersForCurrentPhase(); });

        for (let i = 0; i < state.p2Count; i++) {
          const sel = document.createElement('select');

          for (let s = 2; s <= 10; s++) {

            opt.textContent = `${s}x`;
            if (state.p2Steps[i] === s) opt.selected = true;
            sel.appendChild(opt);
          }
          sel.addEventListener('change', () => {
            state.p2Steps[i] = Number(sel.value);
            resetRunnersForCurrentPhase();
          });

        }

        const presetSel = document.createElement('select');
        presetSel.className = 'ctx-select';
        presetSel.innerHTML = `<option value="">Desafios...</option>`;
        PHASE2_PRESETS.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = p.label;
          if (state.p2ChallengeIdx === idx) opt.selected = true;
          presetSel.appendChild(opt);
        });
        presetSel.addEventListener('change', () => {
          if (presetSel.value === '') return;
          state.p2ChallengeIdx = Number(presetSel.value);
          const p = PHASE2_PRESETS[state.p2ChallengeIdx];
          state.p2Count = p.steps.length;
          p.steps.forEach((v, idx) => { state.p2Steps[idx] = v; });
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(presetSel);

        // Botão discreto para abrir direto na Fase 5 Livre preenchida com os saltadores atuais
        const customBtn = document.createElement('button');
        customBtn.type = 'button';
        customBtn.className = 'mini-chip';
        customBtn.textContent = '⚙ Personalizar';
        customBtn.title = 'Abrir na Fase Livre com saltadores de 1x até 20x';
        customBtn.addEventListener('click', () => {
          state.p5Count = state.p2Count;
          state.p5Steps = [...state.p2Steps];
          state.p5UseTarget = false;
          switchPhase('5');
        });
        dom.ctxControls.appendChild(customBtn);

        dom.ctxFeedback.textContent = `Compare os saltos na vertical para encontrar os MCs e o MMC!`;
      }

      else if (state.phase === '3') {
        const mSel = document.createElement('select');
        mSel.className = 'ctx-select';
        MISSIONS.forEach((m, idx) => {
          const done = state.p3CompletedMissions.has(m.id) ? '✓ ' : '';
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = `${done}${m.title}`;
          if (state.p3CustomTarget === null && state.p3MissionIdx === idx) opt.selected = true;
          mSel.appendChild(opt);
        });
        mSel.addEventListener('change', () => {
          state.p3CustomTarget = null;
          state.p3MissionIdx = Number(mSel.value);
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(mSel);

        const lbl = document.createElement('span');
        lbl.className = 'ctx-label';
        lbl.textContent = 'Escudo:';
        dom.ctxControls.appendChild(lbl);

        const stepSel = document.createElement('select');
        stepSel.className = 'ctx-select';
        for (let s = 2; s <= 12; s++) {
          const opt = document.createElement('option');
          opt.value = String(s);
          opt.textContent = `${s}x`;
          if (state.p3SelectedStep === s) opt.selected = true;
          stepSel.appendChild(opt);
        }
        stepSel.addEventListener('change', () => {
          state.p3SelectedStep = Number(stepSel.value);
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(stepSel);

        // Alvo livre
        const customLbl = document.createElement('span');
        customLbl.className = 'ctx-label';
        customLbl.textContent = 'Alvo:';
        dom.ctxControls.appendChild(customLbl);

        const customIn = document.createElement('input');
        customIn.type = 'number';
        customIn.min = '4';
        customIn.max = '90';
        customIn.value = String(getCurrentTarget());
        customIn.className = 'ctx-num';
        customIn.addEventListener('change', () => {
          const val = Math.max(4, Math.min(90, Math.floor(Number(customIn.value) || 12)));
          state.p3CustomTarget = val;
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(customIn);

        const mission = state.p3CustomTarget === null ? MISSIONS[state.p3MissionIdx] : null;
        dom.ctxFeedback.textContent = mission ? mission.hint : `Tente acertar exatamente a bandeira em ${state.p3CustomTarget}!`;
      }

      else if (state.phase === '4') {
        const pSel = document.createElement('select');
        pSel.className = 'ctx-select';
        pSel.innerHTML = `<option value="">Desafios...</option>`;
        PRIME_PRESETS.forEach((num, idx) => {
          const opt = document.createElement('option');
          opt.value = String(num);
          opt.textContent = `Número ${num}`;
          if (state.p4Target === num) opt.selected = true;
          pSel.appendChild(opt);
        });
        pSel.addEventListener('change', () => {
          if (!pSel.value) return;
          const v = Number(pSel.value);
          const idx = PRIME_PRESETS.indexOf(v);
          if (idx >= 0) state.p4ChallengeIdx = idx;
          selectPhase4Target(v);
        });
        dom.ctxControls.appendChild(pSel);

        const numIn = document.createElement('input');
        numIn.type = 'number';
        numIn.min = '2';
        numIn.max = '100';
        numIn.value = String(state.p4Target);
        numIn.className = 'ctx-num';
        numIn.title = 'Digite qualquer número de 2 a 100';
        numIn.addEventListener('change', () => {
          const v = Math.max(2, Math.min(100, Math.floor(Number(numIn.value) || 13)));
          selectPhase4Target(v);
        });
        dom.ctxControls.appendChild(numIn);

        const lbl = document.createElement('span');
        lbl.className = 'ctx-label';
        lbl.textContent = 'Testar:';
        dom.ctxControls.appendChild(lbl);

        const stepSel = document.createElement('select');
        stepSel.className = 'ctx-select';
        for (let s = 2; s <= 10; s++) {
          const opt = document.createElement('option');
          opt.value = String(s);
          opt.textContent = `${s}x`;
          if (state.p4SelectedStep === s) opt.selected = true;
          stepSel.appendChild(opt);
        }
        stepSel.addEventListener('change', () => {
          state.p4SelectedStep = Number(stepSel.value);
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(stepSel);

        dom.ctxFeedback.textContent = `Número ${state.p4Target}: existe um único saltador (de 2x a ${state.p4Target - 1}x) que cai exato nele?`;
      }

      else if (state.phase === '5') {
        // 1, 2 ou 3 pistas livres
        const lblPistas = document.createElement('span');
        lblPistas.className = 'ctx-label';
        lblPistas.textContent = 'Pistas:';
        dom.ctxControls.appendChild(lblPistas);

        [1, 2, 3].forEach((n) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = `mini-chip${state.p5Count === n ? ' active' : ''}`;
          b.textContent = String(n);
          b.addEventListener('click', () => {
            state.p5Count = n;
            resetRunnersForCurrentPhase();
          });
          dom.ctxControls.appendChild(b);
        });

        // Steppers (− Nx +) de 1x até 20x para cada saltador
        for (let i = 0; i < state.p5Count; i++) {
          const wrap = document.createElement('div');
          wrap.className = 'step-spinner';
          const pal = getStepPalette(state.p5Steps[i]);
          wrap.style.borderColor = pal.main;

          const bMinus = document.createElement('button');
          bMinus.type = 'button';
          bMinus.textContent = '−';
          bMinus.title = `Diminuir saltador ${i + 1}`;
          bMinus.addEventListener('click', () => {
            state.p5Steps[i] = Math.max(1, state.p5Steps[i] - 1);
            resetRunnersForCurrentPhase();
          });

          const valSpan = document.createElement('span');
          valSpan.textContent = `${state.p5Steps[i]}x`;
          valSpan.style.color = pal.dark;

          const bPlus = document.createElement('button');
          bPlus.type = 'button';
          bPlus.textContent = '+';
          bPlus.title = `Aumentar saltador ${i + 1}`;
          bPlus.addEventListener('click', () => {
            state.p5Steps[i] = Math.min(20, state.p5Steps[i] + 1);
            resetRunnersForCurrentPhase();
          });

          wrap.appendChild(bMinus);
          wrap.appendChild(valSpan);
          wrap.appendChild(bPlus);
          dom.ctxControls.appendChild(wrap);
        }

        // Controle opcional de Alvo
        const targetBtn = document.createElement('button');
        targetBtn.type = 'button';
        targetBtn.className = `mini-chip${state.p5UseTarget ? ' active' : ''}`;
        targetBtn.textContent = state.p5UseTarget ? '🎯 Alvo:' : '🎯 Sem alvo';
        targetBtn.addEventListener('click', () => {
          state.p5UseTarget = !state.p5UseTarget;
          resetRunnersForCurrentPhase();
        });
        dom.ctxControls.appendChild(targetBtn);

        if (state.p5UseTarget) {
          const tIn = document.createElement('input');
          tIn.type = 'number';
          tIn.min = '2';
          tIn.max = '240';
          tIn.value = String(state.p5Target);
          tIn.className = 'ctx-num';
          tIn.addEventListener('change', () => {
            state.p5Target = Math.max(2, Math.min(240, Math.floor(Number(tIn.value) || 24)));
            resetRunnersForCurrentPhase();
          });
          dom.ctxControls.appendChild(tIn);
        }

        const activeSteps = state.p5Steps.slice(0, state.p5Count);
        if (activeSteps.length >= 2) {
          const expectedMMC = calcLCM(activeSteps);
          const extMsg = state.maxNum > 100 ? ` (pista estendida até ${state.maxNum}!)` : '';
          dom.ctxFeedback.textContent = expectedMMC <= state.maxNum
            ? `Modo Livre: aperte Correr para descobrir os MCs e o MMC de ${activeSteps.map((s) => s + 'x').join(', ')}!${extMsg}`
            : `Modo Livre: MMC(${activeSteps.join(', ')}) = ${expectedMMC} (além do limite de 240 da pista).`;
        } else {
          dom.ctxFeedback.textContent = `Modo Livre: explore os saltos de ${activeSteps[0]}x até ${state.maxNum}!`;
        }
      }
    }

    function selectPhase4Target(num) {
      state.p4Target = num;
      const idx = PRIME_PRESETS.indexOf(num);
      if (idx >= 0) state.p4ChallengeIdx = idx;
      state.p4TestedSteps = new Set();
      state.p4HitSteps = new Set();
      state.p4MissSteps = new Set();
      state.p4Verdict = null;
      state.p4Guess = null;
      resetRunnersForCurrentPhase();
    }

       PAINEL LATERAL / DRAWER (📊)

    function syncPanelUI() {
      dom.sidePanel.classList.toggle('is-open', state.panelOpen);
      dom.btnPanel.classList.toggle('active', state.panelOpen);

      if (!state.panelOpen) {

        dom.panelDot.classList.add('is-visible');

            <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7c3aed;vertical-align:middle"></span> Primo</span>
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#34d399;vertical-align:middle"></span> Composto</span>
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid #f59e0b;vertical-align:middle"></span> Alvo</span>
          </div>
        `;

        dom.panelBody.querySelectorAll('.cell-100[data-num]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const num = Number(btn.dataset.num);
            if (num >= 2) selectPhase4Target(num);
          });
        });
      }
    }

    /* =========================================================================
       EVENTOS DE INTERAÇÃO (PAN, ZOOM, SCRUBBER, ABAS, BOTÕES)
       ========================================================================= */
    function switchPhase(phase) {
      state.phase = phase;
      dom.phaseTabs.forEach((b) => b.classList.toggle('active', b.dataset.phase === phase));
      resetRunnersForCurrentPhase();
    }

    dom.phaseTabs.forEach((tab) => {
      tab.addEventListener('click', () => switchPhase(tab.dataset.phase));
    });

    dom.btnPlay.addEventListener('click', handlePlayPause);
    dom.btnStep.addEventListener('click', handleStepOnce);
    dom.btnReset.addEventListener('click', resetRunnersForCurrentPhase);
    dom.btnTestAll.addEventListener('click', handlePrimeAutoTest);
    dom.btnGuessPrime.addEventListener('click', () => handlePrimeGuess('prime'));
    dom.btnGuessComp.addEventListener('click', () => handlePrimeGuess('composite'));
    dom.btnPrevChallenge.addEventListener('click', () => goChallengeByDelta(-1));
    dom.btnNextChallenge.addEventListener('click', () => goChallengeByDelta(1));
    dom.bannerNextBtn.addEventListener('click', () => goChallengeByDelta(1));

    dom.speedBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        state.speed = btn.dataset.speed;
        dom.speedBtns.forEach((b) => b.classList.toggle('active', b === btn));
      });
    });

    dom.btnSound.addEventListener('click', () => {
      SoundFX.enabled = !SoundFX.enabled;
      dom.btnSound.classList.toggle('active', SoundFX.enabled);
      dom.soundIcon.textContent = SoundFX.enabled ? '🔊' : '🔇';
      if (SoundFX.enabled) SoundFX.playLand(4);
    });

    dom.btnPanel.addEventListener('click', () => {
      state.panelOpen = !state.panelOpen;
      syncPanelUI();
    });
    dom.btnClosePanel.addEventListener('click', () => {
      state.panelOpen = false;
      syncPanelUI();
    });
    dom.drawerBackdrop.addEventListener('click', () => {
      state.panelOpen = false;
      syncPanelUI();
    });
    dom.stageBannerClose.addEventListener('click', hideBanner);

    // Zoom e Pan
    dom.btnZoomIn.addEventListener('click', () => setZoom(state.zoom + 0.15));
    dom.btnZoomOut.addEventListener('click', () => setZoom(state.zoom - 0.15));
    dom.btnZoomFit.addEventListener('click', fitCameraToContext);

    dom.btnPanLeft.addEventListener('click', () => {
      state.autoFollow = false;
      state.targetCameraX = clampCamera(state.cameraX - (state.viewW / state.zoom) * 0.42);
      startAnimationLoop();
    });
    dom.btnPanRight.addEventListener('click', () => {
      state.autoFollow = false;
      state.targetCameraX = clampCamera(state.cameraX + (state.viewW / state.zoom) * 0.42);
      startAnimationLoop();
    });

    // Arraste com Mouse / Toque no palco SVG
    dom.svgViewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      state.isDragging = true;
      state.autoFollow = false;
      state.dragStartX = e.clientX;
      state.dragStartCamX = state.cameraX;
      dom.svgViewport.setPointerCapture(e.pointerId);
    });
    dom.svgViewport.addEventListener('pointermove', (e) => {
      if (!state.isDragging) return;
      const dx = (e.clientX - state.dragStartX) / state.zoom;
      state.cameraX = clampCamera(state.dragStartCamX - dx);
      state.targetCameraX = state.cameraX;
      applyCameraTransform();
    });
    const endDrag = () => { state.isDragging = false; };
    dom.svgViewport.addEventListener('pointerup', endDrag);
    dom.svgViewport.addEventListener('pointercancel', endDrag);

    // Roda do mouse: scroll horizontal ou zoom com Ctrl
    dom.svgViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        setZoom(state.zoom + (e.deltaY < 0 ? 0.1 : -0.1));
      } else {
        state.autoFollow = false;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        state.cameraX = clampCamera(state.cameraX + delta / state.zoom);
        state.targetCameraX = state.cameraX;
        applyCameraTransform();
      }
    }, { passive: false });

    // Scrubber interativo (0 a state.maxNum)
    function moveCameraByScrubber(clientX) {
      const rect = dom.scrubberTrack.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const visibleW = state.viewW / state.zoom;
      state.autoFollow = false;
      state.cameraX = clampCamera(ratio * getWorldW() - visibleW / 2);
      state.targetCameraX = state.cameraX;
      applyCameraTransform();
    }
    let scrubberDragging = false;
    dom.scrubberTrack.addEventListener('pointerdown', (e) => {
      scrubberDragging = true;
      dom.scrubberTrack.setPointerCapture(e.pointerId);
      moveCameraByScrubber(e.clientX);
    });
    dom.scrubberTrack.addEventListener('pointermove', (e) => {
      if (scrubberDragging) moveCameraByScrubber(e.clientX);
    });
    dom.scrubberTrack.addEventListener('pointerup', () => { scrubberDragging = false; });

    // Resize responsivo do palco SVG
    function handleResize() {
      const rect = dom.svgViewport.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        state.viewW = rect.width;
        state.viewH = rect.height;
        buildStaticTrackAndRuler();
        state.cameraX = clampCamera(state.cameraX);
        state.targetCameraX = state.cameraX;
        applyCameraTransform();
        renderDynamicSVG(performance.now());
      }
      syncPanelUI();
    }

    const resizeObserver = new ResizeObserver(handleResize);
    resizeObserver.observe(dom.svgViewport);
    window.addEventListener('resize', handleResize);

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      syncPanelUI();
      handleResize();
      switchPhase('1');
    });
  </script>
