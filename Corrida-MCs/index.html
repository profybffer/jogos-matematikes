<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Corrida dos MCs — Saltos, Múltiplos, MMC e Primos</title>
  <style>
    /* =========================================================================
       DESIGN TOKENS — PISTA ESPORTIVA ENSOLARADA & ENCAIXE 100dvh × 100vw
       ========================================================================= */
    :root {
      --bg-sky: #f2f7fc;
      --bg-paper: #ffffff;
      --bg-soft: #eef4fa;
      --ink: #1e293b;
      --ink-muted: #5b6b82;
      --border: #d5e1ee;

      --track-grass: #e8f5e9;
      --track-lane: #fffdf8;
      --track-line: #cbd5e1;

      --gold: #f59e0b;
      --gold-dark: #b45309;
      --gold-bg: #fef3c7;

      --prime: #7c3aed;
      --prime-bg: #f3e8ff;
      --comp: #059669;
      --comp-bg: #d1fae5;
      --miss: #e11d48;
      --miss-bg: #ffe4e6;

      --radius-md: 11px;
      --radius-sm: 7px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #e7f2fc 0%, #f5f9fd 100%);
      color: var(--ink);
      line-height: 1.25;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Fallback seguro para telas extremamente baixas (< 400px) */
    @media (max-height: 399px) {
      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }
      .app-shell {
        height: auto !important;
        min-height: 410px;
      }
    }

    .app-shell {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 5px 7px;
      gap: 5px;
      overflow: hidden;
    }

    /* =========================================================================
       1. BARRA SUPERIOR COMPACTA (~44px)
       ========================================================================= */
    .top-bar {
      height: 44px;
      min-height: 40px;
      max-height: 46px;
      flex-shrink: 0;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .top-bar::-webkit-scrollbar { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 900;
      font-size: clamp(0.78rem, 1.3vw, 0.92rem);
      color: #1d4ed8;
      white-space: nowrap;
      flex-shrink: 0;
      padding-right: 6px;
      border-right: 1.5px solid var(--border);
    }
    @media (max-width: 560px) {
      .brand-text { display: none; }
      .brand { border-right: none; padding-right: 2px; }
    }

    .phase-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .phase-tab {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(0.68rem, 1.15vw, 0.79rem);
      padding: 5px clamp(6px, 0.95vw, 11px);
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }
    .phase-tab:hover {
      background: #fff;
      border-color: #93c5fd;
    }
    .phase-tab.active {
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      border-color: #2563eb;
      color: #1e40af;
      box-shadow: 0 1px 4px rgba(37, 99, 235, 0.2);
    }

    .top-utils {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .icon-btn {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(0.69rem, 1.1vw, 0.78rem);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      position: relative;
      transition: all 0.14s ease;
    }
    .icon-btn:hover { background: #fff; border-color: #93c5fd; }
    .icon-btn.active {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      border: 1.5px solid #fff;
      display: none;
    }
    .badge-dot.is-visible { display: block; }

    /* =========================================================================
       2. FAIXA DE MISSÃO / CONTEXTO COMPACTA (~38px)
       ========================================================================= */
    .context-strip {
      min-height: 38px;
      max-height: 44px;
      flex-shrink: 0;
      background: linear-gradient(90deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid var(--border);
      border-left: 4px solid #2563eb;
      border-radius: 9px;
      padding: 3px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .context-strip::-webkit-scrollbar { display: none; }
    .context-strip.is-gold   { border-left-color: var(--gold); background: linear-gradient(90deg, #fffbeb 0%, #fef3c7 100%); }
    .context-strip.is-prime  { border-left-color: var(--prime); background: linear-gradient(90deg, #faf5ff 0%, #f3e8ff 100%); }
    .context-strip.is-comp   { border-left-color: var(--comp); background: linear-gradient(90deg, #ecfdf5 0%, #d1fae5 100%); }
    .context-strip.is-miss   { border-left-color: var(--miss); background: linear-gradient(90deg, #fff1f2 0%, #ffe4e6 100%); }

    .ctx-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .ctx-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .ctx-select, .ctx-num {
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.76rem;
      padding: 3px 6px;
      cursor: pointer;
    }
    .ctx-num {
      width: 54px;
      text-align: center;
      cursor: text;
    }
    .ctx-select:focus, .ctx-num:focus {
      outline: none;
      border-color: #2563eb;
    }

    .mini-chip {
      appearance: none;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 900;
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .mini-chip:hover { border-color: #2563eb; }
    .mini-chip.active {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #fff;
    }

    .ctx-feedback {
      font-size: clamp(0.72rem, 1.25vw, 0.84rem);
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: auto;
    }

    /* =========================================================================
       3. ÁREA PRINCIPAL: PALCO SVG + DRAWER / PAINEL LATERAL
       ========================================================================= */
    .main-stage {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .track-pane {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      background: linear-gradient(180deg, #dff0ff 0%, #f1f8ff 34%, #eef7ef 100%);
      border: 1.5px solid #c9dced;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .svg-viewport {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    .svg-viewport:active { cursor: grabbing; }

    #track-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controles flutuantes de Câmera e Zoom */
    .cam-overlay-top {
      position: absolute;
      top: 7px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 3px 5px;
      box-shadow: var(--shadow-sm);
      z-index: 8;
    }

    .cam-btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--ink);
      font-family: inherit;
      font-weight: 900;
      font-size: 0.72rem;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }
    .cam-btn:hover { background: #eff6ff; border-color: #2563eb; color: #1d4ed8; }
    .cam-zoom-label {
      font-size: 0.7rem;
      font-weight: 900;
      color: var(--ink-muted);
      min-width: 36px;
      text-align: center;
    }

    .pan-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 44px;
      border-radius: 9px;
      border: 1.5px solid rgba(148, 163, 184, 0.7);
      background: rgba(255, 255, 255, 0.85);
      color: #1e293b;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      z-index: 7;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.14s ease;
    }
    .pan-arrow:hover { background: #fff; border-color: #2563eb; color: #2563eb; }
    .pan-arrow.left { left: 7px; }
    .pan-arrow.right { right: 7px; }

    /* Mini-barra de navegação (scrubber) na base da pista */
    .scrubber-bar {
      height: 24px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.9);
      border-top: 1px solid #d5e1ee;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--ink-muted);
    }

    .scrubber-track {
      flex: 1;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .scrubber-thumb {
      position: absolute;
      top: 1px;
      bottom: 1px;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      border-radius: 999px;
      min-width: 18px;
      pointer-events: none;
    }

    .scrubber-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 2px;
      pointer-events: none;
    }

    /* Toast de conquista / descoberta na pista */
    .stage-banner {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 7px 14px;
      box-shadow: var(--shadow-md);
      display: none;
      align-items: center;
      gap: 9px;
      max-width: 92%;
      z-index: 12;
      animation: popUp 0.22s ease-out;
    }
    .stage-banner.is-visible { display: flex; }
    .stage-banner.is-prime { border-color: var(--prime); background: #faf5ff; }
    .stage-banner.is-comp  { border-color: var(--comp); background: #ecfdf5; }
    .stage-banner.is-miss  { border-color: var(--miss); background: #fff1f2; }

    @keyframes popUp {
      from { opacity: 0; transform: translate(-50%, 8px) scale(0.96); }
      to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    .stage-banner-text {
      font-size: clamp(0.73rem, 1.25vw, 0.85rem);
      font-weight: 800;
      color: var(--ink);
    }

    .banner-next-btn {
      appearance: none;
      border: none;
      border-radius: 8px;
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.74rem;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.35);
      flex-shrink: 0;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .banner-next-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }

    .stage-banner-close {
      appearance: none;
      border: none;
      background: rgba(15, 23, 42, 0.1);
      color: var(--ink);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* =========================================================================
       PAINEL LATERAL / DRAWER RETRÁTIL (📊)
       ========================================================================= */
    .drawer-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      z-index: 20;
      border-radius: 12px;
    }
    .drawer-backdrop.is-open { display: block; }

    .side-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(350px, 90vw);
      background: var(--bg-paper);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: -6px 0 22px rgba(15, 23, 42, 0.16);
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 25;
      transform: translateX(106%);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .side-panel.is-open { transform: translateX(0); }

    @media (min-width: 1020px) {
      .drawer-backdrop { display: none !important; }
      .side-panel {
        position: static;
        width: clamp(295px, 28vw, 355px);
        flex-shrink: 0;
        transform: none !important;
        box-shadow: var(--shadow-sm);
        transition: none;
      }
      .side-panel:not(.is-open) { display: none; }
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      padding-bottom: 5px;
      border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
    }

    .close-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--ink);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-weight: 900;
      cursor: pointer;
    }

    .panel-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .info-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      padding: 7px 9px;
    }
    .info-card.gold  { background: #fffbeb; border-color: #fcd34d; }
    .info-card.prime { background: #faf5ff; border-color: #d8b4fe; }
    .info-card.comp  { background: #ecfdf5; border-color: #6ee7b7; }

    .info-card-title {
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pill-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .num-pill {
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      color: #fff;
      background: #3b82f6;
    }
    .num-pill.is-mc  { background: #f59e0b; color: #451a03; }
    .num-pill.is-mmc { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 2px 6px rgba(217,119,6,0.35); }

    /* Quadro Interativo de 1 a 100 */
    .grid-100 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
    }
    .cell-100 {
      aspect-ratio: 1;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.12s ease;
    }
    .cell-100:hover:not(.is-one) { transform: scale(1.1); border-color: #2563eb; z-index: 2; }
    .cell-100.is-one { background: #e2e8f0; color: #94a3b8; cursor: default; }
    .cell-100.is-prime { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; border-color: #5b21b6; }
    .cell-100.is-comp  { background: #d1fae5; color: #065f46; border-color: #34d399; }
    .cell-100.is-target { box-shadow: 0 0 0 2px #f59e0b; transform: scale(1.08); z-index: 3; }

    /* =========================================================================
       4. BARRA INFERIOR DE CONTROLES COMPACTA (~52px)
       ========================================================================= */
    .action-bar {
      height: 52px;
      min-height: 46px;
      max-height: 56px;
      flex-shrink: 0;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 5px 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .action-bar::-webkit-scrollbar { display: none; }

    .act-btn {
      appearance: none;
      border: none;
      border-radius: 9px;
      height: 38px;
      padding: 0 clamp(9px, 1.3vw, 15px);
      font-family: inherit;
      font-size: clamp(0.72rem, 1.3vw, 0.85rem);
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      box-shadow: 0 2.5px 0 rgba(15, 23, 42, 0.2);
      transition: transform 0.1s ease, filter 0.14s ease, opacity 0.14s ease;
    }
    .act-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .act-btn:active:not(:disabled) { transform: translateY(1.5px); box-shadow: 0 1px 0 rgba(15, 23, 42, 0.2); }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .btn-play   { background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%); color: #fff; }
    .btn-pause  { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); color: #fff; }
    .btn-step   { background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); color: #fff; }
    .btn-prime  { background: linear-gradient(180deg, #8b5cf6 0%, #7c3aed 100%); color: #fff; }
    .btn-comp   { background: linear-gradient(180deg, #10b981 0%, #059669 100%); color: #fff; }
    .btn-auto   { background: linear-gradient(180deg, #ec4899 0%, #db2777 100%); color: #fff; }
    .btn-soft   {
      background: var(--bg-soft);
      color: var(--ink);
      border: 1.5px solid var(--border);
      box-shadow: 0 2px 0 rgba(15, 23, 42, 0.1);
    }

    /* Grupo de navegação de desafios (◀ 1/5 Próximo ▶) */
    .challenge-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-soft);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 2px 4px;
      height: 40px;
      flex-shrink: 0;
    }

    .nav-mini-btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 900;
      font-size: 0.78rem;
      width: 28px;
      height: 30px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }
    .nav-mini-btn:hover:not(:disabled) { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }
    .nav-mini-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .challenge-counter {
      font-size: 0.7rem;
      font-weight: 900;
      color: var(--ink-muted);
      padding: 0 4px;
      white-space: nowrap;
    }

    .btn-next-challenge {
      appearance: none;
      border: none;
      border-radius: 7px;
      height: 30px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 900;
      cursor: pointer;

</head>
<body>

  <script>
    /* =========================================================================
       CONSTANTES DE GEOMETRIA DO MUNDO, CORES DOS ESCUDOS E MISSÕES
       ========================================================================= */
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const UNIT_W = 54;       // Distância horizontal (px) entre números consecutivos no zoom 100%
    const LEFT_PAD = 72;     // Margem esquerda antes do 0
    const RIGHT_PAD = 96;    // Margem direita após o último número

    const PHASE1_STEPS = [2, 3, 4, 5, 6, 7, 8, 9, 10];

    const SHIELD_COLORS = {
      1:  { main: '#475569', dark: '#1e293b', light: '#cbd5e1' },
      2:  { main: '#2563eb', dark: '#1e3a8a', light: '#bfdbfe' },
      3:  { main: '#ea580c', dark: '#9a3412', light: '#fed7aa' },
      4:  { main: '#059669', dark: '#065f46', light: '#a7f3d0' },
      5:  { main: '#7c3aed', dark: '#4c1d95', light: '#ddd6fe' },
      6:  { main: '#db2777', dark: '#831843', light: '#fbcfe8' },
      7:  { main: '#0891b2', dark: '#164e63', light: '#a5f3fc' },
      8:  { main: '#d97706', dark: '#78350f', light: '#fde68a' },
      9:  { main: '#4f46e5', dark: '#312e81', light: '#c7d2fe' },
      10: { main: '#dc2626', dark: '#7f1d1d', light: '#fecaca' },
      11: { main: '#0d9488', dark: '#134e4a', light: '#99f6e4' },
      12: { main: '#9333ea', dark: '#581c87', light: '#e9d5ff' }
    };

    function getStepPalette(step) {
      if (SHIELD_COLORS[step]) return SHIELD_COLORS[step];
      const hue = (step * 47) % 360;
      return {
        main: `hsl(${hue}, 72%, 45%)`,
        dark: `hsl(${hue}, 78%, 28%)`,
        light: `hsl(${hue}, 85%, 86%)`
      };
    }

    const PHASE2_PRESETS = [
      { label: '2x e 3x', steps: [2, 3] },
      { label: '3x e 4x', steps: [3, 4] },
      { label: '4x e 6x', steps: [4, 6] },
      { label: '3x e 5x', steps: [3, 5] },
      { label: '2x, 3x e 4x', steps: [2, 3, 4] },
      { label: '2x, 4x e 6x', steps: [2, 4, 6] },
      { label: '3x, 4x e 6x', steps: [3, 4, 6] }
    ];

    const MISSIONS = [
      { id: 'm1', mode: '3A', target: 12, title: '3A • Chegue exato na casa 12', hint: 'Escolha um saltador (ex: 3x, 4x ou 6x) que pise bem na bandeira 12!' },
      { id: 'm2', mode: '3A', target: 18, title: '3A • Chegue exato na casa 18', hint: 'Qual saltador cai exatamente em 18 sem pular por cima?' },
      { id: 'm3', mode: '3A', target: 24, title: '3A • Chegue exato na casa 24', hint: 'Teste um saltador para aterrissar cravado no 24!' },
      { id: 'm4', mode: '3A', target: 30, title: '3A • Chegue exato na casa 30', hint: 'Dica: tente 5x, 6x ou 10x para chegar em 30!' },
      { id: 'm5', mode: '3A', target: 35, title: '3A • Chegue exato na casa 35', hint: 'Cuidado! 4x e 6x pulam por cima do 35. Quem acerta?' },
      { id: 'm6', mode: '3B', target: 12, title: '3B • Todos os saltadores (2x–12x) para 12', hint: 'Descubra todos os saltadores únicos (de 2x a 11x) que acertam 12!' },
      { id: 'm7', mode: '3B', target: 18, title: '3B • Todos os saltadores (2x–12x) para 18', hint: 'Encontre todos os divisores entre 2x e 12x que caem exato em 18!' },
      { id: 'm8', mode: '3B', target: 24, title: '3B • Todos os saltadores (2x–12x) para 24', hint: 'Quantos saltadores de 2x a 12x aterrissam na bandeira 24?' },
      { id: 'm9', mode: '3B', target: 36, title: '3B • Todos os saltadores (2x–12x) para 36', hint: 'Desafio mestre: ache todos os saltadores de 2x a 12x que acertam 36!' }
    ];

    const PRIME_PRESETS = [7, 12, 13, 15, 17, 21, 23, 29, 36, 47, 51, 97];

    /* =========================================================================
       SÍNTESE DE ÁUDIO DE LATÊNCIA ZERO + COALESCÊNCIA (WEB AUDIO API)
       ========================================================================= */
    const SoundFX = {
      ctx: null,
      enabled: true,
      unlocked: false,
      lastJumpMs: 0,
      lastLandMs: 0,

      ensure() {
        if (!this.enabled) return null;
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          try {
            this.ctx = new AC({ latencyHint: 'interactive' });
          } catch {
            this.ctx = new AC();
          }
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },

      unlock() {
        if (this.unlocked) return;
        const ctx = this.ensure();
        if (!ctx) return;
        try {
          const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
          this.unlocked = true;
        } catch {
          // Ignora caso o navegador ainda bloqueie
        }
      },

      // Som único e curto na decolagem (coalescido em janela de 30ms)
      playJump(step = 2) {
        const nowMs = performance.now();
        if (nowMs - this.lastJumpMs < 30) return;
        this.lastJumpMs = nowMs;

        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const baseFreq = 260 + (step % 12) * 28;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq * 0.9, t);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, t + 0.055);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.11, t + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      },

      // Pop/tap curto de aterrissagem normal (coalescido em 30ms)
      playLand(step = 2) {
        const nowMs = performance.now();
        if (nowMs - this.lastLandMs < 30) return;
        this.lastLandMs = nowMs;

        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const freq = 420 + (step % 10) * 35;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.68, t + 0.055);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      },

      // Acorde cristalino curto para Múltiplo Comum ou acerto exato
      playMC() {
        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const notes = [587.33, 880]; // D5 + A5
        notes.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = t + i * 0.032;
          osc.frequency.setValueAtTime(f, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.11, start + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.12);
        });
      },

      // Fanfarra imediata para MMC e conclusão de missão (zero setTimeout)
      playMMC() {
        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = t + i * 0.048;
          osc.frequency.setValueAtTime(f, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.11, start + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.12);
        });
      },

      playPrime() {
        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const start = t + i * 0.05;
          osc.frequency.setValueAtTime(f, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.12, start + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.13);
        });
      },

      playOvershoot() {
        const ctx = this.ensure();
        if (!ctx) return;
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.1);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.075, t + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.12);
      }
    };

    // Desbloqueia o AudioContext no primeiro gesto do usuário (latência zero)
    ['pointerdown', 'click', 'keydown'].forEach((evt) => {
      window.addEventListener(evt, () => SoundFX.unlock(), { once: true, passive: true });
    });

    /* =========================================================================
       ESTADO GLOBAL DA APLICAÇÃO
       ========================================================================= */
    const state = {
      phase: '1', // '1' | '2' | '3' | '4' | '5'
      speed: 'normal', // 'slow' | 'normal' | 'fast'
      running: false,
      panelOpen: window.innerWidth >= 1020,
      panelHasUpdate: false,
      maxNum: 100,
      challengeCompleted: false,

      // Configurações por fase
      p1ChallengeIdx: 1, // começa em 3x
      p1Step: 3,
      p2ChallengeIdx: 0,
      p2Count: 2,
      p2Steps: [2, 3, 4],
      p3MissionIdx: 0,
      p3CustomTarget: null,
      p3SelectedStep: 3,
      p3FoundDivisors: {}, // { target: Set<number> }
      p3CompletedMissions: new Set(),

      p4ChallengeIdx: 2, // começa em 13
      p4Target: 13,
      p4SelectedStep: 2,
      p4TestedSteps: new Set(),
      p4HitSteps: new Set(),
      p4MissSteps: new Set(),
      p4AutoTesting: false,
      p4Verdict: null, // null | 'prime' | 'composite'
      p4Guess: null,
      discovered100: {}, // { num: 'prime' | 'composite' }

      // Fase 5: Livre / MMC Personalizado
      p5Count: 2,
      p5Steps: [4, 6, 8],
      p5UseTarget: false,
      p5Target: 24,

      // Estado ativo dos saltadores na pista
      runners: [],
      commonMultiples: [],
      mmcValue: null,
      popups: [],

      // Câmera
      viewW: 800,
      viewH: 400,
      cameraX: 0,
      targetCameraX: 0,
      zoom: 1.0,
      autoFollow: true,
      isDragging: false,
      dragStartX: 0,
      dragStartCamX: 0,

      // Loop de animação
      rafId: null,
      lastFrameTime: 0,
      nextAutoJumpAt: 0
    };

    /* =========================================================================
       REFERÊNCIAS DE DOM
       ========================================================================= */
    const dom = {

    /* =========================================================================
       HELPERS MATEMÁTICOS E DE SVG
       ========================================================================= */
    function svgEl(tag, attrs = {}, text = null) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, String(v));
      }
      if (text !== null) el.textContent = text;
      return el;
    }

    function getWorldW() {
      return LEFT_PAD + state.maxNum * UNIT_W + RIGHT_PAD;
    }

    function numToX(n) {
      return LEFT_PAD + n * UNIT_W;
    }

    function gcd(a, b) {
      let x = Math.abs(a), y = Math.abs(b);
      while (y) { const t = y; y = x % y; x = t; }
      return x || 1;
    }

    function lcmTwo(a, b) {
      return Math.abs(a * b) / gcd(a, b);
    }

    function calcLCM(arr) {
      if (!arr || arr.length === 0) return 1;
      return arr.reduce((acc, v) => lcmTwo(acc, v), 1);
    }

    function isPrimeNumber(n) {
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) {
        if (n % i === 0) return false;
      }
      return true;
    }

    function getProperDivisors(n, maxStep = 12) {
      const res = [];
      for (let d = 2; d <= Math.min(n - 1, maxStep); d++) {
        if (n % d === 0) res.push(d);
      }
      return res;
    }

    function getPrimeTestCandidates(n) {
      // Testa 2, 3, 5, 7 (primos até sqrt(100)=10) que sejam < n
      const primes = [2, 3, 5, 7];
      return primes.filter((p) => p * p <= n);
    }

    function getCurrentTarget() {
      if (state.phase === '3') {
        if (state.p3CustomTarget !== null) return state.p3CustomTarget;
        return MISSIONS[state.p3MissionIdx].target;
      }
      if (state.phase === '4') return state.p4Target;
      if (state.phase === '5' && state.p5UseTarget) return state.p5Target;
      return null;
    }

    function computeDynamicMaxNum() {
      if (state.phase !== '5') return 100;
      const steps = state.p5Steps.slice(0, state.p5Count);
      let needed = 100;
      if (steps.length >= 2) {
        const expectedMMC = calcLCM(steps);
        if (expectedMMC > 100) {
          needed = Math.max(needed, expectedMMC + 20);
        }
      }
      if (state.p5UseTarget && state.p5Target > 90) {
        needed = Math.max(needed, state.p5Target + 20);
      }
      return Math.min(240, Math.max(100, needed));
    }

    function isMultiRunnerMMCPhase() {
      return state.phase === '2' || (state.phase === '5' && state.runners.length >= 2);
    }

    function getSpeedDuration() {
      if (state.speed === 'slow') return { jumpMs: 740, pauseMs: 360 };
      if (state.speed === 'fast') return { jumpMs: 220, pauseMs: 70 };
      return { jumpMs: 430, pauseMs: 170 };
    }

    /* =========================================================================
       GEOMETRIA VERTICAL DAS PISTAS (SE ADAPTA A 1, 2, 3 OU 4 PISTAS)
       ========================================================================= */
    function getLaneLayout() {
      const h = Math.max(200, state.viewH);
      const count = Math.max(1, state.runners.length);
      const topPad = 36;
      const rulerH = 38;
      const usableH = h - topPad - rulerH;
      const laneH = usableH / count;
      const lanes = [];
      for (let i = 0; i < count; i++) {
        const topY = topPad + i * laneH;
        const groundY = topY + laneH * 0.78;
        lanes.push({ topY, laneH, groundY });
      }
      return { lanes, rulerY: h - rulerH, h };
    }

    /* =========================================================================
       DESENHO DO BONECO CORREDOR COM ESCUDO EM SVG
       ========================================================================= */
    function createRunnerSVG(runner, cx, cy, scale, phaseProgress = 0, isJumping = false) {
      const pal = getStepPalette(runner.step);
      const g = svgEl('g');

      // Squash & stretch suave na decolagem/aterrissagem
      let sx = 1, sy = 1;
      if (isJumping) {
        if (phaseProgress < 0.15) {
          sx = 1.08; sy = 0.92;
        } else if (phaseProgress > 0.85) {
          sx = 1.1; sy = 0.9;
        } else {
          sx = 0.94; sy = 1.07;
        }
      }
      g.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) scale(${(scale * sx).toFixed(3)}, ${(scale * sy).toFixed(3)})`);

      // Sombra no chão (quando está parado)
      if (!isJumping) {
        g.appendChild(svgEl('ellipse', {
          cx: 0, cy: 2, rx: 16, ry: 4.5,
          fill: 'rgba(15, 23, 42, 0.18)'
        }));
      }

      // Capa esportiva dinâmica atrás do boneco
      const capeLift = isJumping ? -10 * Math.sin(phaseProgress * Math.PI) : 0;
      g.appendChild(svgEl('path', {
        d: `M -6 -32 Q -24 ${-28 + capeLift} -27 ${-14 + capeLift} Q -16 ${-10 + capeLift} -5 -16 Z`,
        fill: pal.dark,

      // Pernas que flexionam no pulo

        stroke: '#1e293b', 'stroke-width': 4.2, 'stroke-linecap': 'round', fill: 'none'
      }));
      g.appendChild(svgEl('path', {

      // Tênis
      g.appendChild(svgEl('ellipse', { cx: -8 - legBend * 0.5, cy: -1 - legBend * 0.4, rx: 5, ry: 2.7, fill: pal.main }));
      g.appendChild(svgEl('ellipse', { cx: 10 + legBend * 0.5, cy: -1 - legBend * 0.4, rx: 5, ry: 2.7, fill: pal.main }));

      // Tronco
      g.appendChild(svgEl('rect', {
        x: -11, y: -35, width: 22, height: 23, rx: 9,
        fill: pal.main, stroke: pal.dark, 'stroke-width': 1.5
      }));

      // Cabeça amigável
      g.appendChild(svgEl('circle', {
        cx: 1, cy: -46, r: 12.5,
        fill: '#fde68a', stroke: '#b45309', 'stroke-width': 1.3
      }));

      // Faixa esportiva na testa
      g.appendChild(svgEl('path', {
        d: 'M -11 -50 Q 1 -54 13 -50 L 12 -46 Q 1 -49 -10 -46 Z',
        fill: pal.main
      }));

      // Olhos expressivos e sorriso
      g.appendChild(svgEl('circle', { cx: -2.5, cy: -45, r: 1.9, fill: '#0f172a' }));
      g.appendChild(svgEl('circle', { cx: 5.5, cy: -45, r: 1.9, fill: '#0f172a' }));
      g.appendChild(svgEl('circle', { cx: -2, cy: -45.7, r: 0.65, fill: '#fff' }));
      g.appendChild(svgEl('circle', { cx: 6, cy: -45.7, r: 0.65, fill: '#fff' }));
      g.appendChild(svgEl('path', {
        d: isJumping ? 'M -2 -40 Q 2 -36.5 6 -40' : 'M -1.5 -40.5 Q 2 -38 5.5 -40.5',
        stroke: '#78350f', 'stroke-width': 1.6, 'stroke-linecap': 'round', fill: 'none'
      }));

      // ESCUDO HERÁLDICO BEM LEGÍVEL NA FRENTE (ex: "2x", "3x", "4x"...)
      const shieldG = svgEl('g', { transform: 'translate(2, -23)', filter: 'url(#softGlow)' });
      shieldG.appendChild(svgEl('path', {
        d: 'M -14 -12 L 14 -12 L 14 0 C 14 9 6 14 0 16 C -6 14 -14 9 -14 0 Z',
        fill: pal.main,
        stroke: '#ffffff',
        'stroke-width': 2.2
      }));
      shieldG.appendChild(svgEl('path', {
        d: 'M -11 -9 L 11 -9 L 11 -1 C 11 6 5 10.5 0 12.2 C -5 10.5 -11 6 -11 -1 Z',
        fill: 'none',
        stroke: pal.light,
        'stroke-width': 1,
        opacity: '0.65'
      }));

      const labelText = `${runner.step}x`;
      const fontSize = labelText.length >= 3 ? 10.5 : 12.5;
