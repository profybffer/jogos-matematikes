        const noteRow = `<span></span>` + displayOrders.map(o => {
          const note = state.m4.topNote[o];
          if (!note) return `<span class="calc-carry"></span>`;
          const isPlus = note.includes('+');
          return `<span class="calc-carry ${isPlus ? 'active' : 'borrow-tag'}">${note}</span>`;
        }).join('');

        // Linha 1 mostra workTop atualizado (ex: 0 0 7 13)
        const rowA = `<span></span>` + displayOrders.map(o => {
          const val = state.m4.workTop[o];
          const hasNote = Boolean(state.m4.topNote[o]);
          return `<span class="calc-digit ${hasNote ? 'updated' : ''}">${val}</span>`;
        }).join('');

        const rowB = `<span class="calc-op">−</span>` + displayOrders.map(o => `<span class="calc-digit">${db[o]}</span>`).join('');

        // Linha de resultado (exibe resultado parcial assim que cada ordem é retirada)
        const resRow = `<span></span>` + displayOrders.map(o => {
          if (solved) return `<span class="calc-res done">${state.rods[o]}</span>`;
          if (state.m4.partialRes[o] !== null) return `<span class="calc-res">${state.m4.partialRes[o]}</span>`;
          return `<span class="calc-res pending">?</span>`;
        }).join('');

        const logsHtml = state.m4.stepsLog.slice(-3).map(s => `<div class="calc-step-pill ${s.tone}">${s.text}</div>`).join('');

        const btnsHtml = [0, 1, 2, 3].filter(o => o < state.rodCount && db[o] > 0).map(o => {
          const ord = ORDERS[o];
          const done = state.m4.removedOrders[o];
          return `
            <button class="step-btn ${done ? 'done' : ''}" data-m4-rem="${o}" type="button"
                    style="--btn-color:${ord.color};--btn-soft:${ord.soft};"
                    ${done || state.isAnimating ? 'disabled' : ''}>
              ${done ? `✓ −${db[o]} ${ord.name}` : `Retirar −${db[o]} ${ord.name}`}
            </button>
          `;
        }).join('');

        sidePaneEl.innerHTML = `
          <h3 class="side-title">Conta Armada — Subtração</h3>
          <div class="calc-grid" style="grid-template-columns: 24px repeat(${state.rodCount}, 1fr);">
            ${heads}
            ${noteRow}
            ${rowA}
            ${rowB}
            <div class="calc-line"></div>
            ${resRow}
          </div>
          <div class="calc-steps-log">${logsHtml}</div>
          <div class="side-actions">${btnsHtml}</div>
          <p class="side-hint">Retire começando pela Unidade. Se faltar, desça 1 degrau (⬇ 1→10)!</p>
        `;

        sidePaneEl.querySelectorAll('[data-m4-rem]').forEach(btn => {
          btn.addEventListener('click', () => doMode4RemoveOrder(Number(btn.dataset.m4Rem)));
        });
        return;
      }

      // MODO 5: MULTIPLICAR
      if (state.mode === 5) {
        const logsHtml = state.m5.stepsLog.slice(-4).map(s => `<div class="calc-step-pill ${s.tone}">${s.text}</div>`).join('');

        if (state.m5.subMode === 'x10') {
          sidePaneEl.innerHTML = `
            <h3 class="side-title">Subir e Descer Degraus</h3>
            <div class="target-card">
              <span class="target-big-num">${getTotalValue()}</span>
              <span class="target-words">Base inicial: ${state.m5.baseX10}</span>
            </div>
            <div class="calc-steps-log">${logsHtml}</div>
            <div class="side-actions">
              <button id="m5Up10Btn" class="step-btn" type="button" style="--btn-color:#059669;--btn-soft:#ecfdf5;" ${state.isAnimating ? 'disabled' : ''}>⬆ Multiplicar por 10 (×10)</button>
              <button id="m5Down10Btn" class="step-btn" type="button" style="--btn-color:#d97706;--btn-soft:#fffbeb;" ${state.isAnimating ? 'disabled' : ''}>⬇ Dividir por 10 (÷10)</button>
            </div>
            <p class="side-hint">Observe: ×10 não "cola zero" — ele sobe todas as peças 1 degrau!</p>
          `;
          document.getElementById('m5Up10Btn').addEventListener('click', () => doMode5Shift(1));
          document.getElementById('m5Down10Btn').addEventListener('click', () => doMode5Shift(-1));
        } else if (state.m5.subMode === 'packs') {
          const done = isCurrentSolved();
          sidePaneEl.innerHTML = `
            <h3 class="side-title">Pacotes Repetidos</h3>
            <div class="target-card ${done ? 'done' : ''}">
              <span class="target-big-num">${state.m5.packFactor} × ${state.m5.packBase}</span>
              <span class="target-words">Pacotes colocados: ${state.m5.packsAdded} de ${state.m5.packFactor}</span>
            </div>
            <div class="calc-steps-log">${logsHtml}</div>
            <div class="side-actions">
              <button id="m5AddPackBtn" class="step-btn ${done ? 'done' : ''}" type="button" ${state.m5.packsAdded >= state.m5.packFactor || state.isAnimating ? 'disabled' : ''}>
                ${state.m5.packsAdded >= state.m5.packFactor ? '✓ Todos os pacotes no ábaco' : `📦 Colocar +1 pacote (${state.m5.packBase})`}
              </button>
            </div>
            <p class="side-hint">${hasAnyOverflow() ? 'Haste cheia! Toque em ⬆ 10→1 no ábaco.' : 'Cada pacote soma o mesmo número nas hastes.'}</p>
          `;
          document.getElementById('m5AddPackBtn').addEventListener('click', doMode5AddPack);
        } else {
          const done = isCurrentSolved();
          const parts = getDistParts();
          const f = state.m5.distFactor;
          const b = state.m5.distBase;
          const df = getDigitsOf(f);
          const db = getDigitsOf(b);

          const formulaText = state.m5.distType === 1
            ? `${f} × ${b} = ${parts.map(p => `(${p.label})`).join(' + ')}`
            : `[(${df[1] * 10}×${db[1] * 10}) + (${df[1] * 10}×${db[0]})] + [(${df[0]}×${db[1] * 10}) + (${df[0]}×${db[0]})]`;

          const btnsHtml = parts.map((p, idx) => {
            const ord = ORDERS[p.orderIdx];
            const isDone = Boolean(state.m5.distDone[idx]);
            return `
              <button class="step-btn ${isDone ? 'done' : ''}" data-m5-dist="${idx}" type="button"
                      style="--btn-color:${ord.color};--btn-soft:${ord.soft};"
                      ${isDone || state.isAnimating ? 'disabled' : ''}>
                ${isDone ? `✓ (${p.label}) = ${p.result}` : `Encaixar (${p.label}) na ${ord.name}`}
              </button>
            `;
          }).join('');

          sidePaneEl.innerHTML = `
            <h3 class="side-title">Distributiva por Ordens</h3>
            <div class="target-card ${done ? 'done' : ''}">
              <span class="target-big-num">${f} × ${b}</span>
              <div class="dist-formula">${formulaText}</div>
            </div>
            <div class="calc-steps-log">${logsHtml}</div>
            <div class="side-actions">${btnsHtml}</div>
            <p class="side-hint">${hasAnyOverflow() ? 'Haste passou de 9! Toque em ⬆ 10→1.' : 'Cada produto parcial cai em grupos na sua haste.'}</p>
          `;

          sidePaneEl.querySelectorAll('[data-m5-dist]').forEach(btn => {
            btn.addEventListener('click', () => doMode5DistPart(Number(btn.dataset.m5Dist)));
          });
        }
        return;
      }

      // MODO 6: PROVA DOS 9
      if (state.mode === 6) {
        const totalBeads = sumOfRodsBeads();
        const logsHtml = state.m6.stepsLog.slice(-4).map(s => `<div class="calc-step-pill ${s.tone}">${s.text}</div>`).join('');

        if (state.m6.subMode === 'secret') {
          const canCast = totalBeads >= 9;
          const d = getDigitsOf(state.m6.secretNum);
          const expr = [3, 2, 1, 0].filter(i => i < state.rodCount && d[i] > 0).map(i => d[i]).join(' + ') || '0';

          sidePaneEl.innerHTML = `
            <h3 class="side-title">O Segredo dos Noves Fora</h3>
            <div class="target-card ${!canCast ? 'done' : ''}">
              <span class="target-big-num">${state.m6.secretNum}</span>
              <span class="target-words">Soma das peças: (${expr}) = ${state.m6.initialDigitsSum}</span>
            </div>
            <div class="calc-steps-log">${logsHtml}</div>
            <div class="side-actions">
              <button id="m6CastBtn" class="step-btn" type="button" style="--btn-color:#7c3aed;--btn-soft:#f5f3ff;" ${!canCast || state.isAnimating ? 'disabled' : ''}>
                ${canCast ? `✨ Tirar 9 peças (restam ${totalBeads})` : `✓ Noves fora = ${totalBeads}!`}
              </button>
            </div>
            <p class="side-hint">Cada 10 é (9+1) e cada 100 é (99+1): por isso cada peça em qualquer haste sobra 1!</p>
          `;
          document.getElementById('m6CastBtn').addEventListener('click', doMode6CastOutNine);
        } else {
          const p = HUNT_PROBLEMS[state.m6.huntIdx % HUNT_PROBLEMS.length];
          const canCast = totalBeads >= 9;
          const leftReady = state.m6.huntLeftRem !== null;
          const rightReady = state.m6.huntRightRem !== null;

          sidePaneEl.innerHTML = `
            <h3 class="side-title">🕵️ Caça ao Erro (Prova dos 9)</h3>
            <div class="target-card ${state.m6.huntVerdict === 'correct' ? 'done' : ''}">
              <span class="target-big-num" style="font-size:1.75rem;">${p.a} ${p.op} ${p.b} = ${p.shown}</span>
              <span class="target-words">Carregue cada número no ábaco e tire os noves!</span>
            </div>
            <div class="side-actions">
              <button class="step-btn ${state.m6.huntARem !== null ? 'done' : ''}" id="hLoadA" type="button">1º: Carregar ${p.a} ${state.m6.huntARem !== null ? `(resto ${state.m6.huntARem})` : ''}</button>
              <button class="step-btn ${state.m6.huntBRem !== null ? 'done' : ''}" id="hLoadB" type="button">2º: Carregar ${p.b} ${state.m6.huntBRem !== null ? `(resto ${state.m6.huntBRem})` : ''}</button>
              <button class="step-btn ${state.m6.huntRightRem !== null ? 'done' : ''}" id="hLoadR" type="button">3º: Carregar resultado ${p.shown} ${state.m6.huntRightRem !== null ? `(resto ${state.m6.huntRightRem})` : ''}</button>
              <button class="step-btn" id="hCastBtn" type="button" style="--btn-color:#7c3aed;--btn-soft:#f5f3ff;" ${!canCast || state.isAnimating ? 'disabled' : ''}>
                ✨ Tirar 9 peças no ábaco (${totalBeads})
              </button>
            </div>
            <div class="nines-compare">
              <div class="nines-box ${leftReady ? 'ready' : ''}">
                <span class="nines-box-lbl">Conta</span>
                <span class="nines-box-val">${leftReady ? state.m6.huntLeftRem : '?'}</span>
              </div>
              <span style="font-weight:900;color:var(--text-muted);">vs</span>
              <div class="nines-box ${rightReady ? 'ready' : ''}">
                <span class="nines-box-lbl">Resultado</span>
                <span class="nines-box-val">${rightReady ? state.m6.huntRightRem : '?'}</span>
              </div>
            </div>
            <div class="nines-verdict-row">
              <button id="hVerdictOk" class="step-btn" type="button" style="--btn-color:#059669;--btn-soft:#ecfdf5;">✓ Bateu!</button>
              <button id="hVerdictErr" class="step-btn" type="button" style="--btn-color:#ef4444;--btn-soft:#fef2f2;">✕ Tem erro!</button>
            </div>
            ${state.m6.huntVerdict === 'correct' ? `<button id="hNextProb" class="step-btn done" type="button">Próxima Conta →</button>` : ''}
          `;

          document.getElementById('hLoadA').addEventListener('click', () => loadHuntNumber('a'));
          document.getElementById('hLoadB').addEventListener('click', () => loadHuntNumber('b'));
          document.getElementById('hLoadR').addEventListener('click', () => loadHuntNumber('res'));
          document.getElementById('hCastBtn').addEventListener('click', doMode6CastOutNine);
          document.getElementById('hVerdictOk').addEventListener('click', () => submitHuntVerdict(true));
          document.getElementById('hVerdictErr').addEventListener('click', () => submitHuntVerdict(false));
          const nxt = document.getElementById('hNextProb');
          if (nxt) {
            nxt.addEventListener('click', () => {
              state.m6.huntIdx = (state.m6.huntIdx + 1) % HUNT_PROBLEMS.length;
              initMode6('hunt');
            });
          }
        }
      }
    }

    /* =========================================================
       FAIXA RÁPIDA SUPERIOR E RODAPÉ
       ========================================================= */
    function renderQuickStripAndFooter() {
      // Faixa rápida contextual
      if (state.mode === 5) {
        quickStripEl.innerHTML = `
          <button class="pill-btn ${state.m5.subMode === 'x10' ? 'active' : ''}" data-m5-sub="x10" type="button">⬆ Subir Degrau (×10)</button>
          <button class="pill-btn ${state.m5.subMode === 'packs' ? 'active' : ''}" data-m5-sub="packs" type="button">📦 Pacotes</button>
          <button class="pill-btn ${state.m5.subMode === 'dist' ? 'active' : ''}" data-m5-sub="dist" type="button">⚡ Distribuir</button>
          ${state.m5.subMode === 'dist' ? `
            <button class="pill-btn ${state.m5.distType === 1 ? 'active' : ''}" data-m5-dt="1" type="button">1 algarismo</button>
            <button class="pill-btn ${state.m5.distType === 2 ? 'active' : ''}" data-m5-dt="2" type="button">2 algarismos</button>
          ` : ''}
        `;
        quickStripEl.querySelectorAll('[data-m5-sub]').forEach(btn => {
          btn.addEventListener('click', () => initMode5(btn.dataset.m5Sub));
        });
        quickStripEl.querySelectorAll('[data-m5-dt]').forEach(btn => {
          btn.addEventListener('click', () => {
            const dt = Number(btn.dataset.m5Dt);
            state.m5.distType = dt;
            if (dt === 1) { state.m5.distFactor = 4; state.m5.distBase = 23; }
            else { state.m5.distFactor = 14; state.m5.distBase = 23; }
            initMode5('dist');
          });
        });
      } else if (state.mode === 6) {
        quickStripEl.innerHTML = `
          <button class="pill-btn ${state.m6.subMode === 'secret' ? 'active' : ''}" data-m6-sub="secret" type="button">🔍 Noves Fora (Segredo)</button>
          <button class="pill-btn ${state.m6.subMode === 'hunt' ? 'active' : ''}" data-m6-sub="hunt" type="button">🕵️ Caça ao Erro</button>
        `;
        quickStripEl.querySelectorAll('[data-m6-sub]').forEach(btn => {
          btn.addEventListener('click', () => initMode6(btn.dataset.m6Sub));
        });
      } else {
        quickStripEl.innerHTML = '';
      }

      // Rodapé: contador, instrução e decomposição
      const total = getTotalValue();
      const solved = isCurrentSolved();
      abacusPaneEl.classList.toggle('stage-done', solved);
      counterPillEl.classList.toggle('done', solved);

      if (state.mode === 6) {
        const beads = sumOfRodsBeads();
        counterCaptionEl.textContent = 'Peças';
        animateCounter(String(beads));
      } else {
        counterCaptionEl.textContent = 'Ábaco';
        animateCounter(String(total));
      }

      if (solved) {
        statusInstructionEl.textContent = `Excelente! Resultado no ábaco: ${total} (${numberToPtBr(total)}).`;
        statusInstructionEl.className = 'status-instruction success';
      } else if (state.statusOverride) {
        statusInstructionEl.textContent = state.statusOverride;
        statusInstructionEl.className = 'status-instruction';
      } else if (hasAnyOverflow()) {
        statusInstructionEl.textContent = 'Uma haste chegou a 10 peças! Toque em ⬆ 10→1 para subir o degrau.';
        statusInstructionEl.className = 'status-instruction';
      } else if (state.mode === 1) {
        statusInstructionEl.textContent = `Número atual: ${numberToPtBr(total)}.`;
        statusInstructionEl.className = 'status-instruction';
      } else if (state.mode === 6) {
        const beads = sumOfRodsBeads();
        statusInstructionEl.textContent = beads >= 9
          ? `Total de ${beads} peças nas hastes. Retire grupos de 9!`
          : `Sobraram ${beads} peças (noves fora = ${beads}).`;
        statusInstructionEl.className = beads < 9 ? 'status-instruction success' : 'status-instruction';
      } else {
        statusInstructionEl.textContent = 'Acompanhe os degraus do ábaco e a conta ao lado.';
        statusInstructionEl.className = 'status-instruction';
      }

      // Botões de ação no rodapé
      footerActionsEl.innerHTML = `
        <button id="speakTotalBtn" class="secondary-btn" type="button">🔊 Ler ${total}</button>
      `;
      document.getElementById('speakTotalBtn').addEventListener('click', () => {
        AudioSystem.speakText(numberToPtBr(getTotalValue()));
      });

      // Decomposição aditiva (ex.: 200 + 40 + 5 = 245)
      if (state.mode === 6) {
        const parts = [];
        for (let i = state.rodCount - 1; i >= 0; i--) {
          parts.push(`<span class="decomp-chip" style="color:${ORDERS[i].color};">${state.rods[i]} ${ORDERS[i].key}</span>`);
        }
        decompStripEl.innerHTML = `${parts.join('<span>+</span>')}<span>=</span><span class="decomp-chip">${sumOfRodsBeads()} peças</span>`;
      } else {
        const parts = [];
        for (let i = state.rodCount - 1; i >= 0; i--) {
          const val = state.rods[i] * ORDERS[i].value;
          parts.push(`<span class="decomp-chip" style="color:${ORDERS[i].color};">${val}</span>`);
        }
        decompStripEl.innerHTML = `${parts.join('<span>+</span>')}<span>=</span><span class="decomp-chip">${total}</span>`;
      }
    }

    /* =========================================================
       PAINEL DO PROFESSOR (GAVETA RECOLHÍVEL)
       ========================================================= */
    function setDrawerOpen(open) {
      state.drawerOpen = open;
      teacherDrawerEl.classList.toggle('open', open);
      drawerBackdropEl.classList.toggle('open', open);
      teacherDrawerEl.setAttribute('aria-hidden', String(!open));
      panelToggleBtn.setAttribute('aria-expanded', String(open));
      panelToggleBtn.classList.toggle('btn-panel-open', open);
      if (open) renderDrawer();
    }

    function renderDrawer() {
      const rodsSection = `
        <div class="drawer-section">
          <span class="drawer-label">Limite de Hastes (Degraus)</span>
          <div class="drawer-grid">
            <button class="d-btn ${state.rodCount === 2 ? 'active' : ''}" data-rods="2" type="button">U – D (até 99)</button>
            <button class="d-btn ${state.rodCount === 3 ? 'active' : ''}" data-rods="3" type="button">U – D – C (até 999)</button>
            <button class="d-btn ${state.rodCount === 4 ? 'active' : ''}" data-rods="4" type="button">U – D – C – UM</button>
          </div>
        </div>
      `;

      let modeSection = '';
      if (state.mode === 1) {
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Atalhos para Explorar</span>
            <div class="drawer-grid">
              ${[15, 105, 240, 309, 1020].map(n => `<button class="d-btn" data-d-m1="${n}" type="button">${n}</button>`).join('')}
            </div>
          </div>
          <p class="drawer-note"><strong>Dica:</strong> Compare <strong>15</strong> e <strong>105</strong> para mostrar o papel do zero como guardião do degrau vazio.</p>
        `;
      } else if (state.mode === 2) {
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Números para Montar</span>
            <div class="drawer-grid">
              ${[47, 105, 208, 300, 450, 1024].map(n => `<button class="d-btn" data-d-m2="${n}" type="button">${n}</button>`).join('')}
            </div>
          </div>
        `;
      } else if (state.mode === 3) {
        const presets = [[25, 14], [48, 35], [67, 58], [148, 76], [285, 147]];
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Contas de Adição (Vai Um)</span>
            <div class="drawer-grid">
              ${presets.map(([a, b]) => `<button class="d-btn" data-d-m3="${a}-${b}" type="button">${a} + ${b}</button>`).join('')}
            </div>
          </div>
        `;
      } else if (state.mode === 4) {
        const presets = [[83, 47], [52, 18], [70, 26], [204, 67], [300, 145]];
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Contas de Subtração (Empresta)</span>
            <div class="drawer-grid">
              ${presets.map(([a, b]) => `<button class="d-btn" data-d-m4="${a}-${b}" type="button">${a} − ${b}</button>`).join('')}
            </div>
          </div>
          <p class="drawer-note"><strong>Dica:</strong> Em <strong>204 − 67</strong>, o aluno vê o empréstimo em cascata da Centena para a Dezena e depois para a Unidade!</p>
        `;
      } else if (state.mode === 5) {
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Atalhos de Multiplicação</span>
            <div class="drawer-grid">
              <button class="d-btn" data-d-m5="dist1-4-23" type="button">4 × 23 (1 alg.)</button>
              <button class="d-btn" data-d-m5="dist1-3-45" type="button">3 × 45 (1 alg.)</button>
              <button class="d-btn" data-d-m5="dist2-14-23" type="button">14 × 23 (2 alg.)</button>
              <button class="d-btn" data-d-m5="dist2-12-34" type="button">12 × 34 (2 alg.)</button>
              <button class="d-btn" data-d-m5="pack-3-24" type="button">Pacotes: 3 × 24</button>
            </div>
          </div>
        `;
      } else {
        modeSection = `
          <div class="drawer-section">
            <span class="drawer-label">Números para Noves Fora</span>
            <div class="drawer-grid">
              ${[248, 357, 486, 519, 1234].map(n => `<button class="d-btn" data-d-m6="${n}" type="button">${n}</button>`).join('')}
            </div>
          </div>
        `;
      }

      drawerBodyEl.innerHTML = rodsSection + modeSection;

      drawerBodyEl.querySelectorAll('[data-rods]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.rodCount = Number(btn.dataset.rods);
          for (let i = state.rodCount; i < 4; i++) state.rods[i] = 0;
          render();
          renderDrawer();
        });
      });

      drawerBodyEl.querySelectorAll('[data-d-m1]').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = Number(btn.dataset.dM1);
          ensureRodsFor(v);
          initMode1(v);
          setDrawerOpen(false);
        });
      });
      drawerBodyEl.querySelectorAll('[data-d-m2]').forEach(btn => {
        btn.addEventListener('click', () => { initMode2(Number(btn.dataset.dM2)); setDrawerOpen(false); });
      });
      drawerBodyEl.querySelectorAll('[data-d-m3]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [a, b] = btn.dataset.dM3.split('-').map(Number);
          initMode3(a, b);
          setDrawerOpen(false);
        });
      });
      drawerBodyEl.querySelectorAll('[data-d-m4]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [a, b] = btn.dataset.dM4.split('-').map(Number);
          initMode4(a, b);
          setDrawerOpen(false);
        });
      });
      drawerBodyEl.querySelectorAll('[data-d-m5]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [kind, f, b] = btn.dataset.dM5.split('-');
          if (kind === 'pack') {
            state.m5.packFactor = Number(f);
            state.m5.packBase = Number(b);
            initMode5('packs');
          } else {
            state.m5.distType = kind === 'dist1' ? 1 : 2;
            state.m5.distFactor = Number(f);
            state.m5.distBase = Number(b);
            initMode5('dist');
          }
          setDrawerOpen(false);
        });
      });
      drawerBodyEl.querySelectorAll('[data-d-m6]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.m6.secretNum = Number(btn.dataset.dM6);
          initMode6('secret');
          setDrawerOpen(false);
        });
      });
    }

    function randomizeCurrentMode() {
      if (state.mode === 1) {
        initMode1(10 + Math.floor(Math.random() * Math.min(890, maxAllowedNumber() - 10)));
      } else if (state.mode === 2) {
        initMode2(12 + Math.floor(Math.random() * Math.min(880, maxAllowedNumber() - 12)));
      } else if (state.mode === 3) {
        const a = 25 + Math.floor(Math.random() * 64);
        const b = 17 + Math.floor(Math.random() * 52);
        initMode3(a, b);
      } else if (state.mode === 4) {
        const a = 52 + Math.floor(Math.random() * 44);
        const b = 16 + Math.floor(Math.random() * 34);
        initMode4(a, b);
      } else if (state.mode === 5) {
        if (state.m5.subMode === 'dist' && state.m5.distType === 2) {
          state.m5.distFactor = 11 + Math.floor(Math.random() * 5);
          state.m5.distBase = 21 + Math.floor(Math.random() * 14);
        } else {
          state.m5.distFactor = 3 + Math.floor(Math.random() * 3);
          state.m5.distBase = 14 + Math.floor(Math.random() * 25);
          state.m5.packFactor = state.m5.distFactor;
          state.m5.packBase = state.m5.distBase;
        }
        initMode5(state.m5.subMode);
      } else {
        if (state.m6.subMode === 'secret') {
          state.m6.secretNum = 123 + Math.floor(Math.random() * 760);
          initMode6('secret');
        } else {
          state.m6.huntIdx = (state.m6.huntIdx + 1) % HUNT_PROBLEMS.length;
          initMode6('hunt');
        }
      }
      if (state.drawerOpen) renderDrawer();
    }

    /* =========================================================
       RENDERIZADOR PRINCIPAL E EVENTOS GLOBAIS
       ========================================================= */
    function render() {
      document.querySelectorAll('.mode-tab').forEach(tab => {
        const active = Number(tab.dataset.mode) === state.mode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', String(active));
      });

      renderAbacusSvg();
      renderRodControls();
      renderSidePane();
      renderQuickStripAndFooter();
    }

    function updateAudioButtonUI() {
      const m = AudioSystem.getMode();
      audioBtn.classList.toggle('audio-muted', m === 'mute');
      if (m === 'voice') {
        audioIconEl.textContent = '🔊';
        audioLabelEl.textContent = 'Voz + Som';
      } else if (m === 'sfx') {
        audioIconEl.textContent = '🎵';
        audioLabelEl.textContent = 'Só Som';
      } else {
        audioIconEl.textContent = '🔇';
        audioLabelEl.textContent = 'Mudo';
      }
    }

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const nextMode = Number(tab.dataset.mode);
        clearAnimations();
        AudioSystem.stopSpeech();
        state.mode = nextMode;
        if (state.drawerOpen) renderDrawer();

        if (nextMode === 1) render();
        else if (nextMode === 2) initMode2(state.m2.target);
        else if (nextMode === 3) initMode3(state.m3.a, state.m3.b);
        else if (nextMode === 4) initMode4(state.m4.a, state.m4.b);
        else if (nextMode === 5) initMode5(state.m5.subMode);
        else if (nextMode === 6) initMode6(state.m6.subMode);
      });
    });

    audioBtn.addEventListener('click', () => {
      AudioSystem.cycleMode();
      updateAudioButtonUI();
    });

    resetBtn.addEventListener('click', () => {
      if (state.mode === 1) initMode1(0);
      else if (state.mode === 2) initMode2(state.m2.target);
      else if (state.mode === 3) initMode3(state.m3.a, state.m3.b);
      else if (state.mode === 4) initMode4(state.m4.a, state.m4.b);
      else if (state.mode === 5) initMode5(state.m5.subMode);
      else if (state.mode === 6) initMode6(state.m6.subMode);
    });

    panelToggleBtn.addEventListener('click', () => setDrawerOpen(!state.drawerOpen));
    drawerCloseBtn.addEventListener('click', () => setDrawerOpen(false));
    drawerBackdropEl.addEventListener('click', () => setDrawerOpen(false));
    drawerRandomBtn.addEventListener('click', () => {
      randomizeCurrentMode();
      setDrawerOpen(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.drawerOpen) setDrawerOpen(false);
    });

    window.onload = function () {
      updateAudioButtonUI();
      initMode1(0);
    };
  </script>
</body>
</html>
