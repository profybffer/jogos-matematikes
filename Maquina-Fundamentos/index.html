<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Máquina de Fundamentos — Matematikês v1.0</title>
  <style>
    /* =========================================================
       TOKENS VISUAIS — LABORATÓRIO PEDAGÓGICO (ALTO CONTRASTE)
       ========================================================= */
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-slate: #cbd5e1;
      --border-light: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --blue-main: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-soft: #eff6ff;
      --blue-border: #93c5fd;

      --green-main: #10b981;
      --green-dark: #047857;
      --green-soft: #ecfdf5;
      --green-border: #6ee7b7;

      --red-main: #ef4444;
      --red-soft: #fef2f2;

      --amber-main: #f59e0b;
      --amber-soft: #fffbeb;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
    }

    /* =========================================================
       LAYOUT PRINCIPAL — 100dvh SEM SCROLL (PC E CELULAR)
       ========================================================= */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* BARRA SUPERIOR COMPACTA */
    .topbar {
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--border-light);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background-color: var(--blue-main);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-tabs {
      display: flex;
      gap: 4px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }

    .mode-tab:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.75);
    }

    .mode-tab.active {
      background-color: var(--blue-main);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .top-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 36px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-slate);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .top-btn:hover {
      border-color: var(--blue-main);
      color: var(--blue-main);
      background-color: var(--blue-soft);
    }

    .top-btn:active {
      transform: scale(0.96);
    }

    .top-btn.btn-panel-open {
      background-color: var(--blue-main);
      border-color: var(--blue-main);
      color: #ffffff;
    }

    .top-btn.audio-muted {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      border-color: var(--border-light);
    }

    /* =========================================================
       PALCO CENTRAL FLUIDO (flex: 1; min-height: 0)
       ========================================================= */
    .stage-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      overflow: hidden;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    /* Faixa rápida contextual (ex.: degraus no Modo 2 ou Quadrado/Trapézio) */
    .quick-strip {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 0;
    }

    .quick-strip:empty {
      display: none;
    }

    .pill-btn {
      border: 1.5px solid var(--border-slate);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      border-color: var(--blue-main);
      color: var(--blue-main);
    }

    .pill-btn.active {
      background-color: var(--blue-main);
      border-color: var(--blue-main);
      color: #ffffff;
    }

    .pill-btn.pill-accent {
      border-color: var(--amber-main);
      background-color: var(--amber-soft);
      color: #92400e;
    }

    .pill-btn.pill-accent.active {
      background-color: var(--amber-main);
      color: #ffffff;
    }

    /* Cartão do Palco SVG */
    .stage-box {
      flex: 1;
      min-height: 0;
      width: 100%;
      background-color: var(--bg-card);
      border: 2px solid var(--border-slate);
      border-radius: var(--radius-lg);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.25s, background-color 0.25s;
    }

    .stage-box.stage-done {
      border-color: var(--green-main);
      background-color: #f0fdf4;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      touch-action: manipulation;
    }

    /* Estado de Zero (área pontilhada limpa) */
    .zero-overlay {
      width: min(86%, 440px);
      padding: 24px 18px;
      border: 3px dashed var(--border-slate);
      border-radius: var(--radius-lg);
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .stage-box.stage-done .zero-overlay {
      border-color: var(--green-main);
      background-color: #ffffff;
    }

    .zero-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0;
    }

    .zero-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin: 0;
    }

    .big-action-btn {
      border: none;
      border-radius: var(--radius-md);
      background-color: var(--blue-main);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 13px 26px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s, background-color 0.15s;
    }

    .big-action-btn:hover {
      background-color: var(--blue-hover);
    }

    .big-action-btn:active {
      transform: scale(0.96);
    }

    .big-action-btn.confirmed {
      background-color: var(--green-main);
    }

    /* Botão flutuante discreto de "Confirmar 0" no Modo 2 (Círculo) */
    .stage-zero-float {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
    }

    /* =========================================================
       ESTILOS SVG INTERATIVOS (CÓPIAS E VÉRTICES)
       ========================================================= */
    .copy-item {
      cursor: pointer;
    }

    .copy-shape {
      fill: var(--blue-soft);
      stroke: var(--blue-main);
      stroke-width: 4.5;
      transition: fill 0.18s, stroke 0.18s;
    }

    .copy-item:hover .copy-shape {
      fill: #dbeafe;
    }

    .copy-item.counted .copy-shape {
      fill: var(--green-soft);
      stroke: var(--green-main);
      stroke-width: 5;
    }

    .copy-num {
      font-size: 34px;
      font-weight: 900;
      fill: var(--green-dark);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .poly-body {
      fill: #ffffff;
      stroke: #334155;
      stroke-width: 5;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.25s, stroke 0.25s;
    }

    .poly-body.done {
      fill: var(--green-soft);
      stroke: var(--green-dark);
    }

    .vertex-group {
      cursor: pointer;
    }

    .vertex-hit {
      fill: transparent;
    }

    .vertex-glow {
      fill: var(--green-main);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .vertex-group.counted .vertex-glow {
      opacity: 0.22;
    }

    .vertex-dot {
      fill: #ffffff;
      stroke: var(--blue-main);
      stroke-width: 4.5;
      transition: fill 0.16s, stroke 0.16s;
    }

    .vertex-dot.is-point {
      fill: var(--blue-main);
      stroke: var(--blue-hover);
      stroke-width: 3;
    }

    .vertex-group:hover .vertex-dot {
      fill: var(--blue-soft);
    }

    .vertex-group:hover .vertex-dot.is-point {
      fill: var(--blue-hover);
    }

    .vertex-group.counted .vertex-dot,
    .vertex-group.counted .vertex-dot.is-point {
      fill: var(--green-main);
      stroke: var(--green-dark);
      stroke-width: 4;
    }

    .vertex-num {
      font-weight: 900;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .fusion-fig-frame {
      fill: #f8fafc;
      stroke: var(--border-light);
      stroke-width: 2.5;
      transition: fill 0.2s, stroke 0.2s;
    }

    .fusion-fig-frame.done {
      fill: #f0fdf4;
      stroke: var(--green-main);
      stroke-width: 3;
    }

    .fusion-fig-label {
      font-size: 15px;
      font-weight: 800;
      fill: var(--text-muted);
      text-anchor: middle;
      pointer-events: none;
    }

    .fusion-fig-label.done {
      fill: var(--green-dark);
    }

    /* =========================================================
       RODAPÉ COMPACTO (CONTADOR, INSTRUÇÃO/SOMA E BARRA NUMÉRICA)
       ========================================================= */
    .footer-dock {
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-top: 2px solid var(--border-light);
      padding: 8px 14px 10px;
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.04);
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-subtle);
      border: 2px solid var(--border-slate);
      border-radius: var(--radius-md);
      padding: 4px 14px;
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .counter-pill.done {
      background-color: var(--green-soft);
      border-color: var(--green-main);
    }

    .counter-caption {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .counter-pill.done .counter-caption {
      color: var(--green-dark);
    }

    .counter-number {
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1;
      color: var(--blue-main);
      min-width: 34px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .counter-pill.done .counter-number {
      color: var(--green-dark);
    }

    .counter-pop {
      animation: popScale 0.22s ease;
    }

    @keyframes popScale {
      0% { transform: scale(1); }
      45% { transform: scale(1.26); }
      100% { transform: scale(1); }
    }

    .status-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2px;
    }

    .status-instruction {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.25;
    }

    .status-instruction.success {
      color: var(--green-dark);
    }

    .next-btn {
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-sm);
      background-color: var(--blue-main);
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .next-btn:hover {
      background-color: var(--blue-hover);
    }

    .next-btn.ready {
      background-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .next-btn.ready:hover {
      background-color: var(--green-dark);
    }

    /* Barra Numérica Compacta (Modos 1 e 2) */
    .num-bar {
      display: grid;
      gap: 6px;
      width: 100%;
    }

    .num-bar.cols-10 {
      grid-template-columns: repeat(10, 1fr);
    }

    .num-bar.cols-7 {
      grid-template-columns: repeat(7, 1fr);
      max-width: 560px;
      margin: 0 auto;
    }

    .num-key {
      height: 44px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-slate);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.12s;
    }

    .num-key:hover {
      border-color: var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
    }

    .num-key:active {
      transform: scale(0.94);
    }

    .num-key.key-correct {
      background-color: var(--green-main);
      border-color: var(--green-dark);
      color: #ffffff;
    }

    .num-key.key-wrong {
      background-color: var(--red-soft);
      border-color: var(--red-main);
      color: var(--red-main);
      animation: shake 0.28s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Equação Visual em Blocos (Modo 3) */
    .sum-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sum-block {
      min-width: 44px;
      height: 40px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-slate);
      background-color: var(--bg-subtle);
      color: var(--blue-main);
      font-size: 1.25rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .sum-block.block-done {
      background-color: var(--green-main);
      border-color: var(--green-dark);
      color: #ffffff;
    }

    .sum-op {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-muted);
    }

    .sum-total {
      min-width: 52px;
      height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 2.5px solid var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
      font-size: 1.35rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .sum-total.done {
      background-color: var(--green-dark);
      border-color: var(--green-dark);
      color: #ffffff;
    }

    /* =========================================================
       MODO 4 — DESAFIO QUIZ (SEM SCROLL, ERRO SEM PUNIÇÃO)
       ========================================================= */
    .quiz-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      overflow: hidden;
    }

    .quiz-top {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .quiz-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .quiz-star {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border-slate);
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 0.95rem;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    .quiz-star.current {
      border-color: var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
      transform: scale(1.1);
    }

    .quiz-star.earned {
      border-color: var(--amber-main);
      background-color: var(--amber-soft);
      color: #d97706;
    }

    .quiz-prompt-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .quiz-prompt {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.2;
    }

    .quiz-listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid var(--blue-main);
      background-color: var(--blue-soft);
      color: var(--blue-main);
      font-size: 0.92rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .quiz-listen-btn:hover {
      background-color: var(--blue-main);
      color: #ffffff;
    }

    .quiz-listen-btn:active {
      transform: scale(0.95);
    }

    .quiz-arena {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .quiz-stimulus {
      flex: 1;
      min-height: 0;
      width: 100%;
      background-color: var(--bg-page);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .quiz-options.svg-options {
      flex: 1;
      min-height: 0;
    }

    .quiz-options.num-options {
      flex-shrink: 0;
      max-width: 620px;
      margin: 0 auto;
    }

    .quiz-card {
      border: 2.5px solid var(--border-slate);
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      min-height: 0;
      overflow: hidden;
      transition: transform 0.14s, border-color 0.2s, background-color 0.2s, opacity 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .quiz-card:hover:not(.dimmed):not(.correct) {
      border-color: var(--blue-main);
      background-color: var(--blue-soft);
      transform: translateY(-2px);
    }

    .quiz-card:active:not(.dimmed) {
      transform: scale(0.97);
    }

    .quiz-card.num-card {
      height: 66px;
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-primary);
    }

    .quiz-card.correct {
      border-color: var(--green-dark);
      background-color: var(--green-soft);
      color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
    }

    .quiz-card.dimmed {
      opacity: 0.42;
      background-color: var(--bg-subtle);
      border-color: var(--border-light);
      cursor: default;
    }

    .quiz-card.wrong-shake {
      border-color: var(--amber-main);
      background-color: var(--amber-soft);
      animation: gentleShake 0.34s ease;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      65% { transform: translateX(5px); }
    }

    /* Destaque pulsante de dica visual (erro sem punição) */
    .quiz-hint-pulse .vertex-dot,
    .quiz-hint-pulse .copy-shape {
      animation: hintPulse 0.85s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% {
        stroke: var(--amber-main);
        stroke-width: 6;
      }
      50% {
        stroke: var(--blue-main);
        stroke-width: 8.5;

      height: 100%;

      flex-direction: column;

    .celebration-sub {

      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-secondary);
      max-width: 460px;
    }

    /* =========================================================
       PAINEL DO PROFESSOR (GAVETA RECOLHÍVEL)

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.38);

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;

    .drawer-grid {
      display: flex;
      flex-wrap: wrap;

    /* =========================================================

  <script>
    /* =========================================================
       MOTOR DE ÁUDIO: VOZ FALADA (pt-BR) + WEB AUDIO API
       ========================================================= */
    const AudioSystem = (() => {
      // Modos: 'voice' (Voz + Som) | 'sfx' (Só Som) | 'mute' (Mudo)
      let mode = 'voice';
      let audioCtx = null;
      let ptBrVoice = null;

      // Dicionário por extenso de 0 a 24 para pronúncia limpa e natural
      const NUMBER_WORDS = [
        'zero', 'um', 'dois', 'três', 'quatro', 'cinco',
        'seis', 'sete', 'oito', 'nove', 'dez',
        'onze', 'doze', 'treze', 'catorze', 'quinze',
        'dezesseis', 'dezessete', 'dezoito', 'dezenove', 'vinte',
        'vinte e um', 'vinte e dois', 'vinte e três', 'vinte e quatro'
      ];

      // Notas musicais ascendentes (C4 até E7) para contagem até 24
      const NOTES = [
        261.63, 293.66, 329.63, 349.23, 392.00, 440.00,
        493.88, 523.25, 587.33, 659.25, 698.46, 783.99,
        880.00, 987.77, 1046.50, 1174.66, 1318.51, 1396.91,
        1567.98, 1760.00, 1975.53, 2093.00, 2349.32, 2637.02
      ];

      function pickPtBrVoice() {
        try {
          if (!('speechSynthesis' in window)) return;
          const voices = window.speechSynthesis.getVoices();
          if (!voices || !voices.length) return;
          ptBrVoice =
            voices.find(v => v.lang && v.lang.toLowerCase() === 'pt-br') ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt')) ||
            null;
        } catch (err) {
          ptBrVoice = null;
        }
      }

      if ('speechSynthesis' in window) {
        pickPtBrVoice();
        window.speechSynthesis.onvoiceschanged = pickPtBrVoice;
      }

      function ensureCtx() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (err) {
          // Ignora restrições pontuais do navegador
        }
      }

      function playTone(freq, duration = 0.14, type = 'triangle', volume = 0.16, delay = 0) {
        if (mode === 'mute') return;
        ensureCtx();
        if (!audioCtx) return;

        try {
          const now = audioCtx.currentTime + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (err) {
          // Silencioso
        }
      }

      function speakNumber(n) {
        if (mode !== 'voice') return;
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const text = NUMBER_WORDS[n] !== undefined ? NUMBER_WORDS[n] : String(n);
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'pt-BR';
          utter.rate = 1.05;
          utter.pitch = 1.05;
          if (ptBrVoice) utter.voice = ptBrVoice;
          window.speechSynthesis.speak(utter);
        } catch (err) {
          // Silencioso caso síntese não esteja disponível
        }
      }

      function speakText(text) {
        if (mode !== 'voice') return;
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'pt-BR';
          utter.rate = 1.02;
          utter.pitch = 1.04;
          if (ptBrVoice) utter.voice = ptBrVoice;
          window.speechSynthesis.speak(utter);
        } catch (err) {
          // Silencioso caso síntese não esteja disponível
        }
      }

      return {
        getMode: () => mode,
        cycleMode: () => {
          if (mode === 'voice') mode = 'sfx';
          else if (mode === 'sfx') mode = 'mute';
          else mode = 'voice';

          if (mode !== 'voice' && 'speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
          return mode;
        },
        stopSpeech: () => {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
        },
        speakText,
        playCount: (num) => {
          const idx = Math.max(0, Math.min(num - 1, NOTES.length - 1));
          playTone(num === 0 ? 261.63 : NOTES[idx], 0.15, 'triangle', 0.15);
          speakNumber(num);
        },
        playSuccess: () => {
          playTone(523.25, 0.16, 'sine', 0.14, 0.00);
          playTone(659.25, 0.16, 'sine', 0.14, 0.08);
          playTone(783.99, 0.26, 'sine', 0.16, 0.16);
        },
        playCelebration: () => {
          playTone(523.25, 0.14, 'triangle', 0.15, 0.00);
          playTone(659.25, 0.14, 'triangle', 0.15, 0.10);
          playTone(783.99, 0.14, 'triangle', 0.15, 0.20);
          playTone(1046.50, 0.34, 'triangle', 0.18, 0.30);
        },
        playHint: () => {
          playTone(329.63, 0.13, 'sine', 0.11, 0.00);
          playTone(293.66, 0.18, 'sine', 0.10, 0.10);
        },
        playError: () => {
          playTone(185.0, 0.18, 'sine', 0.15, 0);
        }
      };
    })();

    /* =========================================================
       ESTADO GLOBAL DA APLICAÇÃO
       ========================================================= */
    const state = {
      mode: 1, // 1 = Cópias, 2 = Vértices, 3 = Fusão, 4 = Desafio Quiz
      drawerOpen: false,
      isPortrait: false,
      lastCounterVal: null,

      // Modo 1: Extração por Cópias (0 a 9)
      m1: {
        target: 5,
        layout: 'subitizing', // 'subitizing' | 'scattered'
        shape: 'square',      // 'square' | 'triangle' | 'circle'
        requireValidation: true,
        countedIds: [],

        validatedNumber: null,
        wrongKey: null,
        scatteredSeeds: []    // Coordenadas normalizadas [0..1, 0..1] para adaptar PC/Celular
      },

      // Modo 2: Extração por Vértices — Escada Dimensional (0 a 6)
      m2: {
        step: 3,              // 0..6 (até o Hexágono)
        quadType: 'square',   // 'square' | 'trapezoid'
        requireValidation: true,
        countedVertices: [],
        zeroConfirmed: false,
        validatedNumber: null,
