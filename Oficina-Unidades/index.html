      // --- ABA 4: RÉGUA 1/10 ---
      function buildRulerObjectSVG(objId, x0, xEnd) {
        const w = Math.max(12, xEnd - x0);
        const midX = x0 + w / 2;
        if (objId === 'ladybug') {
          const rx = w / 2;
          return `
            <ellipse cx="${midX.toFixed(1)}" cy="54" rx="${rx.toFixed(1)}" ry="26" fill="#EF4444" stroke="#0F172A" stroke-width="2.5" />
            <circle cx="${(x0 + 16).toFixed(1)}" cy="54" r="14" fill="#0F172A" />
            <line x1="${(x0 + 26).toFixed(1)}" y1="54" x2="${xEnd.toFixed(1)}" y2="54" stroke="#0F172A" stroke-width="2.2" />
            <circle cx="${(x0 + w * 0.45).toFixed(1)}" cy="43" r="4.5" fill="#0F172A" />
            <circle cx="${(x0 + w * 0.72).toFixed(1)}" cy="45" r="4.5" fill="#0F172A" />
            <circle cx="${(x0 + w * 0.55).toFixed(1)}" cy="65" r="4.5" fill="#0F172A" />`;
        }
        if (objId === 'clip') {
          return `
            <rect x="${x0}" y="38" width="${w.toFixed(1)}" height="32" rx="16" fill="none" stroke="#64748B" stroke-width="6" />
            <rect x="${x0 + 14}" y="46" width="${Math.max(10, w - 28).toFixed(1)}" height="16" rx="8" fill="none" stroke="#94A3B8" stroke-width="4" />`;
        }
        if (objId === 'eraser') {
          const split = x0 + w * 0.62;
          return `
            <rect x="${x0}" y="34" width="${w.toFixed(1)}" height="40" rx="7" fill="#F43F5E" stroke="#0F172A" stroke-width="2.5" />
            <rect x="${split.toFixed(1)}" y="34" width="${(xEnd - split).toFixed(1)}" height="40" rx="5" fill="#3B82F6" stroke="#0F172A" stroke-width="2.5" />
            <text x="${(x0 + (split - x0) / 2).toFixed(1)}" y="59" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">BORRACHA</text>`;
        }
        if (objId === 'screw') {
          return `
            <rect x="${x0}" y="34" width="24" height="40" rx="4" fill="#64748B" stroke="#0F172A" stroke-width="2.5" />
            <rect x="${x0 + 24}" y="44" width="${Math.max(10, w - 24).toFixed(1)}" height="20" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.2" />
            <line x1="${x0 + 48}" y1="44" x2="${x0 + 40}" y2="64" stroke="#475569" stroke-width="2" />
            <line x1="${x0 + 74}" y1="44" x2="${x0 + 66}" y2="64" stroke="#475569" stroke-width="2" />
            <line x1="${x0 + 100}" y1="44" x2="${x0 + 92}" y2="64" stroke="#475569" stroke-width="2" />`;
        }
        // Medida livre: barra verde elegante
        return `
          <rect x="${x0}" y="40" width="${w.toFixed(1)}" height="28" rx="8" fill="#10B981" fill-opacity="0.85" stroke="#065F46" stroke-width="2.5" />
          <text x="${midX.toFixed(1)}" y="59" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">${w > 55 ? 'Arraste na régua ↔' : ''}</text>`;
      }

      function renderTab4() {
        const { objIdx, mm } = state.ruler;
        const obj = RULER_OBJECTS[objIdx];
        const wholes = Math.floor(mm / 10);
        const rem = mm % 10;
        const mixedTxt = wholes > 0
          ? (rem === 0 ? `${wholes} cm inteiro${wholes > 1 ? 's' : ''}` : `${wholes} inteiro${wholes > 1 ? 's' : ''} e ${rem}/10 cm`)
          : `${mm}/10 de 1 cm`;

        const W = 680, H = 215;
        const x0 = 40, xMax = 640;
        const stepPx = (xMax - x0) / 30;
        const curX = x0 + mm * stepPx;

        let ticks = '';
        for (let i = 0; i <= 30; i++) {
          const x = x0 + i * stepPx;
          const isCm = i % 10 === 0;
          const isHalf = i % 5 === 0 && !isCm;
          const th = isCm ? 34 : (isHalf ? 24 : 15);
          ticks += `<line x1="${x.toFixed(1)}" y1="104" x2="${x.toFixed(1)}" y2="${104 + th}" stroke="#0F172A" stroke-width="${isCm ? 2.8 : (isHalf ? 2 : 1.3)}" />`;
          if (isCm) {
            ticks += `<text x="${x.toFixed(1)}" y="160" text-anchor="middle" font-size="18" font-weight="900" fill="#0F172A">${i / 10} cm</text>`;
          }
        }

        const svg = `
          <svg id="rulerSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            <!-- Objeto sobre o zero -->
            ${buildRulerObjectSVG(obj.id, x0, curX)}

            <!-- Corpo da régua -->
            <rect x="20" y="104" width="640" height="72" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="3" />
            <!-- Faixa destacada de 0 até mm -->
            <rect x="${x0}" y="104" width="${(curX - x0).toFixed(1)}" height="16" fill="#2563EB" fill-opacity="0.28" />
            ${ticks}

            <!-- Linha guia e alça de arraste -->
            <line x1="${curX.toFixed(1)}" y1="22" x2="${curX.toFixed(1)}" y2="188" stroke="#2563EB" stroke-width="3" stroke-dasharray="5,4" />
            <circle cx="${curX.toFixed(1)}" cy="192" r="13" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5" />
            <text x="${curX.toFixed(1)}" y="196" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFFFF">↔</text>
          </svg>`;

        return `
          <div class="ruler-shell">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; flex-shrink:0;">
              <div class="segmented">
                ${RULER_OBJECTS.map((o, idx) => `
                  <button class="${objIdx === idx ? 'active' : ''}" data-ruler-obj="${idx}">${o.name}</button>
                `).join('')}
              </div>
              <div style="display:flex; gap:4px; align-items:center;">
                <button class="btn btn-sm" id="rulerDec" ${mm <= 0 ? 'disabled' : ''}>− 1 mm</button>
                <button class="btn btn-sm" id="rulerInc" ${mm >= 30 ? 'disabled' : ''}>+ 1 mm</button>
              </div>
            </div>

            <div class="card ruler-stage-card">
              <div class="card-title">
                <span>Régua ampliada de 0 a 3 cm (cada traço = 1/10 cm = 1 mm)</span>
                <span class="badge badge-blue">Clique ou arraste na régua</span>
              </div>
              <div class="ruler-interactive" id="rulerHitArea">${svg}</div>
            </div>

            <div class="triple-bar">
              <div class="triple-card t-mm">
                <span class="triple-label">Milímetros</span>
                <span class="triple-val" style="color:var(--blue);">${mm} mm</span>
                <span class="triple-sub">${mm} décimos de cm</span>
              </div>
              <div class="triple-card t-fr">
                <span class="triple-label">Fração de cm</span>
                <span class="triple-val" style="color:var(--purple);">${mm}/10 cm</span>
                <span class="triple-sub">${mixedTxt}</span>
              </div>
              <div class="triple-card t-dec">
                <span class="triple-label">Decimal</span>
                <span class="triple-val" style="color:var(--green);">${formatBR(mm / 10, 1)} cm</span>
                <span class="triple-sub">Vírgula separa inteiros e décimos</span>
              </div>
            </div>
          </div>`;
      }

      // --- ABA 5: MESMA UNIDADE ---
      function buildSwapSVG(p, stage) {
        const W = 580, H = 248;
        const padL = 78, barW = 472, barH = 44;

        function drawBar(n, d, y, color, label, subdivD = null) {
          let s = `<text x="${padL - 10}" y="${y + barH / 2 + 5}" text-anchor="end" font-size="16" font-weight="900" fill="${color}">${n}/${d}</text>`;
          s += `<text x="${padL}" y="${y - 6}" font-size="11.5" font-weight="800" fill="#475569">${label}</text>`;
          const segW = barW / d;
          for (let i = 0; i < d; i++) {
            s += `<rect x="${(padL + i * segW).toFixed(2)}" y="${y}" width="${segW.toFixed(2)}" height="${barH}"
              fill="${i < n ? color : '#FFFFFF'}" stroke="#334155" stroke-width="1.8" />`;
          }
          // Se subdividido, desenha cortes tracejados internos da unidade comum
          if (subdivD && subdivD > d) {
            const subW = barW / subdivD;
            for (let j = 1; j < subdivD; j++) {
              const x = padL + j * subW;
              s += `<line x1="${x.toFixed(2)}" y1="${y}" x2="${x.toFixed(2)}" y2="${y + barH}" stroke="#0F172A" stroke-width="2" stroke-dasharray="4,3" />`;
            }
          }
          s += `<rect x="${padL}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="none" stroke="#0F172A" stroke-width="2.6" />`;
          return s;
        }

        let svg = '';
        if (stage === 0) {
          svg += drawBar(p.aN, p.aD, 28, '#2563EB', `Parcela 1: ${p.realA}`);
          svg += drawBar(p.bN, p.bD, 108, '#EA580C', `Parcela 2: ${p.realB}`);
          svg += `<text x="${padL + barW / 2}" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#64748B">As peças têm tamanhos diferentes! Clique em "Subdividir" para igualar a unidade.</text>`;
        } else if (stage === 1) {
          svg += drawBar(p.aConvN, p.commonD, 28, '#2563EB', `Parcela 1 trocada: ${p.aN}/${p.aD} = ${p.aConvN}/${p.commonD}`, p.commonD);
          svg += drawBar(p.bConvN, p.commonD, 108, '#EA580C', `Parcela 2 na mesma unidade: ${p.bN}/${p.bD} = ${p.bConvN}/${p.commonD}`, p.commonD);
          svg += `<text x="${padL + barW / 2}" y="198" text-anchor="middle" font-size="14.5" font-weight="900" fill="#7C3AED">✓ Agora todas as peças valem 1/${p.commonD}! Clique em "Juntar tudo!".</text>`;
        } else {
          const sumN = p.aConvN + p.bConvN;
          svg += drawBar(p.aConvN, p.commonD, 22, '#2563EB', `${p.aConvN}/${p.commonD}`);
          svg += drawBar(p.bConvN, p.commonD, 96, '#EA580C', `${p.bConvN}/${p.commonD}`);
          // Barra resultado somada com duas cores
          const y3 = 178;
          const segW = barW / p.commonD;
          svg += `<text x="${padL - 10}" y="${y3 + barH / 2 + 5}" text-anchor="end" font-size="17" font-weight="900" fill="#059669">${sumN}/${p.commonD}</text>`;
          svg += `<text x="${padL}" y="${y3 - 6}" font-size="12" font-weight="900" fill="#059669">Resultado: ${p.realSum}</text>`;
          for (let i = 0; i < p.commonD; i++) {
            let fill = '#FFFFFF';
            if (i < p.aConvN) fill = '#2563EB';
            else if (i < sumN) fill = '#EA580C';
            svg += `<rect x="${(padL + i * segW).toFixed(2)}" y="${y3}" width="${segW.toFixed(2)}" height="${barH}" fill="${fill}" stroke="#334155" stroke-width="1.8" />`;
          }
          svg += `<rect x="${padL}" y="${y3}" width="${barW}" height="${barH}" rx="6" fill="none" stroke="#059669" stroke-width="3.2" />`;
        }

        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
      }

      function buildQuizVisualSVG(kind) {
        if (kind === 'bar-half-ten') {
          let s = `<rect x="20" y="20" width="200" height="40" fill="#2563EB" stroke="#0F172A" stroke-width="2.5" />`;
          s += `<rect x="220" y="20" width="200" height="40" fill="#FFF" stroke="#0F172A" stroke-width="2.5" />`;
          s += `<text x="120" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#FFF">1/2 L</text>`;
          for (let i = 0; i < 10; i++) {
            s += `<rect x="${20 + i * 40}" y="82" width="40" height="40" fill="${i < 5 ? '#E0F2FE' : '#FFF'}" stroke="#334155" stroke-width="1.8" />`;
            s += `<text x="${40 + i * 40}" y="106" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0369A1">1/10</text>`;
          }
          s += `<line x1="220" y1="14" x2="220" y2="128" stroke="#059669" stroke-width="3" stroke-dasharray="5,4" />`;
          return `<svg viewBox="0 0 440 140" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'same-sixths') {
          let s = '';
          for (let i = 0; i < 6; i++) {
            const fill = i < 2 ? '#2563EB' : (i < 5 ? '#EA580C' : '#FFF');
            s += `<rect x="${20 + i * 66}" y="42" width="66" height="52" fill="${fill}" stroke="#0F172A" stroke-width="2.2" />`;
            s += `<text x="${53 + i * 66}" y="73" text-anchor="middle" font-size="14" font-weight="900" fill="${i < 5 ? '#FFF' : '#94A3B8'}">1/6</text>`;
          }
          return `<svg viewBox="0 0 440 130" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'ruler-14') {
          let s = `<rect x="20" y="44" width="400" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5" />`;
          s += `<rect x="40" y="44" width="252" height="16" fill="#2563EB" fill-opacity="0.32" />`;
          for (let i = 0; i <= 20; i++) {
            const x = 40 + i * 18;
            const big = i % 10 === 0;
            s += `<line x1="${x}" y1="44" x2="${x}" y2="${big ? 74 : 58}" stroke="#0F172A" stroke-width="${big ? 2.5 : 1.4}" />`;
            if (big) s += `<text x="${x}" y="92" text-anchor="middle" font-size="14" font-weight="900">${i / 10} cm</text>`;
          }
          s += `<line x1="292" y1="22" x2="292" y2="108" stroke="#2563EB" stroke-width="3" stroke-dasharray="4,3" />`;
          s += `<text x="292" y="18" text-anchor="middle" font-size="13" font-weight="900" fill="#2563EB">14 mm</text>`;
          return `<svg viewBox="0 0 440 120" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
        }
        if (kind === 'clock-40') {
          return buildClockSVG([
            { den: 2, min: 30, color: '#2563EB', label: '1/2 h' },
            { den: 6, min: 10, color: '#7C3AED', label: '1/6 h' }
          ]);
        }
        return buildScaleSVG([
          { den: 2, g: 500, color: '#2563EB', label: '1/2 kg' },
          { den: 4, g: 250, color: '#EA580C', label: '1/4 kg' }
        ]);
      }

      function renderTab5() {
        const sm = state.same;
        let bodyHTML = '';

        if (sm.mode === 'lab') {
          const p = SWAP_PRESETS[sm.presetIdx];
          bodyHTML = `
            <div class="same-grid">
              <div class="card">
                <div class="card-title">
                  <span>Troca de Unidades · ${p.label}</span>
                  <span class="badge badge-purple">Unidade comum: 1/${p.commonD}</span>
                </div>
                <div class="svg-box">${buildSwapSVG(p, sm.stage)}</div>
              </div>

              <div class="card card-scroll" style="justify-content:space-between; gap:10px;">
                <div>
                  <div class="card-title"><span>Escolha uma situação</span></div>
                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                    ${SWAP_PRESETS.map((pr, idx) => `
                      <button class="btn btn-sm ${sm.presetIdx === idx ? 'btn-blue' : ''}" data-swap-preset="${idx}">${pr.label}</button>
                    `).join('')}
                  </div>
                </div>

                <div style="padding:10px; border-radius:12px; background:var(--bg-soft); border:1.5px solid var(--border); font-size:13px; line-height:1.38; color:var(--text-main);">
                  ${sm.stage === 0
                    ? `Temos <strong>${p.realA}</strong> + <strong>${p.realB}</strong>. Primeiro precisamos cortar na <strong>mesma unidade (1/${p.commonD})</strong>.`
                    : sm.stage === 1
                    ? p.explain
                    : `🎉 <strong>Pronto!</strong> ${p.aConvN}/${p.commonD} + ${p.bConvN}/${p.commonD} = <strong>${p.aConvN + p.bConvN}/${p.commonD}</strong> (${p.realSum})!`}
                </div>

                <div style="display:flex; flex-direction:column; gap:6px;">
                  <button class="btn btn-purple" id="swapSubdiv" ${sm.stage >= 1 ? 'disabled' : ''}>
                    ✂️ 1. Subdividir para a mesma unidade (1/${p.commonD})
                  </button>
                  <button class="btn btn-green" id="swapJoin" ${sm.stage !== 1 ? 'disabled' : ''}>
                    ➕ 2. Juntar tudo!
                  </button>
                  ${sm.stage > 0 ? `<button class="btn btn-sm" id="swapReset">↩ Recomeçar esta troca</button>` : ''}
                </div>
              </div>
            </div>`;
        } else {
          // DESAFIO RELÂMPAGO
          if (sm.quizDone) {
            const stars = '⭐'.repeat(sm.quizScore) + '☆'.repeat(QUIZ_QUESTIONS.length - sm.quizScore);
            bodyHTML = `
              <div class="card pulse-pop" style="flex:1; align-items:center; justify-content:center; gap:14px; text-align:center;">
                <div style="font-size:38px;">${stars}</div>
                <h2 style="font-size:22px; font-weight:900; color:var(--green);">Desafio Relâmpago Concluído!</h2>
                <p style="font-size:15px; color:var(--text-muted); max-width:420px;">
                  Você acertou <strong>${sm.quizScore} de ${QUIZ_QUESTIONS.length}</strong> perguntas sobre unidades fracionárias. Agora a turma está pronta para <strong>Operações com Frações (Parte 2)</strong>!
                </p>
                <button class="btn btn-blue" id="quizRestart">🔄 Jogar novamente</button>
              </div>`;
          } else {
            const q = QUIZ_QUESTIONS[sm.quizIdx];
            const pct = ((sm.quizIdx + (sm.quizAnswered ? 1 : 0)) / QUIZ_QUESTIONS.length) * 100;

            bodyHTML = `
              <div class="quiz-grid">
                <div class="card">
                  <div class="card-title">
                    <span>Pergunta ${sm.quizIdx + 1} de ${QUIZ_QUESTIONS.length}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
                      <span class="badge badge-amber">⭐ ${sm.quizScore}</span>
                    </div>
                  </div>
                  <div style="font-size:15.5px; font-weight:800; color:var(--text-main); margin-bottom:6px;">${q.prompt}</div>
                  <div class="svg-box">${buildQuizVisualSVG(q.visual)}</div>
                </div>

                <div class="card card-scroll" style="justify-content:space-between; gap:8px;">
                  <div class="card-title"><span>Escolha a resposta certa</span></div>
                  <div style="display:flex; flex-direction:column; gap:7px;">
                    ${q.opts.map((opt, idx) => {
                      let cls = '';
                      if (sm.quizAnswered) {
                        if (idx === q.correct) cls = 'is-correct pulse-pop';
                        else if (idx === sm.quizSelected) cls = 'is-wrong';
                      }
                      return `
                        <button class="xray-opt-btn ${cls}" style="font-size:14.5px; padding:10px 12px;" data-quiz-opt="${idx}" ${sm.quizAnswered ? 'disabled' : ''}>
                          ${opt}
                        </button>`;
                    }).join('')}
                  </div>
                  ${sm.quizAnswered ? `
                    <div class="feedback-box ${sm.quizSelected === q.correct ? 'ok pulse-pop' : 'err'}">
                      ${sm.quizSelected === q.correct ? '🎉 Correto! ' : '💡 Quase! '}${q.tip}
                    </div>
                    <button class="btn btn-green pulse-pop" id="quizNext" style="width:100%;">
                      ${sm.quizIdx + 1 < QUIZ_QUESTIONS.length ? 'Próxima Pergunta ▶' : 'Ver Resultado Final 🏆'}
                    </button>
                  ` : ''}
                </div>
              </div>`;
          }
        }

        return `
          <div class="same-shell">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; flex-shrink:0;">
              <div class="segmented">
                <button class="${sm.mode === 'lab' ? 'active' : ''}" data-same-mode="lab">✂️ Laboratório de Troca</button>
                <button class="${sm.mode === 'quiz' ? 'active' : ''}" data-same-mode="quiz">⚡ Desafio Relâmpago</button>
              </div>
              <span style="font-size:12px; font-weight:700; color:var(--text-muted);">Só somamos direto quando a unidade é igual!</span>
            </div>
            ${bodyHTML}
          </div>`;
      }

      /* =======================================================================
         6. ORQUESTRAÇÃO DA UI E EVENTOS
         ======================================================================= */
      const tabStage = document.getElementById('tabStage');
      const guideText = document.getElementById('guideText');
      const stepCounter = document.getElementById('stepCounter');
      const stepTitle = document.getElementById('stepTitle');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const soundToggle = document.getElementById('soundToggle');

      function render() {
        const t = state.activeTab;
        const stepsArr = TAB_STEPS[t];
        const sIdx = state.steps[t];
        const curStep = stepsArr[sIdx];

        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
          const on = idx === t;
          btn.classList.toggle('active', on);
          btn.setAttribute('aria-selected', String(on));
        });

        if (guideText) guideText.innerHTML = curStep.guide;
        if (stepCounter) stepCounter.textContent = `${sIdx + 1} / ${stepsArr.length}`;
        if (stepTitle) stepTitle.textContent = curStep.title;
        if (btnPrev) btnPrev.disabled = sIdx === 0;
        if (btnNext) btnNext.disabled = sIdx === stepsArr.length - 1;

        if (!tabStage) return;
        if (t === 0) tabStage.innerHTML = renderTab1();
        else if (t === 1) tabStage.innerHTML = renderTab2();
        else if (t === 2) tabStage.innerHTML = renderTab3();
        else if (t === 3) tabStage.innerHTML = renderTab4();
        else if (t === 4) tabStage.innerHTML = renderTab5();

        bindEvents();
      }

      function bindEvents() {
        const t = state.activeTab;

        // --- Eventos Aba 1 ---
        if (t === 0) {
          tabStage.querySelectorAll('[data-u1-den]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.u1.den = Number(btn.dataset.u1Den);
              state.u1.count = Math.min(state.u1.count, state.u1.den * state.u1.wholes);
              SoundFX.click();
              render();
            });
          });
          tabStage.querySelectorAll('[data-u1-wholes]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.u1.wholes = Number(btn.dataset.u1Wholes);
              state.u1.count = Math.min(state.u1.count, state.u1.den * state.u1.wholes);
              SoundFX.click();
              render();
            });
          });
          tabStage.querySelectorAll('[data-u1-click]').forEach(el => {
            el.addEventListener('click', () => {
              const target = Number(el.dataset.u1Click);
              state.u1.count = (state.u1.count === target) ? target - 1 : target;
              if (state.u1.count > 0 && state.u1.count % state.u1.den === 0) SoundFX.success();
              else SoundFX.snap(state.u1.count);
              render();
            });
          });
          document.getElementById('u1Add')?.addEventListener('click', () => {
            const maxC = state.u1.den * state.u1.wholes;
            if (state.u1.count < maxC) {
              state.u1.count++;
              if (state.u1.count % state.u1.den === 0) SoundFX.success();
              else SoundFX.snap(state.u1.count);
              render();
            }
          });
          document.getElementById('u1Sub')?.addEventListener('click', () => {
            if (state.u1.count > 0) {
              state.u1.count--;
              SoundFX.click();
              render();
            }
          });
          document.getElementById('u1Clear')?.addEventListener('click', () => {
            state.u1.count = 0;
            SoundFX.click();
            render();
          });
        }

        // --- Eventos Aba 2 (Raio-X) ---
        if (t === 1) {
          tabStage.querySelectorAll('[data-xray-lvl]').forEach(btn => {
            btn.addEventListener('click', () => {
              const lvl = Number(btn.dataset.xrayLvl);
              state.steps[1] = lvl - 1;
              resetXray(lvl, 0);
              SoundFX.tab();
              render();
            });
          });

          tabStage.querySelectorAll('[data-xray-l1]').forEach(btn => {
            btn.addEventListener('click', () => {
              const key = btn.dataset.xrayL1;
              const [on, od] = key.split('/').map(Number);
              const q = XRAY_L1[state.xray.idx % XRAY_L1.length];
              if (on === 1 && od === q.d) {
                state.xray.solved = true;
                state.xray.score++;
                state.xray.streak++;
                state.xray.feedback = {
                  ok: true,
                  msg: `🎉 Isso mesmo! Em ${q.n}/${q.d}, cada peça unitária vale 1/${q.d} (${leituraExtenso(1, q.d, true)}).`
                };
                SoundFX.success();
              } else {
                state.xray.streak = 0;
                state.xray.wrongKeys.push(key);
                let hint = `Olhe o denominador (${q.d}): ele diz em quantas partes o inteiro foi dividido.`;
                if (on === 1 && od === q.n) hint = `Pegadinha! ${q.n} é quantas peças temos (em cima). A unidade vem de baixo (${q.d})!`;
                else if (od === 1) hint = `${on}/1 vale ${on} inteiros! Uma unidade fracionária sempre tem 1 em cima.`;
                else if (on === od) hint = `${on}/${od} representa 1 inteiro todo, não apenas 1 peça unitária!`;
                state.xray.feedback = { ok: false, msg: `💡 ${hint} Tente outra opção!` };
                SoundFX.neutral();
              }
              render();
            });
          });

          tabStage.querySelectorAll('[data-l2-step]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [field, deltaStr] = btn.dataset.l2Step.split(':');
              const delta = Number(deltaStr);
              if (field === 'qty') state.xray.l2Qty = Math.max(1, Math.min(20, state.xray.l2Qty + delta));
              else state.xray.l2Den = Math.max(2, Math.min(20, state.xray.l2Den + delta));
              SoundFX.click();
              render();
            });
          });

          document.getElementById('xrayL2Check')?.addEventListener('click', () => {
            const q = XRAY_L2[state.xray.idx % XRAY_L2.length];
            if (state.xray.l2Qty === q.n && state.xray.l2Den === q.d) {
              state.xray.solved = true;
              state.xray.score++;
              state.xray.streak++;
              state.xray.feedback = {
                ok: true,
                msg: `🎉 Perfeito! ${q.n} × 1/${q.d} = ${q.n}/${q.d} (${leituraExtenso(q.n, q.d, true)}).`
              };
              SoundFX.success();
            } else {
              state.xray.streak = 0;
              let hint = `O número de cima (${q.n}) diz quantas peças e o de baixo (${q.d}) diz o tamanho 1/${q.d}!`;
              if (state.xray.l2Qty !== q.n && state.xray.l2Den === q.d) hint = `A unidade 1/${q.d} está certinha! Agora ajuste a quantidade de peças (${q.n}).`;
              else if (state.xray.l2Qty === q.n && state.xray.l2Den !== q.d) hint = `As ${q.n} peças estão certinhas! Agora ajuste a unidade no denominador (${q.d}).`;
              state.xray.feedback = { ok: false, msg: `💡 ${hint}` };
              SoundFX.neutral();
            }
            render();
          });

          tabStage.querySelectorAll('[data-xray-l3]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [fStr, kind] = btn.dataset.xrayL3.split(':');
              const [pn, pd] = fStr.split('/').map(Number);
              const q = XRAY_L3[state.xray.idx % XRAY_L3.length];
              const tf = q.target;
              state.xray.l3Picked = { n: pn, d: pd };

              if (kind === 'ok') {
                state.xray.solved = true;
                state.xray.score++;
                state.xray.streak++;
                state.xray.feedback = {
                  ok: true,
                  msg: `🎉 Exato! ${tf.n}/${tf.d} e ${pn}/${pd} usam a mesma unidade 1/${tf.d} — dá até para somar direto (${tf.n + pn}/${tf.d})!`
                };
                SoundFX.success();
              } else {
                state.xray.streak = 0;
                state.xray.wrongKeys.push(fStr);
                let hint = `Compare as barras: 1/${tf.d} e 1/${pd} têm tamanhos diferentes.`;
                if (kind === 'sameNum') hint = `Pegadinha do numerador igual! Mesmo com ${pn} peças, o tamanho delas é diferente (1/${tf.d} ≠ 1/${pd}).`;
                else if (kind === 'inverted') hint = `Pegadinha da inversão! ${pn}/${pd} trocou numerador por denominador — sua unidade é 1/${pd}.`;
                state.xray.feedback = { ok: false, msg: `💡 ${hint} Tente outra!` };
                SoundFX.neutral();
              }
              render();
            });
          });

          document.getElementById('xrayNext')?.addEventListener('click', () => {
            resetXray(state.xray.level, state.xray.idx + 1);
            SoundFX.step();
            render();
          });
        }

        // --- Eventos Aba 3 (No Dia a Dia) ---
        if (t === 2) {
          tabStage.querySelectorAll('[data-daily-mode]').forEach(btn => {
            btn.addEventListener('click', () => {
              const m = btn.dataset.dailyMode;
              state.daily.mode = m;
              state.steps[2] = m === 'clock' ? 0 : (m === 'jug' ? 1 : 2);
              SoundFX.tab();
              render();
            });
          });

          tabStage.querySelectorAll('[data-clock-add]').forEach(btn => {
            btn.addEventListener('click', () => {
              const den = Number(btn.dataset.clockAdd);
              const map = {
                2: { den: 2, min: 30, color: '#2563EB', label: '1/2 h' },
                4: { den: 4, min: 15, color: '#EA580C', label: '1/4 h' },
                6: { den: 6, min: 10, color: '#7C3AED', label: '1/6 h' }
              };
              const cur = state.daily.clockSlices.reduce((s, x) => s + x.min, 0);
              if (cur + map[den].min <= 60) {
                state.daily.clockSlices.push(map[den]);
                if (cur + map[den].min === 60) SoundFX.success();
                else SoundFX.snap(state.daily.clockSlices.length);
                render();
              }
            });
          });
          document.getElementById('clockUndo')?.addEventListener('click', () => {
            state.daily.clockSlices.pop();
            SoundFX.click();
            render();
          });
          document.getElementById('clockClear')?.addEventListener('click', () => {
            state.daily.clockSlices = [];
            SoundFX.click();
            render();
          });

          document.getElementById('jugAdd1')?.addEventListener('click', () => {
            if (state.daily.jugTenths + 1 <= 10) {
              state.daily.jugTenths += 1;
              if (state.daily.jugTenths === 10) SoundFX.success();
              else SoundFX.snap(state.daily.jugTenths);
              render();
            }
          });
          document.getElementById('jugAdd5')?.addEventListener('click', () => {
            if (state.daily.jugTenths + 5 <= 10) {
              state.daily.jugTenths += 5;
              if (state.daily.jugTenths === 10) SoundFX.success();
              else SoundFX.snap(state.daily.jugTenths);
              render();
            }
          });
          document.getElementById('jugSub1')?.addEventListener('click', () => {
            if (state.daily.jugTenths > 0) {
              state.daily.jugTenths -= 1;
              SoundFX.click();
              render();
            }
          });
          document.getElementById('jugClear')?.addEventListener('click', () => {
            state.daily.jugTenths = 0;
            SoundFX.click();
            render();
          });

          tabStage.querySelectorAll('[data-scale-add]').forEach(btn => {
            btn.addEventListener('click', () => {
              const den = Number(btn.dataset.scaleAdd);
              const map = {
                2:  { den: 2,  g: 500, color: '#2563EB', label: '1/2 kg' },
                4:  { den: 4,  g: 250, color: '#EA580C', label: '1/4 kg' },
                10: { den: 10, g: 100, color: '#059669', label: '1/10 kg' }
              };
              const cur = state.daily.scaleWeights.reduce((s, w) => s + w.g, 0);
              if (cur + map[den].g <= 2000) {
                state.daily.scaleWeights.push(map[den]);
                if (cur + map[den].g === 1000 || cur + map[den].g === 2000) SoundFX.success();
                else SoundFX.snap(state.daily.scaleWeights.length);
                render();
              }
            });
          });
          document.getElementById('scaleUndo')?.addEventListener('click', () => {
            state.daily.scaleWeights.pop();
            SoundFX.click();
            render();
          });
          document.getElementById('scaleClear')?.addEventListener('click', () => {
            state.daily.scaleWeights = [];
            SoundFX.click();
            render();
          });
        }

        // --- Eventos Aba 4 (Régua 1/10) ---
        if (t === 3) {
          tabStage.querySelectorAll('[data-ruler-obj]').forEach(btn => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.dataset.rulerObj);
              state.ruler.objIdx = idx;
              state.ruler.mm = RULER_OBJECTS[idx].mm;
              state.steps[3] = idx;
              SoundFX.click();
              render();
            });
          });
          document.getElementById('rulerDec')?.addEventListener('click', () => {
            if (state.ruler.mm > 0) {
              state.ruler.mm--;
              SoundFX.snap(state.ruler.mm);
              render();
            }
          });
          document.getElementById('rulerInc')?.addEventListener('click', () => {
            if (state.ruler.mm < 30) {
              state.ruler.mm++;
              SoundFX.snap(state.ruler.mm);
              render();
            }
          });

          const svgEl = document.getElementById('rulerSvg');
          if (svgEl) {
            let dragging = false;
            const updateFromClientX = (clientX, playSound) => {
              const rect = svgEl.getBoundingClientRect();
              if (!rect.width) return;
              // Mapeia coordenadas da tela para o viewBox (x0=40 .. xMax=640 em W=680)
              const relX = ((clientX - rect.left) / rect.width) * 680;
              const rawMm = Math.round(((relX - 40) / 600) * 30);
              const clamped = Math.max(0, Math.min(30, rawMm));
              if (clamped !== state.ruler.mm) {
                state.ruler.mm = clamped;
                if (playSound) SoundFX.snap(clamped);
                render();
              }
            };
            svgEl.addEventListener('pointerdown', (e) => {
              dragging = true;
              try { svgEl.setPointerCapture(e.pointerId); } catch (_) {}
              updateFromClientX(e.clientX, true);
            });
            svgEl.addEventListener('pointermove', (e) => {
              if (!dragging) return;
              updateFromClientX(e.clientX, false);
            });
            svgEl.addEventListener('pointerup', () => { dragging = false; });
            svgEl.addEventListener('pointercancel', () => { dragging = false; });
          }
        }

        // --- Eventos Aba 5 (Mesma Unidade) ---
        if (t === 4) {
          tabStage.querySelectorAll('[data-same-mode]').forEach(btn => {
            btn.addEventListener('click', () => {
              const m = btn.dataset.sameMode;
              state.same.mode = m;
              state.steps[4] = m === 'lab' ? 0 : 1;
              SoundFX.tab();
              render();
            });
          });

          tabStage.querySelectorAll('[data-swap-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.same.presetIdx = Number(btn.dataset.swapPreset);
              state.same.stage = 0;
              SoundFX.click();
              render();
            });
          });

          document.getElementById('swapSubdiv')?.addEventListener('click', () => {
            state.same.stage = 1;
            SoundFX.snap(4);
            render();
          });
          document.getElementById('swapJoin')?.addEventListener('click', () => {
            state.same.stage = 2;
            SoundFX.success();
            render();
          });
          document.getElementById('swapReset')?.addEventListener('click', () => {
            state.same.stage = 0;
            SoundFX.click();
            render();
          });

          tabStage.querySelectorAll('[data-quiz-opt]').forEach(btn => {
            btn.addEventListener('click', () => {
              if (state.same.quizAnswered) return;
              const idx = Number(btn.dataset.quizOpt);
              const q = QUIZ_QUESTIONS[state.same.quizIdx];
              state.same.quizAnswered = true;
              state.same.quizSelected = idx;
              if (idx === q.correct) {
                state.same.quizScore++;
                SoundFX.success();
              } else {
                SoundFX.neutral();
              }
              render();
            });
          });

          document.getElementById('quizNext')?.addEventListener('click', () => {
            if (state.same.quizIdx + 1 < QUIZ_QUESTIONS.length) {
              state.same.quizIdx++;
              state.same.quizAnswered = false;
              state.same.quizSelected = null;
              SoundFX.step();
            } else {
              state.same.quizDone = true;
              SoundFX.success();
            }
            render();
          });

          document.getElementById('quizRestart')?.addEventListener('click', () => {
            state.same.quizIdx = 0;
            state.same.quizScore = 0;
            state.same.quizAnswered = false;
            state.same.quizSelected = null;
            state.same.quizDone = false;
            SoundFX.tab();
            render();
          });
        }
      }

      /* =======================================================================
         7. CONTROLES GLOBAIS (ABAS, RODAPÉ ◀ 1/N ▶, SOM, TECLADO)
         ======================================================================= */
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.tab);
          if (idx === state.activeTab) return;
          state.activeTab = idx;
          TAB_STEPS[idx][state.steps[idx]].apply();
          SoundFX.tab();
          render();
        });
      });

      btnPrev?.addEventListener('click', () => {
        const t = state.activeTab;
        if (state.steps[t] > 0) {
          state.steps[t]--;
          TAB_STEPS[t][state.steps[t]].apply();
          SoundFX.step();
          render();
        }
      });

      btnNext?.addEventListener('click', () => {
        const t = state.activeTab;
        if (state.steps[t] < TAB_STEPS[t].length - 1) {
          state.steps[t]++;
          TAB_STEPS[t][state.steps[t]].apply();
          SoundFX.step();
          render();
        }
      });

      soundToggle?.addEventListener('click', () => {
        const on = SoundFX.toggle();
        soundToggle.textContent = on ? '🔊' : '🔇';
        soundToggle.classList.toggle('muted', !on);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && btnNext && !btnNext.disabled) btnNext.click();
        if (e.key === 'ArrowLeft' && btnPrev && !btnPrev.disabled) btnPrev.click();
      });

      // Inicialização imediata da Aba 1
      TAB_STEPS[0][0].apply();
      render();
    });
  </script>
